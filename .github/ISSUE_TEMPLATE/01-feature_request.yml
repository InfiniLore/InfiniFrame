name: 🚀 Feature request
description: Suggest an idea or improvement
title: "Feature | "
labels: [ "enhancement" ]

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Feature Request
        Thanks for suggesting an idea! Please provide as much detail as possible so we can evaluate it effectively.

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How significant is this feature?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: Describe the limitation, missing capability, or pain point.
      placeholder: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What happens today? What are the limitations?

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like to see.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches or workarounds you've considered?

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe a real-world scenario where this feature would be used.

  - type: textarea
    id: code_example
    attributes:
      label: Code example
      description: Optional code snippet illustrating the feature or problem.
      render: csharp

  - type: textarea
    id: implementation
    attributes:
      label: Technical proposal
      description: "Optional: suggest API design, architecture, or implementation approach."

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, references, or extra details.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: This is not a support question
          required: true