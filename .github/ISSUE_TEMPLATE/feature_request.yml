name: Feature request
description: Suggest an idea or improvement
title: "FEATURE | "
labels: ["feature" ]

body:
  - type: markdown
    attributes:
      value: |
        ## 🚀 Feature Request
        Thanks for suggesting an idea! Please provide as much detail as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? What are you trying to achieve?
      placeholder: I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other solutions or workarounds you've considered?

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe a real-world scenario where this feature would be used
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How important is this feature?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: What area does this affect?
      multiple: true
      options:
        - InfiniFrame
        - InfiniFrame.Blazor
        - InfiniFrame.BlazorWebView
        - InfiniFrame.Js
        - InfiniFrame.Native
        - InfiniFrame.Shared
        - InfiniFrame.WebServer
        - InfiniFrameExample
        - InfinIFrameTests
        - Other

  - type: textarea
    id: implementation
    attributes:
      label: Possible implementation
      description: Optional: suggest API design, structure, or approach

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, references, etc.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: This is not a support question
          required: true
