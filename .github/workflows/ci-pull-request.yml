#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: Full Test Suite (Pull Request)"

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

permissions:
    contents: read
    packages: read

concurrency:
    group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    tests:
        name: "CI: pull-request-tests"
        uses: ./.github/workflows/shared-testing.yml
        with:
            # Pull-request workflows test the merge commit selected by GitHub.
            # Do not resolve or checkout the fork head SHA.
            pr_number: ''
            checkout_ref: ''
            run_windows: true
            run_windows_playwright: true
            run_linux: true
            run_macos: true
            run_docs: true
            run_trim_aot: true
            enable_test_exports: true
            enable_coverage: false
