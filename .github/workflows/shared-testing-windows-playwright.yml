name: "Shared: Windows Playwright Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                required: false
                default: ''
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true

jobs:
    windows-playwright:
        name: CI Testing - Windows Playwright
        runs-on: windows-latest
        timeout-minutes: 75
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        permissions:
            contents: read
            statuses: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set Playwright Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows Playwright
                    state: pending
                    status-description: Windows Playwright tests in progress (net8.0, net9.0, net10.0)
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~\.nuget\packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/Directory.Packages.props') }}
                    restore-keys: |
                        ${{ runner.os }}-nuget-

            -   name: Setup Native dependencies
                # noinspection UndefinedAction
                uses: ./.github/actions/setup-dependencies-native
                # noinspection UndefinedParamsPresent
                with:
                    apt-cache-version: 1.0
                    brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-windows-playwright.yml') }}
                    brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-

            -   name: Prepare WebView2 Cache Directory
                shell: pwsh
                run: New-Item -ItemType Directory -Path ".cache\webview2" -Force | Out-Null

            -   name: Cache WebView2
                id: cache-webview2
                uses: actions/cache@v5
                with:
                    path: .cache\webview2
                    key: webview2-installer-${{ runner.os }}

            -   name: Install WebView2 Runtime
                shell: pwsh
                run: |
                    $installer = "$PWD\.cache\webview2\MicrosoftEdgeWebview2Setup.exe"
                    if (-Not (Test-Path $installer)) {
                      Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $installer
                    }
                    Start-Process -FilePath $installer -ArgumentList "/silent", "/install" -Wait

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.Playwright.slnf /p:NoWarn=NU1503

            -   name: Build Release
                run: |
                    dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj `
                      --configuration Release `
                      --no-restore `
                      /p:SolutionDir=$GITHUB_WORKSPACE/

                    dotnet build InfiniFrame.GitHubActions.Testing.Playwright.slnf `
                      --configuration Release `
                      --no-restore `
                      /p:SolutionDir=$GITHUB_WORKSPACE/

            -   name: Cache Playwright Browsers
                id: cache-playwright
                uses: actions/cache@v5
                with:
                    path: ~\AppData\Local\ms-playwright
                    key: playwright-${{ runner.os }}-${{ hashFiles('tests/InfiniFrameTests.Playwright.WebApp.React/InfiniFrameTests.Playwright.WebApp.React.csproj', 'tests/InfiniFrameTests.Playwright.WebApp.Vue/InfiniFrameTests.Playwright.WebApp.Vue.csproj', 'tests/InfiniFrameTests.Playwright.BlazorWebView/InfiniFrameTests.Playwright.BlazorWebView.csproj') }}
                    restore-keys: |
                        playwright-${{ runner.os }}-

            -   name: Install Playwright Browsers
                if: steps.cache-playwright.outputs.cache-hit != 'true'
                working-directory: tests/InfiniFrameTests.Playwright.WebApp.Vue
                shell: pwsh
                run: |
                    $scripts = @(
                      "bin/Release/net10.0/playwright.ps1",
                      "bin/Release/net9.0/playwright.ps1",
                      "bin/Release/net8.0/playwright.ps1"
                    )
                    $script = $scripts | Where-Object { Test-Path $_ } | Select-Object -First 1
                    if (-Not $script) {
                      throw "Playwright install script not found in bin/Release/(net8.0|net9.0|net10.0)"
                    }

                    pwsh $script install

            -   name: Verify Native Binaries
                shell: pwsh
                run: |
                    $frameworks = @("net8.0", "net9.0", "net10.0")
                    $projects = @(
                      "tests/InfiniFrameTests.Playwright.WebApp.React",
                      "tests/InfiniFrameTests.Playwright.WebApp.Vue",
                      "tests/InfiniFrameTests.Playwright.BlazorWebView"
                    )
                    foreach ($framework in $frameworks) {
                      foreach ($project in $projects) {
                        $binPath = "$project/bin/Release/$framework"
                        foreach ($dll in @("InfiniFrame.Native.dll", "WebView2Loader.dll")) {
                          $fullPath = Join-Path $binPath $dll
                          if (-Not (Test-Path $fullPath)) {
                            throw "$dll missing in $binPath"
                          }
                        }
                      }
                    }

            -   name: Export Actions Runtime
                uses: actions/github-script@v9
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

            -   name: Run Playwright (net8.0)
                id: playwright_net8
                continue-on-error: true
                timeout-minutes: 20
                run: dotnet test --solution InfiniFrame.GitHubActions.Testing.Playwright.slnf --configuration Release --no-build --no-restore --framework net8.0

            -   name: Run Playwright (net9.0)
                id: playwright_net9
                continue-on-error: true
                timeout-minutes: 20
                run: dotnet test --solution InfiniFrame.GitHubActions.Testing.Playwright.slnf --configuration Release --no-build --no-restore --framework net9.0

            -   name: Run Playwright (net10.0)
                id: playwright_net10
                continue-on-error: true
                timeout-minutes: 20
                run: dotnet test --solution InfiniFrame.GitHubActions.Testing.Playwright.slnf --configuration Release --no-build --no-restore --framework net10.0

            -   name: Fail if any framework failed
                if: always()
                id: aggregate
                shell: pwsh
                run: |
                    $results = @(
                        @{ name = "net8.0"; outcome = "${{ steps.playwright_net8.outcome }}" },
                        @{ name = "net9.0"; outcome = "${{ steps.playwright_net9.outcome }}" },
                        @{ name = "net10.0"; outcome = "${{ steps.playwright_net10.outcome }}" }
                    )
                    
                    $failed = @()
                    
                    foreach ($r in $results) {
                        if ($r.outcome -eq "success") {
                            Write-Host "✅ $($r.name) passed"
                        } else {
                            Write-Host "❌ $($r.name) failed"
                            $failed += $r.name
                        }
                    }
                    
                    if ($failed.Count -gt 0) {
                        $msg = "Windows Playwright tests failed: $($failed -join ', ')"
                        
                        # expose output for later steps
                        "failure_message=$msg" >> $env:GITHUB_OUTPUT
                        
                        Write-Host ""
                        Write-Host "❌ $msg"
                        exit 1
                    }
                    
                    $msg = "Windows Playwright tests passed (net8.0, net9.0, net10.0)"
                    "failure_message=$msg" >> $env:GITHUB_OUTPUT
                    
                    Write-Host ""
                    Write-Host "✅ All frameworks passed"

            -   name: Update Playwright Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows Playwright
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: ${{ steps.aggregate.outputs.failure_message }}
                    failure-description: ${{ steps.aggregate.outputs.failure_message }}
