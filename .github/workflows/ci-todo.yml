#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: Todo Sync"
on:
    push:
        branches:
            - core
        paths-ignore:
            - .github/workflows/ci-todo.yml

jobs:
    todo-to-issue:
        name: "CI: todo-sync"
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            issues: write
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Sync Todo Issues
                uses: alstr/todo-to-issue-action@37bb7b56e58569ef273b60678048030a7f0c261a # v5
                with:
                    PROJECT: organization/InfiniLore/1
                    PROJECTS_SECRET: ${{ secrets.PROJECTS_SECRET }}
                    ISSUE_TEMPLATE: |
                        ### 📝 Todo : ** {{ title }} **
                        
                        **Description:**  
                        {{ body }}
                        
                        **Code Snippet:**
                        {{ snippet }}
                        
                        **File:**  
                        {{ url }}
                    IDENTIFIERS: '[{"name": "TODO", "labels": ["todo"]}]'
                    CLOSE_ISSUES: "true"
