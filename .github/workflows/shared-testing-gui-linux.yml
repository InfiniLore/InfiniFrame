name: "Shared: GUI Tests Linux"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                default: ''
                required: false
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true

jobs:
    linux-gui:
        name: Linux GUI (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-latest
                        arch: x64
                        libName: linux
                    -   os: ubuntu-24.04-arm
                        arch: arm64
                        libName: linux
        permissions:
            contents: read
            statuses: write
            checks: write
        steps:
            -   uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set Linux Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - GUI/Linux/${{ matrix.arch }}
                    state: pending
                    status-description: Linux tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~/.nuget/packages
                    key: ${{ matrix.os }}-${{ matrix.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/Directory.Packages.props') }}
                    restore-keys: |
                        ${{ matrix.os }}-${{ matrix.arch }}-nuget-

            -   name: Setup CMake
                uses: lukka/get-cmake@latest

            -   name: Cache CMake build
                uses: actions/cache@v5
                with:
                    path: |
                        src/InfiniFrame.Native/build
                    key: ${{ matrix.os }}-${{ matrix.arch }}-cmake-v2-${{ hashFiles('src/InfiniFrame.Native/**') }}
                    restore-keys: |
                        ${{ matrix.os }}-${{ matrix.arch }}-cmake-v2-

            -   name: Install Desktop Deps
                uses: awalsh128/cache-apt-pkgs-action@latest
                with:
                    packages: >
                        pkg-config
                        gnome-shell
                        gnome-session
                        gnome-settings-daemon
                        mutter
                        xvfb
                        x11-utils
                        x11-xserver-utils
                        dbus-x11
                        at-spi2-core
                        gsettings-desktop-schemas
                        libnotify4
                        libnotify-dev
                        libwebkit2gtk-4.1-dev
                        libgtk-3-dev
                        libglib2.0-dev
                        libgdk-pixbuf2.0-dev
                        libpango1.0-dev
                        libatk1.0-dev
                        libharfbuzz-dev
                        libepoxy-dev
                        libx11-dev
                        fonts-liberation
                        xfonts-base
                    version: 1.0

            -   name: Compile GSettings schemas
                run: sudo glib-compile-schemas /usr/share/glib-2.0/schemas/

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503

            -   name: Build Release
                run: |
                    dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj \
                      --configuration Release \
                      --no-restore \
                      /p:SolutionDir="${{ github.workspace }}/" \
                      /p:Platform=${{ matrix.arch }}

                    dotnet build InfiniFrame.GitHubActions.Testing.slnf \
                      --configuration Release \
                      --no-restore

            -   name: Verify Native Binaries
                uses: ./.github/actions/validate-native-test-binaries

            -   name: Export Actions Runtime
                uses: actions/github-script@v8
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

            -   name: Run GUI Tests
                run: |
                    echo "Starting desktop environment..."

                    eval "$(dbus-launch --sh-syntax)"

                    echo "Launching Xvfb..."
                    Xvfb :99 \
                      -screen 0 1920x1080x24 \
                      -ac \
                      +extension GLX \
                      +extension RANDR \
                      +extension RENDER \
                      -nolisten tcp \
                      -noreset &> xvfb.log &

                    export DISPLAY=:99
                    export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
                    export XDG_SESSION_TYPE=x11
                    export XDG_SESSION_CLASS=user
                    export XDG_SESSION_DESKTOP=ubuntu
                    export XDG_CURRENT_DESKTOP=ubuntu:GNOME
                    export DESKTOP_SESSION=ubuntu

                    mkdir -p "$XDG_RUNTIME_DIR"
                    chmod 700 "$XDG_RUNTIME_DIR"

                    echo "Waiting for X server..."
                    timeout 30 bash -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done' || {
                      echo "X server failed to start."
                      exit 1
                    }

                    echo "Starting Mutter window manager..."
                    mutter --x11 --replace --sm-disable &> mutter.log &

                    timeout 20 bash -c 'until pgrep -x mutter >/dev/null; do sleep 1; done' || {
                      echo "Mutter failed to start or crashed."
                      echo "=== Diagnostic: X11 info ==="
                      xdpyinfo | head -3 || echo "xdpyinfo failed"
                      echo "=== Diagnostic: D-Bus ==="
                      echo "$DBUS_SESSION_BUS_ADDRESS"
                      exit 1
                    }

                    echo "Mutter is running:"
                    ps aux | grep "[m]utter" || echo "Mutter missing unexpectedly"

                    timeout 5 xwininfo -root >/dev/null 2>&1 && echo "Window manager responding" || {
                      echo "Window manager not responding"
                      exit 1
                    }

                    echo "=== Environment Status ==="
                    echo "Display: $DISPLAY"
                    echo "Desktop: $XDG_CURRENT_DESKTOP"
                    echo "Session: $XDG_SESSION_DESKTOP"
                    echo "D-Bus: $DBUS_SESSION_BUS_ADDRESS"
                    xdpyinfo | head -3 || true

                    echo "=== Running Tests ==="
                    dotnet test --solution InfiniFrame.GitHubActions.Testing.slnf \
                      --configuration Release \
                      --no-build \
                      --no-restore

            -   name: Show Test Logs
                if: failure()
                run: |
                    echo "=== Xvfb/Mutter logs ==="
                    cat xvfb.log
                    cat mutter.log

                    echo "=== Test Run Failed - Displaying Logs ==="

                    strip_ansi() {
                      sed 's/\x1B\[[0-9;]*[a-zA-Z]//g'
                    }

                    find . -name "*.log" -path "*/TestResults/*" -type f | while read -r logfile; do
                      echo "=== Content of $logfile ==="
                      strip_ansi < "$logfile" || echo "Could not read $logfile"
                      echo ""
                    done

                    find . -name "*.trx" -path "*/TestResults/*" -type f | while read -r trxfile; do
                      echo "=== Content of $trxfile ==="
                      strip_ansi < "$trxfile" || echo "Could not read $trxfile"
                      echo ""
                    done

                    echo "=== All files in TestResults directories ==="
                    find . -path "*/TestResults/*" -type f -ls || echo "No TestResults directories found"

            -   name: Upload Test Logs
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: test-logs-linux-${{ matrix.arch }}
                    path: |
                        **/TestResults/*.log
                        **/TestResults/*.trx

            -   name: Update Linux Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - GUI/Linux/${{ matrix.arch }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: Linux tests passed
                    failure-description: Linux tests failed
