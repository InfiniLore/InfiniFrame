#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: Update Native Vendor Deps"

on:
    schedule:
        -   cron: "0 5 * * 1"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    update-native-vendor-deps:
        name: "CI: update-native-deps"
        runs-on: ubuntu-26.04
        
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Setup Python
                uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
                with:
                    python-version: '3.x'

            -   name: Update vendored native dependencies
                env:
                    GITHUB_TOKEN: ${{ github.token }}
                run: python scripts/update_native_vendor_deps.py

            -   name: Detect changes
                id: detect_changes
                shell: bash
                run: |
                    if git diff --quiet; then
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    else
                      echo "has_changes=true" >> "$GITHUB_OUTPUT"
                    fi

            -   name: Create pull request
                if: steps.detect_changes.outputs.has_changes == 'true'
                uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
                with:
                    # Prefer a PAT/App token if org policy blocks PR creation by GITHUB_TOKEN.
                    token: ${{ secrets.INFINI_BOT_TOKEN || github.token }}
                    commit-message: "chore(native): update simdjson/simdutf vendor deps"
                    title: "chore(native): update simdjson/simdutf vendor deps"
                    body: |
                        Automated weekly refresh of vendored native dependencies in `InfiniFrame.Native`.
                        
                        Updated by `scripts/update_native_vendor_deps.py` from latest GitHub releases.
                    branch: "chore/update-native-vendor-deps"
                    delete-branch: true
                    labels: |
                        dependencies
                        InfiniFrame.Native
