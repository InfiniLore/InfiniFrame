name: "Shared: GUI Tests Windows"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                required: false
                default: ''
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true

jobs:
    windows-gui:
        name: Windows GUI (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        arch: x64
                        libName: windows
                    -   os: windows-11-arm
                        arch: arm64
                        libName: windows
        permissions:
            contents: read
            statuses: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set Windows Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    state: pending
                    status-description: Windows tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~\.nuget\packages
                    key: ${{ matrix.os }}-${{ matrix.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/Directory.Packages.props') }}
                    restore-keys: |
                        ${{ matrix.os }}-${{ matrix.arch }}-nuget-

            -   name: Setup CMake
                uses: lukka/get-cmake@latest
                with:
                    cmakeVersion: "4.0.0"

            -   name: Cache CMake build
                uses: actions/cache@v5
                with:
                    path: |
                        src\InfiniFrame.Native\build
                    key: ${{ matrix.os }}-${{ matrix.arch }}-cmake-v2-${{ hashFiles('src/InfiniFrame.Native/**') }}
                    restore-keys: |
                        ${{ matrix.os }}-${{ matrix.arch }}-cmake-v2-

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503

            -   name: Build Release
                run: |
                    dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj `
                      --configuration Release `
                      --no-restore `
                      -p:SolutionDir="${{ github.workspace }}/" `
                      -p:Platform=${{ matrix.arch }}

                    dotnet build InfiniFrame.GitHubActions.Testing.slnf `
                      --configuration Release `
                      --no-restore

            -   name: Verify Native Binaries
                run: |
                    $nativeDll = "tests/InfiniFrameTests/bin/Release/net9.0/InfiniFrame.Native.dll"
                    $webView2 = "tests/InfiniFrameTests/bin/Release/net9.0/WebView2Loader.dll"

                    if (-Not (Test-Path $nativeDll)) {
                      Write-Host "ERROR: InfiniFrame.Native.dll NOT found in test output!"
                      Exit 1
                    }

                    if (-Not (Test-Path $webView2)) {
                      Write-Host "ERROR: WebView2Loader.dll NOT found in test output!"
                      Exit 1
                    }

                    Write-Host "All native DLLs present"

            -   name: Run Tests
                run: |
                    echo "Running tests on Windows..."
                    dotnet test --solution InfiniFrame.GitHubActions.Testing.slnf `
                      --configuration Release `
                      --no-build `
                      --no-restore

            -   name: Upload Test Logs
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: test-logs-windows-${{ matrix.arch }}
                    path: |
                        **/TestResults/*.log
                        **/TestResults/*.trx

            -   name: Update Windows Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: Windows tests passed
                    failure-description: Windows tests failed
