name: "CI: Python Script Tests"
on:
    pull_request:
        branches:
            - core
        paths:
            - .github/scripts/**
            - .github/workflows/shared-testing-python.yml
            - .github/workflows/ci-testing-pything.yml
    push:
        branches:
            - core
        paths:
            - .github/scripts/**
            - .github/workflows/shared-testing-python.yml
            - .github/workflows/ci-testing-pything.yml
    workflow_dispatch:

jobs:
    # noinspection UndefinedAction
    run:
        name: Run Python Script Tests
        uses: ./.github/workflows/shared-testing-python.yml
