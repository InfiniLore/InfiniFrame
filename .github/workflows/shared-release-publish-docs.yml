#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: release-docs"
on:
    workflow_call:
        inputs:
            checkout_ref:
                description: "Optional git ref (branch/tag/SHA) to build docs from"
                required: false
                type: string
                default: ""

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: "CI: docs/build"
        runs-on: ubuntu-26.04

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

            -   name: Read CI tool versions
                id: versions
                uses: ./.github/actions/read-tool-versions

            -   name: Setup Node
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
                with:
                    node-version: ${{ steps.versions.outputs.node }}

            -   name: Install Docusaurus Dependencies
                shell: bash
                run: npm install --prefix docs

            -   name: Build Docusaurus Site
                shell: bash
                run: npm --prefix docs run build

            -   name: Setup Pages
                uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

            -   name: Upload Pages Artifact
                uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
                with:
                    path: docs/build

    deploy:
        name: "CI: docs/deploy"
        needs: build
        runs-on: ubuntu-26.04
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            -   name: Deploy
                id: deployment
                uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
