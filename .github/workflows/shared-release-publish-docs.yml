name: "Shared: Release Docs"
on:
    workflow_call:
        inputs:
            checkout_ref:
                description: "Optional git ref (branch/tag/SHA) to build docs from"
                required: false
                type: string
                default: ""

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: Build Docs
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

            -   name: Setup Node
                uses: actions/setup-node@v6
                with:
                    node-version: 24

            -   name: Install Docusaurus Dependencies
                shell: bash
                run: npm install --prefix docs

            -   name: Build Docusaurus Site
                shell: bash
                run: npm --prefix docs run build

            -   name: Setup Pages
                uses: actions/configure-pages@v6

            -   name: Upload Pages Artifact
                uses: actions/upload-pages-artifact@v5
                with:
                    path: docs/build

    deploy:
        name: Deploy Docs
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            -   name: Deploy
                id: deployment
                uses: actions/deploy-pages@v5
