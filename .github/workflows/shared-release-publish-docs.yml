name: "Shared: Release Docs"
on:
    workflow_call:
        inputs:
            checkout_ref:
                description: "Optional git ref (branch/tag/SHA) to build docs from"
                required: false
                type: string
                default: ""

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:           
    build:
        name: Build Docs
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Install DocFX
                shell: bash
                run: |
                    dotnet tool install --global docfx --version 2.78.5
                    echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

            -   name: Setup Node
                uses: actions/setup-node@v6
                with:
                    node-version: 20
                    cache: npm
                    cache-dependency-path: |
                        package-lock.json
                        docs/package-lock.json

            -   name: Install Docusaurus Dependencies
                shell: bash
                run: npm ci --prefix docs

            -   name: Generate C# API Metadata
                run: docfx metadata docs/docfx.api.json

            -   name: Build C# API Site
                shell: bash
                run: |
                    set -euo pipefail

                    docfx build docs/docfx.api.json 2>&1 | tee /tmp/docfx-build.log
                    if grep -Eq '^[[:space:]]*[1-9][0-9]* warning\(s\)' /tmp/docfx-build.log; then
                      exit 1
                    fi

                    test -f docs/_site_api/api/cs/index.html

            -   name: Build Docusaurus Site
                shell: bash
                run: npm run docs:build

            -   name: Merge C# API Site Into Docusaurus Output
                shell: bash
                run: |
                    set -euo pipefail
                    mkdir -p docs/build/api
                    rm -rf docs/build/api/cs
                    cp -R docs/_site_api/api/cs docs/build/api/cs

            -   name: Setup Pages
                uses: actions/configure-pages@v6

            -   name: Upload Pages Artifact
                uses: actions/upload-pages-artifact@v4
                with:
                    path: docs/build

    deploy:
        name: Deploy Docs
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            -   name: Deploy
                id: deployment
                uses: actions/deploy-pages@v5
