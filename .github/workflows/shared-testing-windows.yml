name: "Shared: Windows Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                required: false
                default: ''
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true

jobs:
    windows:
        name: Windows (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        arch: x64
                        libName: windows
                        rid: win-x64
                    -   os: windows-11-arm
                        arch: arm64
                        libName: windows
                        rid: win-arm64
        permissions:
            contents: read
            statuses: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set Windows Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    state: pending
                    status-description: Windows tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~\.nuget\packages
                    key: ${{ matrix.os }}-${{ matrix.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/Directory.Packages.props') }}
                    restore-keys: |
                        ${{ matrix.os }}-${{ matrix.arch }}-nuget-

            -   name: Setup Native dependencies
                uses: ./.github/actions/setup-dependencies-native
                # noinspection UndefinedParamsPresent
                with:
                    apt-cache-version: 1.0
                    brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-windows.yml') }}
                    brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503

            -   name: Build Release
                run: |
                    dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj `
                      --configuration Release `
                      --no-restore `
                      -p:SolutionDir="${{ github.workspace }}/" `
                      -p:Platform=${{ matrix.arch }}

                    dotnet build InfiniFrame.GitHubActions.Testing.slnf `
                      --configuration Release `
                      --no-restore

            -   name: Verify Native Binaries
                uses: ./.github/actions/validate-native-test-binaries

            -   name: Export Actions Runtime
                uses: actions/github-script@v9
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

            -   name: Run Tests
                run: |
                    echo "Running tests on Windows..."
                    dotnet test --solution InfiniFrame.GitHubActions.Testing.slnf `
                      --configuration Release `
                      --no-build `
                      --no-restore

            -   name: Pack Tool E2E
                if: always()
                # noinspection UndefinedAction
                uses: ./.github/actions/packtool-e2e
                # noinspection UndefinedParamsPresent
                with:
                    project: examples/InfiniFrameExample.SingleFileExe/InfiniFrameExample.SingleFileExe.csproj
                    rid: ${{ matrix.rid }}
                    output: artifacts/pack-e2e/InfiniFrameExample.SingleFileExe
                    main-output-name: InfiniFrameExample.SingleFileExe.exe
                    forbidden-entries: |
                        wwwroot
                        InfiniFrame.Native.dll
                        WebView2Loader.dll
                        InfiniFrame.Native.so
                        InfiniFrame.Native.dylib

            -   name: Update Windows Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: Windows tests passed
                    failure-description: Windows tests failed
