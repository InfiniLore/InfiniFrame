name: "Shared: Windows Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                required: false
                default: ''
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true

jobs:
    windows:
        name: CI Testing - Windows (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        arch: x64
                        libName: windows
                        rid: win-x64
                    -   os: windows-11-arm
                        arch: arm64
                        libName: windows
                        rid: win-arm64
        permissions:
            contents: read
            statuses: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set Windows Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    state: pending
                    status-description: Windows tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x
                    cache: true
                    cache-dependency-path: |
                        **/*.csproj
                        **/*.props
                        **/Directory.Packages.props

            -   name: Setup Node
                uses: actions/setup-node@v6
                with:
                    node-version: 24
                    architecture: ${{ matrix.arch }}

            -   name: Setup Native dependencies
                # noinspection UndefinedAction
                uses: ./.github/actions/setup-dependencies-native
                # noinspection UndefinedParamsPresent
                with:
                    apt-cache-version: 1.0
                    brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-windows.yml') }}
                    brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503

            -   name: Build Release
                run: |
                    dotnet build src/InfiniFrame.NativeLib/InfiniFrame.NativeLib.csproj `
                      --configuration Release `
                      --no-restore `
                      -p:SolutionDir="${{ github.workspace }}/" `
                      -p:Platform=${{ matrix.arch }}

                    dotnet build InfiniFrame.GitHubActions.Testing.slnf `
                      --configuration Release `
                      --no-restore

            -   name: Verify Native Binaries
                # noinspection UndefinedAction
                uses: ./.github/actions/validate-native-test-binaries

            -   name: Prepare ARM64 Crash Diagnostics
                if: matrix.arch == 'arm64'
                shell: pwsh
                run: |
                    $dumpRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\crashdumps"
                    $diagRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\testdiag"
                    $resultRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\testresults"
                    New-Item -ItemType Directory -Force -Path $dumpRoot | Out-Null
                    New-Item -ItemType Directory -Force -Path $diagRoot | Out-Null
                    New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null

                    $werBase = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps"
                    New-Item -Path $werBase -Force | Out-Null
                    New-ItemProperty -Path $werBase -Name DumpFolder -PropertyType ExpandString -Value $dumpRoot -Force | Out-Null
                    New-ItemProperty -Path $werBase -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
                    New-ItemProperty -Path $werBase -Name DumpCount -PropertyType DWord -Value 20 -Force | Out-Null

                    foreach ($exe in @("testhost.exe", "InfiniFrameTests.exe", "dotnet.exe")) {
                      $exeKey = Join-Path $werBase $exe
                      New-Item -Path $exeKey -Force | Out-Null
                      New-ItemProperty -Path $exeKey -Name DumpFolder -PropertyType ExpandString -Value $dumpRoot -Force | Out-Null
                      New-ItemProperty -Path $exeKey -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
                      New-ItemProperty -Path $exeKey -Name DumpCount -PropertyType DWord -Value 20 -Force | Out-Null
                    }

                    Write-Host "Configured WER LocalDumps at $dumpRoot"

            -   name: Emit ARM64 Runtime/Binary Diagnostics
                if: matrix.arch == 'arm64'
                shell: pwsh
                run: |
                    function Get-PeMachine([string]$Path) {
                      $fs = [System.IO.File]::OpenRead($Path)
                      try {
                        $br = New-Object System.IO.BinaryReader($fs)
                        $fs.Position = 0x3C
                        $peOffset = $br.ReadInt32()
                        $fs.Position = $peOffset + 4
                        $machine = $br.ReadUInt16()
                        switch ($machine) {
                          0x8664 { return "x64 (0x8664)" }
                          0xAA64 { return "arm64 (0xAA64)" }
                          default { return ("0x{0:X4}" -f $machine) }
                        }
                      }
                      finally {
                        $fs.Dispose()
                      }
                    }

                    Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
                    dotnet --info

                    $nativeFiles = Get-ChildItem -Path "tests/InfiniFrameTests/bin/Release" -Recurse -File `
                      | Where-Object { $_.Name -in @("InfiniFrame.Native.dll", "WebView2Loader.dll", "testhost.exe") }
                    foreach ($file in $nativeFiles) {
                      $machine = Get-PeMachine $file.FullName
                      Write-Host "$($file.FullName) => $machine"
                    }

            -   name: Export Actions Runtime
                uses: actions/github-script@v9
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

#            -   name: Run InfiniFrameTests Project (ARM64 Diagnostics)
#                if: matrix.arch == 'arm64'
#                env:
#                    INFINIFRAME_TRACE_TEARDOWN: 1
#                run: |
#                    echo "Running ParentChildWindowTests diagnostics on Windows ARM64..."
#                    dotnet test --project tests/InfiniFrameTests/InfiniFrameTests.csproj `
#                      --configuration Release `
#                      --no-build `
#                      --no-restore `
#                      --results-directory artifacts/testresults/arm64-infiniframetests `
#                      --output Detailed `
#                      --show-stderr All `
#                      --show-stdout All `
#                      --diagnostic `
#                      --diagnostic-output-directory artifacts/testdiag/arm64-infiniframetests `
#                      --treenode-filter "/*/*/ParentChildWindowTests/*" `
#                      --minimum-expected-tests 1
#
#            -   name: Run Tests (ARM64)
#                if: matrix.arch == 'arm64'
#                env:
#                    INFINIFRAME_TRACE_TEARDOWN: 1
#                run: |
#                    echo "Running full tests on Windows ARM64..."
#                    dotnet test --solution InfiniFrame.GitHubActions.Testing.slnf `
#                      --configuration Release `
