name: "Shared: Windows Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                required: false
                default: ''
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true

jobs:
    windows:
        name: CI Testing - Windows (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        arch: x64
                        libName: windows
                        rid: win-x64
                    -   os: windows-11-arm
                        arch: arm64
                        libName: windows
                        rid: win-arm64
        permissions:
            contents: read
            statuses: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set Windows Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    state: pending
                    status-description: Windows tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Setup Node
                uses: actions/setup-node@v6
                with:
                    node-version: 24
                    architecture: ${{ matrix.arch }}

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~\.nuget\packages
                    key: ${{ matrix.os }}-${{ matrix.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/Directory.Packages.props') }}
                    restore-keys: |
                        ${{ matrix.os }}-${{ matrix.arch }}-nuget-

            -   name: Setup Native dependencies
                # noinspection UndefinedAction
                uses: ./.github/actions/setup-dependencies-native
                # noinspection UndefinedParamsPresent
                with:
                    apt-cache-version: 1.0
                    brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-windows.yml') }}
                    brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503

            -   name: Build Release
                run: |
                    dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj `
                      --configuration Release `
                      --no-restore `
                      -p:SolutionDir="${{ github.workspace }}/" `
                      -p:Platform=${{ matrix.arch }}

                    dotnet build InfiniFrame.GitHubActions.Testing.slnf `
                      --configuration Release `
                      --no-restore

            -   name: Verify Native Binaries
                # noinspection UndefinedAction
                uses: ./.github/actions/validate-native-test-binaries

            -   name: Export Actions Runtime
                uses: actions/github-script@v9
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

            -   name: Configure ARM64 WER LocalDumps
                if: ${{ matrix.arch == 'arm64' }}
                shell: pwsh
                run: |
                    $dumpFolder = Join-Path "${{ github.workspace }}" "artifacts\crash-dumps"
                    New-Item -ItemType Directory -Path $dumpFolder -Force | Out-Null
                    reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d $dumpFolder /f
                    reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
                    reg add "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 10 /f

            -   name: Run Tests
                run: |
                    echo "Running tests on Windows..."
                    if ("${{ matrix.arch }}" -eq "arm64") {
                      $env:INFINIFRAME_TRACE_TEARDOWN = "1"
                      $diagDir = Join-Path "${{ github.workspace }}" "artifacts\test-results\windows-arm64"
                      New-Item -ItemType Directory -Path $diagDir -Force | Out-Null
                      dotnet test --solution InfiniFrame.GitHubActions.Testing.slnf `
                        --configuration Release `
                        --no-build `
                        --no-restore `
                        -- `
                        --diagnostic `
                        --diagnostic-output-directory $diagDir `
                        --diagnostic-synchronous-write `
                        --diagnostic-verbosity Trace `
                        --show-stdout All `
                        --show-stderr All
                    }
                    else {
                      dotnet test --solution InfiniFrame.GitHubActions.Testing.slnf `
                        --configuration Release `
                        --no-build `
                        --no-restore
                    }

            -   name: Upload ARM64 Crash Diagnostics
                if: ${{ always() && matrix.arch == 'arm64' }}
                uses: actions/upload-artifact@v4
                with:
                    name: windows-arm64-crash-diagnostics
                    if-no-files-found: ignore
                    path: |
                        artifacts/test-results/windows-arm64/**
                        artifacts/crash-dumps/**
                        **/TestResults/**
                        **/*.dmp
                        **/*.mdmp
                        **/*.diag

            -   name: Pack Tool E2E
                if: always()
                # noinspection UndefinedAction
                uses: ./.github/actions/packtool-e2e
                # noinspection UndefinedParamsPresent
                with:
                    project: examples/InfiniFrameExample.SingleFileExe/InfiniFrameExample.SingleFileExe.csproj
                    rid: ${{ matrix.rid }}
                    output: artifacts/pack-e2e/InfiniFrameExample.SingleFileExe
                    main-output-name: InfiniFrameExample.SingleFileExe.exe
                    forbidden-entries: |
                        wwwroot
                        InfiniFrame.Native.dll
                        WebView2Loader.dll
                        InfiniFrame.Native.so
                        InfiniFrame.Native.dylib

            -   name: Update Windows Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: Windows tests passed
                    failure-description: Windows tests failed
