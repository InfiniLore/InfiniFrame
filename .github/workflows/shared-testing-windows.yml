#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: Windows Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                required: false
                default: ''
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true
            enable_test_exports:
                type: boolean
                required: false
                default: false
            enable_coverage:
                type: boolean
                required: false
                default: true

jobs:
    windows:
        name: CI Testing - Windows (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        arch: x64
                        libName: windows
                        rid: win-x64
                    -   os: windows-11-arm
                        arch: arm64
                        libName: windows
                        rid: win-arm64
        permissions:
            contents: read
            statuses: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false

            -   name: Set Windows Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    state: pending
                    status-description: Windows tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Download Testing Native Build Artifacts
                uses: ./.github/actions/download-native-binaries
                with:
                    artifact-type: testing

            -   name: Cache WebView2 fixed runtime
                if: matrix.arch == 'x64'
                uses: actions/cache@v6
                with:
                    path: artifacts/webview2-fixed-runtime/150.0.4078.99
                    key: webview2-fixed-runtime-150.0.4078.99-x64

            -   name: Provision WebView2 fixed runtime integration-test dependency
                if: matrix.arch == 'x64'
                shell: pwsh
                run: |
                    $runtimePath = & ./tests/ensure-webview2-fixed-runtime.ps1
                    "INFINIFRAME_TEST_WEBVIEW2_RUNTIME_PATH=$runtimePath" >> $env:GITHUB_ENV

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503 /p:NativeArch=${{ matrix.arch }}

            -   name: Build Release
                shell: pwsh
                run: |
                    dotnet build InfiniFrame.GitHubActions.Testing.slnf `
                      --configuration Release `
                      --no-restore `
                      /p:SolutionDir=$env:GITHUB_WORKSPACE/ `
                      /p:NativeArch=${{ matrix.arch }} `
                      /p:InfiniFrameSkipNativeBuild=true `
                      /p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }}

            -   name: Prepare ARM64 Crash Diagnostics
                if: matrix.arch == 'arm64'
                shell: pwsh
                run: |
                    $dumpRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\crashdumps"
                    $diagRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\testdiag"
                    $resultRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\testresults"
                    New-Item -ItemType Directory -Force -Path $dumpRoot | Out-Null
                    New-Item -ItemType Directory -Force -Path $diagRoot | Out-Null
                    New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null

                    $werBase = "HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps"
                    New-Item -Path $werBase -Force | Out-Null
                    New-ItemProperty -Path $werBase -Name DumpFolder -PropertyType ExpandString -Value $dumpRoot -Force | Out-Null
                    New-ItemProperty -Path $werBase -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
                    New-ItemProperty -Path $werBase -Name DumpCount -PropertyType DWord -Value 20 -Force | Out-Null

                    foreach ($exe in @("testhost.exe", "InfiniTests.InfiniFrame.exe", "dotnet.exe")) {
                      $exeKey = Join-Path $werBase $exe
                      New-Item -Path $exeKey -Force | Out-Null
                      New-ItemProperty -Path $exeKey -Name DumpFolder -PropertyType ExpandString -Value $dumpRoot -Force | Out-Null
                      New-ItemProperty -Path $exeKey -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
                      New-ItemProperty -Path $exeKey -Name DumpCount -PropertyType DWord -Value 20 -Force | Out-Null
                    }

                    Write-Host "Configured WER LocalDumps at $dumpRoot"

            -   name: Emit ARM64 Runtime/Binary Diagnostics
                if: matrix.arch == 'arm64'
                shell: pwsh
                run: |
                    function Get-PeMachine([string]$Path) {
                      $fs = [System.IO.File]::OpenRead($Path)
                      try {
                        $br = New-Object System.IO.BinaryReader($fs)
                        $fs.Position = 0x3C
                        $peOffset = $br.ReadInt32()
                        $fs.Position = $peOffset + 4
                        $machine = $br.ReadUInt16()
                        switch ($machine) {
                          0x8664 { return "x64 (0x8664)" }
                          0xAA64 { return "arm64 (0xAA64)" }
                          default { return ("0x{0:X4}" -f $machine) }
                        }
                      }
                      finally {
                        $fs.Dispose()
                      }
                    }

                    Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
                    dotnet --info

                    $nativeFiles = Get-ChildItem -Path "tests/InfiniTests/bin/Release" -Recurse -File `
                      | Where-Object { $_.Name -in @("InfiniFrame.Native.dll", "WebView2Loader.dll", "testhost.exe") }
                    foreach ($file in $nativeFiles) {
                      $machine = Get-PeMachine $file.FullName
                      Write-Host "$($file.FullName) => $machine"
                    }

            -   name: Export Actions Runtime
                uses: actions/github-script@v9
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

            -   name: Run Tests
                shell: pwsh
                run: |
                    echo "Running tests on Windows..."
                    $exitCode = 0

                    foreach ($framework in @("net8.0", "net9.0", "net10.0")) {
                      $testArgs = @(
                        "test",
                        "--solution", "InfiniFrame.GitHubActions.Testing.slnf",
                        "--configuration", "Release",
                        "--no-build",
                        "--no-restore",
                        "--framework", $framework,
                        "/p:NativeArch=${{ matrix.arch }}",
                        "/p:InfiniFrameSkipNativeBuild=true",
                        "/p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }}"
                      )

                      if ("${{ inputs.enable_coverage }}" -eq "true" -and $framework -eq "net10.0") {
                        $testArgs += @(
                          "--coverage",
                          "--coverage-output-format", "cobertura",
                          "--results-directory", "TestResults"
                        )
                      }

                      if ("${{ matrix.arch }}" -eq "arm64") {
                        $frameworkDiagRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\testdiag\$framework"
                        New-Item -ItemType Directory -Force -Path $frameworkDiagRoot | Out-Null
                        $testArgs += @(
                          "--diagnostic-output-directory", $frameworkDiagRoot,
                          "--",
                          "--diagnostic",
                          "--diagnostic-synchronous-write"
                        )
                      }

                      & dotnet @testArgs
                      if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
                    }

                    exit $exitCode

            -   name: Upload C# Coverage
                if: ${{ inputs.enable_coverage == true && success() }}
                uses: actions/upload-artifact@v7
                with:
                    name: cs-coverage-windows-${{ matrix.arch }}
                    path: TestResults/**/*.cobertura.xml
                    if-no-files-found: warn
                    retention-days: 1

            -   name: Collect ARM64 Windows Event Logs
                if: always() && matrix.arch == 'arm64'
                shell: pwsh
                run: |
                    $output = Join-Path $env:GITHUB_WORKSPACE "artifacts\windows-event-log.txt"
                    try {
                      Get-WinEvent -FilterHashtable @{
                        LogName = "Application"
                        StartTime = (Get-Date).AddHours(-1)
                      } -ErrorAction Stop |
                        Where-Object {
                          $_.ProviderName -in @("Application Error", ".NET Runtime", "Windows Error Reporting")
                        } |
                        Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message |
                        Format-List | Out-File -FilePath $output -Width 4096
                    }
                    catch {
                      "Could not collect the Windows Application event log: $($_.Exception.Message)" |
                        Out-File -FilePath $output
                    }

            -   name: Upload ARM64 Crash Diagnostics
                if: always() && matrix.arch == 'arm64'
                uses: actions/upload-artifact@v7
                with:
                    name: windows-arm64-test-crash-diagnostics
                    if-no-files-found: warn
                    retention-days: 14
                    path: |
                        artifacts/crashdumps
                        artifacts/testdiag
                        artifacts/testresults
                        artifacts/windows-event-log.txt
                        TestResults

            -   name: SingleFile E2E
                uses: ./.github/actions/singlefile-e2e
                with:
                    project: examples/SingleFileExe/InfiniFrameExample.SingleFileExe/InfiniFrameExample.SingleFileExe.csproj
                    rid: ${{ matrix.rid }}
                    output: artifacts/pack-e2e/InfiniFrameExample.SingleFileExe
                    main-output-name: InfiniFrameExample.SingleFileExe.exe
                    forbidden-entries: |
                        wwwroot
                        InfiniFrame.Native.dll
                        WebView2Loader.dll
                        InfiniFrame.Native.so
                        InfiniFrame.Native.dylib

            -   name: Update Windows Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check-finalize
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Windows/${{ matrix.arch }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: Windows tests passed
                    failure-description: Windows tests failed
