#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: Coverage Badges"

on:
    workflow_call:
        inputs:
            badge_branch:
                description: 'Branch to push badge updates to (defaults to current branch)'
                type: string
                required: false
                default: ''
            pr_number:
                description: 'PR number to post a coverage comment on (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Original commit SHA to sync checks from'
                type: string
                required: false
                default: ''

permissions:
    contents: write
    pull-requests: write
    checks: write

jobs:
    coverage:
        name: Generate Coverage Badges
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Download TS Coverage Artifact
                uses: actions/download-artifact@v8
                with:
                    name: ts-coverage
                    path: ts-coverage

            -   name: Download Python Coverage Artifact
                uses: actions/download-artifact@v8
                with:
                    name: python-coverage
                    path: python-coverage

            -   name: Download C# Coverage Artifacts
                uses: actions/download-artifact@v8
                with:
                    pattern: cs-coverage-*
                    path: cs-coverage
                    merge-multiple: true

            -   name: Setup Git for Push
                shell: bash
                env:
                    BADGE_BRANCH: ${{ inputs.badge_branch || github.ref_name }}
                run: |
                    git config --global --add safe.directory "$GITHUB_WORKSPACE"
                    git remote set-branches origin '*'
                    git fetch origin "$BADGE_BRANCH"
                    git branch --set-upstream-to="origin/$BADGE_BRANCH" "$BADGE_BRANCH" || true

            -   name: Generate Coverage Report
                shell: pwsh
                run: |
                    python scripts/coverage_report.py `
                        --pr-number "${{ inputs.pr_number }}" `
                        --badge-branch "${{ inputs.badge_branch || github.ref_name }}" `
                        --repo "${{ github.repository }}" `
                        --ref-name "${{ github.ref_name }}"
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Sync Checks to Badge Commit
                if: ${{ inputs.target_sha != '' && inputs.target_sha != '0' }}
                shell: bash
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    NEW_SHA=$(git rev-parse HEAD)
                    ORIGINAL_SHA="${{ inputs.target_sha }}"
                    if [ "$NEW_SHA" = "$ORIGINAL_SHA" ]; then
                      echo "No badge commit pushed, skipping check sync"
                      exit 0
                    fi
                    echo "Syncing checks from $ORIGINAL_SHA to $NEW_SHA"
                    CHECKS=$(gh api "repos/${{ github.repository }}/commits/$ORIGINAL_SHA/check-runs?per_page=100" --jq '.check_runs[] | "\(.name)|\(.conclusion // "pending")|\(.details_url // "")"')
                    while IFS='|' read -r name conclusion url; do
                      if [ -z "$name" ] || [ "$conclusion" = "pending" ] || [ "$conclusion" = "in_progress" ] || [ "$conclusion" = "queued" ]; then
                        continue
                      fi
                      echo "  Creating check: $name -> $conclusion"
                      gh api "repos/${{ github.repository }}/check-runs" -X POST \
                        -f name="$name" \
                        -f head_sha="$NEW_SHA" \
                        -f status="completed" \
                        -f conclusion="$conclusion" \
                        -f details_url="$url" \
                        -f "output[title]=$name" \
                        -f "output[summary]=Copied from $ORIGINAL_SHA" \
                        > /dev/null 2>&1 || echo "  Failed to create check: $name"
                    done <<< "$CHECKS"
                    echo "Check sync complete"
