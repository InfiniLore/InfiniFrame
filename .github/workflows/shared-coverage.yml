#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: Coverage Badges"

on:
    workflow_call:
        inputs:
            badge_branch:
                description: 'Branch to push badge updates to (defaults to current branch)'
                type: string
                required: false
                default: ''
            pr_number:
                description: 'PR number to post a coverage comment on (optional)'
                type: string
                required: false
                default: ''

permissions:
    contents: write
    pull-requests: write

jobs:
    coverage:
        name: Generate Coverage Badges
        runs-on: windows-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            # TypeScript Coverage
            -   name: Download TS Coverage Artifact
                uses: actions/download-artifact@v8
                with:
                    name: ts-coverage
                    path: ts-coverage

            -   name: Extract TS Coverage
                id: ts
                shell: pwsh
                run: |
                    $lcov = Get-Content "ts-coverage/lcov.info" -Raw
                    $totalLines = 0
                    $totalHit = 0
                    [regex]::Matches($lcov, 'LF:(\d+)') | ForEach-Object {
                        $totalLines += [int]$_.Groups[1].Value
                    }
                    [regex]::Matches($lcov, 'LH:(\d+)') | ForEach-Object {
                        $totalHit += [int]$_.Groups[1].Value
                    }
                    $pct = if ($totalLines -gt 0) { [math]::Round(($totalHit / $totalLines) * 100, 1) } else { 0 }
                    "pct=$pct" >> $env:GITHUB_OUTPUT
                    Write-Host "TS coverage: $pct% ($totalHit / $totalLines lines)"

            # C# Coverage 
            -   name: Download C# Coverage Artifacts
                uses: actions/download-artifact@v8
                with:
                    pattern: cs-coverage-*
                    path: cs-coverage
                    merge-multiple: true

            -   name: Aggregate C# Coverage
                id: cs
                shell: pwsh
                run: |
                    $totalLines = 0
                    $totalCovered = 0
                    $testPackages = @('InfiniTests', 'InfiniAutomationTests')
                    $pkgData = [ordered]@{}
                    Get-ChildItem "cs-coverage" -Recurse -Filter "*.cobertura.xml" -ErrorAction SilentlyContinue | ForEach-Object {
                        [xml]$xml = Get-Content $_.FullName -Raw
                        if ($xml.coverage.packages.package) {
                            foreach ($pkg in $xml.coverage.packages.package) {
                                $pkgName = $pkg.name
                                $isTest = $false
                                foreach ($tp in $testPackages) {
                                    if ($pkgName -like "$tp*") { $isTest = $true; break }
                                }
                                if (-not $isTest) {
                                    $pkgLines = 0
                                    $pkgCovered = 0
                                    foreach ($cls in $pkg.classes.class) {
                                        foreach ($m in $cls.methods.method) {
                                            foreach ($l in $m.lines.line) {
                                                $pkgLines++
                                                if ([int]$l.hits -gt 0) { $pkgCovered++ }
                                            }
                                        }
                                    }
                                    $totalLines += $pkgLines
                                    $totalCovered += $pkgCovered
                                    if (-not $pkgData.ContainsKey($pkgName)) {
                                        $pkgData[$pkgName] = @{ lines = 0; covered = 0 }
                                    }
                                    $pkgData[$pkgName].lines += $pkgLines
                                    $pkgData[$pkgName].covered += $pkgCovered
                                }
                            }
                        }
                    }
                    $pct = if ($totalLines -gt 0) { [math]::Round(($totalCovered / $totalLines) * 100, 1) } else { 0 }
                    "pct=$pct" >> $env:GITHUB_OUTPUT
                    Write-Host "C# coverage: $pct% ($totalCovered / $totalLines lines)"

                    # Write per-package breakdown for the comment
                    $pkgData | ConvertTo-Json -Depth 3 | Set-Content "cs-coverage-breakdown.json"

            # PR Comment (must run BEFORE writing badge files so delta reads old values)
            -   name: Post Coverage Comment on PR
                if: ${{ inputs.pr_number != '' && inputs.pr_number != '0' }}
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                shell: pwsh
                run: |
                    $prNumber = "${{ inputs.pr_number }}"

                    # Verify this is an actual pull request, not just an issue or branch
                    $pr = gh pr view $prNumber --repo "${{ github.repository }}" --json number 2>$null
                    if (-not $?) {
                        Write-Host "Skipping comment: #$prNumber is not a pull request"
                        return
                    }
                    $newTs = [double]"${{ steps.ts.outputs.pct }}"
                    $newCs = [double]"${{ steps.cs.outputs.pct }}"

                    # Read previous badge values from the checked-out repo
                    $oldTs = 0.0
                    $oldCs = 0.0
                    if (Test-Path "badges/ts-coverage.json") {
                        $old = Get-Content "badges/ts-coverage.json" -Raw | ConvertFrom-Json
                        $oldTs = [double]($old.message -replace '%','')
                    }
                    if (Test-Path "badges/cs-coverage.json") {
                        $old = Get-Content "badges/cs-coverage.json" -Raw | ConvertFrom-Json
                        $oldCs = [double]($old.message -replace '%','')
                    }

                    # Determine styling: green if improved, red if regressed, gray if unchanged
                    function Get-Trend([double]$old, [double]$new) {
                        if ($new -gt $old) { return @{ icon = "📈"; color = "green"; label = "improved" } }
                        if ($new -lt $old) { return @{ icon = "📉"; color = "red"; label = "regressed" } }
                        return @{ icon = "➡️"; color = "gray"; label = "unchanged" }
                    }

                    $tsTrend = Get-Trend $oldTs $newTs
                    $csTrend = Get-Trend $oldCs $newCs

                    $tsDelta = $newTs - $oldTs
                    $csDelta = $newCs - $oldCs
                    $tsDeltaStr = if ($tsDelta -gt 0) { "+$tsDelta" } else { "$tsDelta" }
                    $csDeltaStr = if ($csDelta -gt 0) { "+$csDelta" } else { "$csDelta" }

                    $body = "## 📊 Code Coverage Report`n`n"
                    $body += "| Language | Coverage | Delta | Trend |`n"
                    $body += "|----------|----------|-------|-------|`n"
                    $body += "| TypeScript | **${newTs}%** | ${tsDeltaStr}% | $($tsTrend.icon) $($tsTrend.label) |`n"
                    $body += "| C# | **${newCs}%** | ${csDeltaStr}% | $($csTrend.icon) $($csTrend.label) |"

                    # Add per-project C# breakdown
                    if (Test-Path "cs-coverage-breakdown.json") {
                        $breakdown = Get-Content "cs-coverage-breakdown.json" -Raw | ConvertFrom-Json
                        if ($breakdown.PSObject.Properties.Count -gt 0) {
                            $body += "`n`n### C# Project Breakdown`n`n"
                            $body += "| Project | Coverage | Lines | Covered |`n"
                            $body += "|---------|----------|-------|---------|`n"
                            $breakdown.PSObject.Properties | Sort-Object { $_.Value.covered / [math]::Max($_.Value.lines, 1) } -Descending | ForEach-Object {
                                $name = $_.Name
                                $lines = [int]$_.Value.lines
                                $covered = [int]$_.Value.covered
                                $pct = if ($lines -gt 0) { [math]::Round(($covered / $lines) * 100, 1) } else { 0 }
                                $body += "| $name | $pct% | $lines | $covered |`n"
                            }
                        }
                    }

                    # Delete previous coverage comment if it exists
                    $comments = gh api "repos/${{ github.repository }}/issues/${prNumber}/comments?per_page=100" | ConvertFrom-Json
                    if ($comments) {
                        $existing = $comments | Where-Object { $_.body -match "## 📊 Code Coverage Report" } | Select-Object -First 1
                        if ($existing) {
                            gh api "repos/${{ github.repository }}/issues/comments/$($existing.id)" -X DELETE
                            Write-Host "Deleted previous coverage comment #$($existing.id)"
                        }
                    }

                    gh api "repos/${{ github.repository }}/issues/${prNumber}/comments" -X POST -f body="$body"
                    Write-Host "Posted new coverage comment on PR #$prNumber"

            # Badge JSON (AFTER comment so old values are read first)
            -   name: Write Badge JSON
                shell: pwsh
                run: |
                    $ts = "${{ steps.ts.outputs.pct }}%"
                    $cs = "${{ steps.cs.outputs.pct }}%"
                    $tsColor = if ([double]"${{ steps.ts.outputs.pct }}" -ge 90) { "brightgreen" }
                               elseif ([double]"${{ steps.ts.outputs.pct }}" -ge 75) { "yellow" }
                               else { "red" }
                    $csColor = if ([double]"${{ steps.cs.outputs.pct }}" -ge 90) { "brightgreen" }
                               elseif ([double]"${{ steps.cs.outputs.pct }}" -ge 75) { "yellow" }
                               else { "red" }

                    [ordered]@{
                        schemaVersion = 1
                        label         = "coverage"
                        message       = $ts
                        color         = $tsColor
                    } | ConvertTo-Json | Set-Content "badges/ts-coverage.json"
                      
                    [ordered]@{
                        schemaVersion = 1
                        label         = "coverage"
                        message       = $cs
                        color         = $csColor
                    } | ConvertTo-Json | Set-Content "badges/cs-coverage.json"

                    Write-Host "Badges: TS=$ts ($tsColor), C#=$cs ($csColor)"

            -   name: Commit Badge Updates
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add badges/
                    git diff --staged --quiet || git commit -m "ci: update coverage badges"
                    git push origin HEAD:${{ inputs.badge_branch || github.ref_name }} || echo "No changes to push"
