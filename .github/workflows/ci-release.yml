name: "CI: Release"
on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: 'Version bump type'
                required: true
                type: choice
                default: preview
                options:
                    - major
                    - minor
                    - patch
                    - preview
                    - custom
            custom_version:
                description: 'Custom version (only used if "custom" is selected, e.g., 1.0.0 or 1.0.0-preview.1)'
                required: false
                type: string
            publish_to_nuget:
                description: 'Publish to NuGet after building'
                type: boolean
                default: true
            publish_docs:
                description: 'Publish documentation to GitHub Pages'
                type: boolean
                default: true

permissions:
    contents: write
    packages: write
    statuses: write
    checks: write
    pages: write
    id-token: write

jobs:
    # noinspection UndefinedAction
    tests-python:
        name: Python Tests
        uses: ./.github/workflows/shared-testing-python.yml

    # noinspection UndefinedAction, UndefinedParamsPresent
    tests-platform:
        name: Platform Tests
        needs: tests-python
        uses: ./.github/workflows/shared-testing.yml
        with:
            pr_number: ''
            checkout_ref: ${{ github.sha }}
            run_windows: true
            run_windows_playwright: true
            run_linux: true
            run_macos: true
            run_docs: true
            run_trim_aot: true
        secrets: inherit

    # ------------------------------------------------------------------------------------------------------------------
    # Bump version, commit, and tag
    # ------------------------------------------------------------------------------------------------------------------
    # noinspection UndefinedAction, UndefinedParamsPresent
    bump-version:
        name: Bump Version
        needs: tests-platform
        if: github.ref == 'refs/heads/core'
        uses: ./.github/workflows/shared-release-bump-version.yml
        with:
            version_bump: ${{ inputs.version_bump }}
            custom_version: ${{ inputs.custom_version }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    build:
        name: Build Native
        needs: bump-version
        uses: ./.github/workflows/shared-release-build.yml
        with:
            tag_name: ${{ needs.bump-version.outputs.tag_name }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    publish:
        name: Publish Release
        needs: [ build, bump-version ]
        uses: ./.github/workflows/shared-release-publish.yml
        with:
            tag_name: ${{ needs.bump-version.outputs.tag_name }}
            new_version: ${{ needs.bump-version.outputs.new_version }}
            publish_to_nuget: ${{ inputs.publish_to_nuget }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    publish-docs:
        name: Publish Docs
        needs: [ publish, bump-version ]
        if: inputs.publish_docs
        uses: ./.github/workflows/shared-release-publish-docs.yml
        with:
            checkout_ref: ${{ needs.bump-version.outputs.tag_name }}
        secrets: inherit

