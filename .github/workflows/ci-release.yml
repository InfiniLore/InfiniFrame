#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: Release"
on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: 'Version bump type'
                required: true
                type: choice
                default: minor
                options:
                    - major
                    - minor
                    - patch
                    - preview
                    - custom
            custom_version:
                description: 'Custom version (only used if "custom" is selected, e.g., 1.0.0 or 1.0.0-preview.1)'
                required: false
                type: string
            publish_to_nuget:
                description: 'Publish to NuGet after building'
                type: boolean
                default: true
            publish_docs:
                description: 'Publish documentation to GitHub Pages'
                type: boolean
                default: true
            dry_run:
                description: 'Validate the release without committing, tagging, or publishing'
                type: boolean
                default: false

permissions:
    contents: write
    packages: write
    statuses: write
    checks: write
    pages: write
    id-token: write

jobs:
    tests-python:
        name: "CI: python"
        uses: ./.github/workflows/shared-testing-python.yml
        with:
            target_sha: ${{ github.sha }}
            workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    tests-platform:
        name: "CI: tests"
        needs: tests-python
        uses: ./.github/workflows/shared-testing.yml
        with:
            pr_number: ''
            checkout_ref: ${{ github.sha }}
            run_windows: true
            run_windows_playwright: true
            run_linux: true
            run_macos: true
            run_docs: true
            run_trim_aot: true
            enable_test_exports: true
        secrets: inherit

    # ------------------------------------------------------------------------------------------------------------------
    # Bump version, commit, and tag
    # ------------------------------------------------------------------------------------------------------------------
    bump-version:
        name: "CI: bump-version"
        needs: tests-platform
        if: ${{ github.ref == 'refs/heads/core' }}
        uses: ./.github/workflows/shared-release-bump-version.yml
        with:
            version_bump: ${{ inputs.version_bump }}
            custom_version: ${{ inputs.custom_version }}
            dry_run: ${{ inputs.dry_run }}
        secrets: inherit

    build:
        name: "CI: build"
        needs: bump-version
        uses: ./.github/workflows/shared-release-build.yml
        with:
            tag_name: ${{ inputs.dry_run && github.sha || needs.bump-version.outputs.tag_name }}
        secrets: inherit

    publish:
        name: "CI: publish"
        needs: [ build, bump-version ]
        uses: ./.github/workflows/shared-release-publish.yml
        with:
            tag_name: ${{ inputs.dry_run && github.sha || needs.bump-version.outputs.tag_name }}
            new_version: ${{ needs.bump-version.outputs.new_version }}
            publish_to_nuget: ${{ inputs.publish_to_nuget }}
            dry_run: ${{ inputs.dry_run }}
        secrets: inherit

    publish-docs:
        name: "CI: publish-docs"
        needs: [ publish, bump-version ]
        if: inputs.publish_docs && !inputs.dry_run
        uses: ./.github/workflows/shared-release-publish-docs.yml
        with:
            checkout_ref: ${{ needs.bump-version.outputs.tag_name }}
        secrets: inherit

