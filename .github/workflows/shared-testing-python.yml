#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: python"

on:
    workflow_call:
        inputs:
            enable_coverage:
                description: 'Enable code coverage collection'
                type: boolean
                required: false
                default: true
            workflow_url:
                type: string
                required: true

permissions:
    contents: read

jobs:
    python-tests:
        name: "CI: python"
        runs-on: ubuntu-26.04

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Setup Python
                uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
                with:
                    python-version: '3.x'

            -   name: Install Test Deps
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install pytest pytest-cov

            -   name: Run Pytest
                shell: bash
                run: |
                    if [ "${{ inputs.enable_coverage }}" = "true" ]; then
                      python -m pytest -q \
                        --cov=scripts \
                        --cov-report=lcov:python-coverage/lcov.info
                    else
                      python -m pytest -q
                    fi

            -   name: Upload Python Coverage
                if: ${{ inputs.enable_coverage == true && success() }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: python-coverage
                    path: python-coverage/lcov.info
                    if-no-files-found: warn
                    retention-days: 1

            -   name: Run Validations
                run: |
                    python scripts/validate_package_id_prefix.py \
                      --slnf InfiniFrame.GitHubActions.Release.slnf \
                      --prefix InfiniLore
