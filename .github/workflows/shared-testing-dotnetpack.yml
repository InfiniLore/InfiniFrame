name: "Shared: Dotnet Pack Tests"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true

permissions:
    contents: read
    statuses: write
    checks: write

jobs:
    dotnet-pack-validation:
        name: CI Testing - Dotnet Pack
        runs-on: ubuntu-latest
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}
                    fetch-depth: 1

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false

            -   name: Set Dotnet Pack Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Dotnet Pack
                    state: pending
                    status-description: Dotnet Pack tests in progress
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    allow-status-422: 'true'

            -   name: Download Testing Native Build Artifacts
                uses: ./.github/actions/native-binaries-testing-download-from-cache

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Release.slnf /p:NoWarn=NU1503

            -   name: Build Release
                run: |
                    dotnet build InfiniFrame.GitHubActions.Release.slnf \
                      --configuration Release \
                      --no-restore \
                      /p:SolutionDir=${{ github.workspace }}/ \
                      /p:InfiniFrameSkipNativeBuild=true

            -   name: Pack
                run: |
                    dotnet pack InfiniFrame.GitHubActions.Release.slnf \
                      --configuration Release \
                      --no-build \
                      /p:InfiniFrameSkipNativeBuild=true \
                      -o ./release
            
            -   name: Complete Dotnet Pack Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ env.TARGET_SHA }}
                    context: CI Testing - Dotnet Pack
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    job-status: ${{ job.status }}
                    success-description: Dotnet Pack finished successfully
                    failure-description: Dotnet Pack failed
