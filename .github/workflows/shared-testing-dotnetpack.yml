#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: linux/dotnet-pack"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true
            enable_test_exports:
                description: 'Whether downloaded testing native artifacts include native test exports.'
                type: boolean
                required: false
                default: false

permissions:
    contents: read
    packages: read
    statuses: write
    checks: write

jobs:
    dotnet-pack-validation:
        name: "CI: linux-x64/dotnet-pack"
        runs-on: ubuntu-26.04
        container:
            image: ghcr.io/infinilore/infiniframe-ci:x64-${{ vars.LINUX_CI_IMAGE_VERSION }}@${{ vars.LINUX_CI_IMAGE_DIGEST_X64 }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}
                    fetch-depth: 1

            -   name: Set Dotnet Pack Check Pending
                if: ${{ github.event_name != 'pull_request' }}
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: "CI: linux-x64/dotnet-pack"
                    state: pending
                    status-description: Dotnet Pack tests in progress
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    allow-status-422: 'true'

            -   name: Download Testing Native Build Artifacts
                uses: ./.github/actions/download-native-binaries
                with:
                    artifact-type: testing

            -   name: Restore
                # NU1503 ("Skipping restore for project ... invalid or missing targets") is
                # an error on purpose: a project skipped at restore silently disappears from
                # the packed nuspec dependencies (NuGet's PackTaskLogic drops unresolvable
                # project references with a bare continue), which intermittently produced
                # meta-packages missing dependencies. The former /p:NoWarn=NU1503 hid
                # exactly the signal that would have betrayed the skip.
                # Parallel restore can intermittently race generated/project targets and emit
                # NU1503 for a project that is valid on a subsequent restore. Keep the warning
                # fatal, but serialize this small release graph so the package dependency graph
                # cannot be nondeterministically incomplete.
                run: dotnet restore InfiniFrame.GitHubActions.Release.slnf --disable-parallel /p:WarningsAsErrors=NU1503

            -   name: Build Release
                run: |
                    dotnet build InfiniFrame.GitHubActions.Release.slnf \
                      --configuration Release \
                      --no-restore \
                      /p:SolutionDir=${{ github.workspace }}/ \
                      /p:InfiniFrameSkipNativeBuild=true \
                      /p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }}

            -   name: Pack
                run: |
                    dotnet pack InfiniFrame.GitHubActions.Release.slnf \
                      --configuration Release \
                      --no-build \
                      /p:InfiniFrameSkipNativeBuild=true \
                      /p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }} \
                      -o ./release

            -   name: Verify Meta Package Dependencies
                shell: bash
                run: |
                    set -euo pipefail
                    PACKAGE=""
                    for candidate in ./release/InfiniLore.InfiniFrame.[0-9]*.nupkg; do
                      if [[ -f "$candidate" && "$candidate" != *.symbols.nupkg ]]; then
                        PACKAGE="$candidate"
                        break
                      fi
                    done
                    [ -n "$PACKAGE" ] || { echo "Missing InfiniLore.InfiniFrame meta-package"; exit 1; }
                    NUSPEC=$(unzip -p "$PACKAGE" 'InfiniLore.InfiniFrame.nuspec')
                    for dependency in Application Js NativeBridge Security Shared StaticAssets Window; do
                      echo "$NUSPEC" | grep -q "InfiniLore.InfiniFrame.$dependency" || {
                        echo "Missing meta-package dependency: InfiniLore.InfiniFrame.$dependency"
                        exit 1
                      }
                    done
                    if unzip -l "$PACKAGE" | grep -Eq 'lib/net[^/]*/InfiniFrame\.(Application|Security|StaticAssets|Window)\.dll'; then
                      echo "The meta-package contains duplicated implementation assemblies"
                      exit 1
                    fi

            -   name: Verify NativeBridge Package Natives
                shell: bash
                run: |
                    PACKAGE=""
                    for candidate in ./release/InfiniLore.InfiniFrame.NativeBridge.*.nupkg; do
                      if [[ -f "$candidate" && "$candidate" != *.symbols.nupkg ]]; then
                        PACKAGE="$candidate"
                        break
                      fi
                    done

                    if [ -z "$PACKAGE" ]; then
                        echo "❌ No InfiniFrame.NativeBridge package found in ./release"
                        exit 1
                    fi

                    echo "Inspecting package: $PACKAGE"

                    EXPECTED=(
                      "runtimes/win-x64/native/InfiniFrame.Native.dll"
                      "runtimes/win-x64/native/WebView2Loader.dll"
                      "runtimes/win-arm64/native/InfiniFrame.Native.dll"
                      "runtimes/win-arm64/native/WebView2Loader.dll"
                      "runtimes/linux-x64/native/InfiniFrame.Native.so"
                      "runtimes/linux-arm64/native/InfiniFrame.Native.so"
                      "runtimes/osx-x64/native/InfiniFrame.Native.dylib"
                      "runtimes/osx-arm64/native/InfiniFrame.Native.dylib"
                    )

                    MISSING=0
                    for f in "${EXPECTED[@]}"; do
                      if ! unzip -l "$PACKAGE" | grep -q "$f"; then
                        echo "❌ Missing $f in $PACKAGE"
                        MISSING=$((MISSING+1))
                      else
                        echo "✅ Found $f"
                      fi
                    done

                    if [ $MISSING -gt 0 ]; then
                      echo "❌ $MISSING native file(s) missing in NativeBridge package"
                      exit 1
                    fi

            -   name: Verify Lack of NativeBridge Test Exports
                if: ${{ inputs.enable_test_exports == false }}
                shell: bash
                run: |
                    set -euo pipefail

                    PACKAGE=""
                    for candidate in ./release/InfiniLore.InfiniFrame.NativeBridge.*.nupkg; do
                      if [[ -f "$candidate" && "$candidate" != *.symbols.nupkg ]]; then
                        PACKAGE="$candidate"
                        break
                      fi
                    done

                    if [ -z "$PACKAGE" ]; then
                        echo "❌ No InfiniFrame.NativeBridge package found in ./release"
                        exit 1
                    fi

                    echo "Inspecting package: $PACKAGE"

                    DLL_PATH="runtimes/win-x64/native/InfiniFrame.Native.dll"

                    if ! unzip -l "$PACKAGE" | grep -q "$DLL_PATH"; then
                        echo "❌ Missing $DLL_PATH in package"
                        exit 1
                    fi

                    mkdir -p ./tmp/native-check

                    unzip -p "$PACKAGE" "$DLL_PATH" > ./tmp/native-check/InfiniFrame.Native.dll

                    DLL=./tmp/native-check/InfiniFrame.Native.dll

                    FORBIDDEN_EXPORTS=(
                      "InfiniFrameNativeTests_NativeParametersReturnAsIs"
                      "InfiniFrameNativeTests_FreeInitParams"
                    )

                    FOUND=0

                    for export_name in "${FORBIDDEN_EXPORTS[@]}"; do
                      if x86_64-w64-mingw32-nm -g --defined-only "$DLL" | awk '{print $3}' | grep -Fxq "$export_name"; then
                        echo "❌ Forbidden test export found: $export_name"
                        FOUND=$((FOUND+1))
                      else
                        echo "✅ Export not present: $export_name"
                      fi
                    done

                    if [ "$FOUND" -gt 0 ]; then
                      echo "❌ $FOUND forbidden test export(s) found in InfiniFrame.Native.dll"
                      exit 1
                    fi

                    echo "✅ No forbidden test exports found"

            -   name: Complete Dotnet Pack Check
                if: ${{ always() && github.event_name != 'pull_request' }}
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ env.TARGET_SHA }}
                    context: "CI: linux-x64/dotnet-pack"
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    job-status: ${{ job.status }}
                    success-description: Dotnet Pack finished successfully
                    failure-description: Dotnet Pack failed
