#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: win/trim-aot"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true
            enable_test_exports:
                description: 'Enable native/managed test exports in trim/AOT validation builds.'
                type: boolean
                required: false
                default: false

permissions:
    contents: read
    statuses: write
    checks: write

jobs:
    windows-trim-aot:
        name: "CI: win-x64/trim-aot"
        runs-on: windows-latest
        env:
            TARGET_SHA: ${{ inputs.target_sha }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false
                    brew-cache-key: ${{ runner.os }}-x64-brew-native-${{ hashFiles('.github/actions/setup-dependencies/action.yml', '.github/workflows/shared-testing-windows-trim-aot.yml') }}
                    brew-restore-key: ${{ runner.os }}-x64-brew-native-

            -   name: Set Trim/AOT Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ env.TARGET_SHA }}
                    context: "CI: win-x64/trim-aot"
                    state: pending
                    status-description: Trim and AOT validation in progress
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    allow-status-422: 'true'

            -   name: Setup Native dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    brew-cache-key: ${{ runner.os }}-x64-brew-native-${{ hashFiles('.github/actions/setup-dependencies/action.yml', '.github/workflows/shared-testing-windows-trim-aot.yml') }}
                    brew-restore-key: ${{ runner.os }}-x64-brew-native-

            -   name: Download Testing Native Build Artifacts
                uses: ./.github/actions/download-native-binaries
                with:
                    artifact-type: testing

            -   name: Trim Analyzer Builds
                run: |
                    $frameworks = @(Get-Content tool-versions.json -Raw | ConvertFrom-Json).dotnet | ForEach-Object { "net$_" }
                    foreach ($framework in $frameworks) {
                      dotnet build src/InfiniFrame.Shared/InfiniFrame.Shared.csproj `
                        --configuration Release --framework $framework `
                        -p:SolutionDir=$env:GITHUB_WORKSPACE/ -p:Platform=x64 `
                        -p:InfiniFrameSkipNativeBuild=true `
                        -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }} `
                        -p:EnableTrimAnalyzer=true -p:EnableAotAnalyzer=true `
                        -p:GeneratePackageOnBuild=false

                      dotnet build src/InfiniFrame.BlazorWebView/InfiniFrame.BlazorWebView.csproj `
                        --configuration Release --framework $framework `
                        -p:SolutionDir=$env:GITHUB_WORKSPACE/ -p:Platform=x64 `
                        -p:InfiniFrameSkipNativeBuild=true `
                        -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }} `
                        -p:EnableTrimAnalyzer=true -p:EnableAotAnalyzer=true `
                        -p:GeneratePackageOnBuild=false -p:SkipTypeScriptBuild=true

                      dotnet build src/InfiniFrame.WebServer/InfiniFrame.WebServer.csproj `
                        --configuration Release --framework $framework `
                        -p:SolutionDir=$env:GITHUB_WORKSPACE/ -p:Platform=x64 `
                        -p:InfiniFrameSkipNativeBuild=true `
                        -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }} `
                        -p:EnableTrimAnalyzer=true -p:EnableAotAnalyzer=true `
                        -p:GeneratePackageOnBuild=false -p:SkipTypeScriptBuild=true
                    }

            -   name: NativeAOT Smoke Publish (Consumer Example)
                run: |
                    $frameworks = @(Get-Content tool-versions.json -Raw | ConvertFrom-Json).dotnet | ForEach-Object { "net$_" }
                    foreach ($framework in $frameworks) {
                      dotnet publish examples/InfiniFrameExample.TrimAotSmoke/InfiniFrameExample.TrimAotSmoke.csproj `
                        --configuration Release --framework $framework --runtime win-x64 `
                        -p:SolutionDir=$env:GITHUB_WORKSPACE/ -p:Platform=x64 `
                        -p:InfiniFrameSkipNativeBuild=true `
                        -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }} `
                        -p:GeneratePackageOnBuild=false -p:SkipTypeScriptBuild=true
                    }

            -   name: Validate NativeAOT Output
                run: |
                    $outputName = "InfiniFrameExample.TrimAotSmoke.exe"
                    $frameworks = @(Get-Content tool-versions.json -Raw | ConvertFrom-Json).dotnet | ForEach-Object { "net$_" }
                    $missing = @()

                    foreach ($framework in $frameworks) {
                      $publishDirs = @(
                        "examples/InfiniFrameExample.TrimAotSmoke/bin/x64/Release/$framework/win-x64/publish",
                        "examples/InfiniFrameExample.TrimAotSmoke/bin/Release/$framework/win-x64/publish"
                      )
                      $found = $false
                      foreach ($publishDir in $publishDirs) {
                        $output = Join-Path $publishDir $outputName
                        if (Test-Path $output) {
                          Write-Host "✅ NativeAOT $framework output validated: $output"
                          $found = $true
                          break
                        }
                      }
                      if (-not $found) {
                        $missing += $framework
                      }
                    }

                    if ($missing.Count -gt 0) {
                      throw "Expected NativeAOT output not found for: $($missing -join ', ')"
                    }

            -   name: Complete Trim/AOT Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ env.TARGET_SHA }}
                    context: "CI: win-x64/trim-aot"
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    job-status: ${{ job.status }}
                    success-description: Trim and AOT validation finished successfully
                    failure-description: Trim and AOT validation failed
