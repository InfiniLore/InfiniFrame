name: Reusable MultiPlatform Testing

on:
    workflow_call:
        inputs:
            pr_number:
                description: 'PR number to test. Leave empty to test the current trigger commit (github.sha).'
                type: string
                required: true
            checkout_ref:
                description: 'Explicit git ref to checkout in downstream test jobs.'
                type: string
                required: false
                default: ''
            run_windows:
                description: 'Run Windows GUI tests'
                type: boolean
                required: true
            run_windows_playwright:
                description: 'Run Windows Playwright tests'
                type: boolean
                required: true
            run_linux:
                description: 'Run Linux GUI tests'
                type: boolean
                required: true
            run_macos:
                description: 'Run macOS GUI tests'
                type: boolean
                required: true

env:
    WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
    prepare:
        name: Resolve PR commit
        runs-on: ubuntu-latest
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}

        steps:
            -   name: Resolve PR head SHA
                id: resolve
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ -n "${{ inputs.pr_number }}" ]; then
                      SHA=$(curl -s \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        https://api.github.com/repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} \
                        | jq -r .head.sha)
                    else
                      SHA="${{ github.sha }}"
                    fi

                    if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
                      echo "Failed to resolve a valid commit SHA. Check pr_number input."
                      exit 1
                    fi

                    echo "sha=$SHA" >> $GITHUB_OUTPUT

    mark-pending:
        name: Mark Manual CI as Pending
        runs-on: ubuntu-latest
        needs: prepare
        permissions:
            statuses: write
        env:
            TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        steps:
            -   name: Set pending status for all arch/platforms
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    set -euo pipefail
                    echo "Posting pending statuses for all Manual MultiPlatform CI contexts"

                    OS_LIST=("Linux" "Windows" "macOS")
                    ARCHES=("x64" "arm64")

                    post_status() {
                      local payload="$1"
                      local response_file
                      response_file="$(mktemp)"
                      local http_status
                      http_status=$(curl -sS -o "$response_file" -w "%{http_code}" -X POST \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/repos/${{ github.repository }}/statuses/$TARGET_SHA" \
                        -d "$payload")
                      if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
                        echo "Failed to post status (HTTP $http_status)."
                        cat "$response_file"
                        rm -f "$response_file"
                        exit 1
                      fi
                      rm -f "$response_file"
                    }

                    for OS in "${OS_LIST[@]}"; do
                      for ARCH in "${ARCHES[@]}"; do
                        CONTEXT="Manual MultiPlatform CI - ${OS}/${ARCH}"
                        DESCRIPTION="${OS}/${ARCH} tests"
                        echo "Setting pending: $CONTEXT"

                        post_status "{\"state\":\"pending\",\"context\":\"$CONTEXT\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$WORKFLOW_URL\"}"
                      done
                    done

    # noinspection UndefinedAction, UndefinedParamsPresent
    linux-gui:
        if: ${{ inputs.run_linux == true }}
        needs: [prepare, mark-pending]
        uses: ./.github/workflows/reusable-linux-gui.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    windows-gui:
        if: ${{ inputs.run_windows == true }}
        needs: [prepare, mark-pending]
        uses: ./.github/workflows/reusable-windows-gui.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    windows-playwright:
        if: ${{ inputs.run_windows_playwright == true }}
        needs: [prepare, mark-pending]
        uses: ./.github/workflows/reusable-windows-playwright.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    macos-gui:
        if: ${{ inputs.run_macos == true }}
        needs: [prepare, mark-pending]
        uses: ./.github/workflows/reusable-macos-gui.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    mark-skipped:
        name: Mark Skipped Platforms
        runs-on: ubuntu-latest
        if: ${{ always() }}
        needs:
            - prepare
            - linux-gui
            - windows-gui
            - windows-playwright
            - macos-gui
        permissions:
            statuses: write
        env:
            TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        steps:
            -   name: Mark skipped platform statuses
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    set -euo pipefail
                    declare -A OS_INPUT_MAP=(
                      ["Linux"]="${{ inputs.run_linux }}"
                      ["Windows"]="${{ inputs.run_windows }}"
                      ["macOS"]="${{ inputs.run_macos }}"
                    )

                    ARCHES=("x64" "arm64")

                    post_status() {
                      local payload="$1"
                      local response_file
                      response_file="$(mktemp)"
                      local http_status
                      http_status=$(curl -sS -o "$response_file" -w "%{http_code}" -X POST \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        "https://api.github.com/repos/${{ github.repository }}/statuses/$TARGET_SHA" \
                        -d "$payload")
                      if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
                        echo "Failed to post status (HTTP $http_status)."
                        cat "$response_file"
                        rm -f "$response_file"
                        exit 1
                      fi
                      rm -f "$response_file"
                    }

                    for OS in "${!OS_INPUT_MAP[@]}"; do
                      if [[ "${OS_INPUT_MAP[$OS]}" != "true" ]]; then
                        for ARCH in "${ARCHES[@]}"; do
                          CONTEXT="Manual MultiPlatform CI - ${OS}/${ARCH}"
                          echo "Marking $CONTEXT as skipped"

                          post_status "{\"state\":\"success\",\"context\":\"$CONTEXT\",\"description\":\"skipped\",\"target_url\":\"$WORKFLOW_URL\"}"
                        done
                      fi
                    done
