#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: Linux Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                default: ''
                required: false
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true
            enable_test_exports:
                type: boolean
                required: false
                default: false
            enable_coverage:
                type: boolean
                required: false
                default: false

jobs:
    linux:
        name: CI Testing - Linux (${{ matrix.arch }}/${{ matrix.display_server }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-latest
                        arch: x64
                        display_server: x11
                        libName: linux
                        rid: linux-x64
                    -   os: ubuntu-latest
                        arch: x64
                        display_server: wayland
                        libName: linux
                        rid: linux-x64
                    -   os: ubuntu-24.04-arm
                        arch: arm64
                        display_server: x11
                        libName: linux
                        rid: linux-arm64
                    -   os: ubuntu-24.04-arm
                        arch: arm64
                        display_server: wayland
                        libName: linux
                        rid: linux-arm64
        permissions:
            contents: read
            statuses: write
            checks: write
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies-native

            -   name: Set Linux Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Linux/${{ matrix.arch }}/${{ matrix.display_server }}
                    state: pending
                    status-description: Linux tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Download Testing Native Build Artifacts
                uses: ./.github/actions/download-native-binaries
                with:
                    artifact-type: testing

            -   name: Compile GSettings schemas
                run: sudo glib-compile-schemas /usr/share/glib-2.0/schemas/

            -   name: Install Weston (Wayland)
                if: matrix.display_server == 'wayland'
                run: |
                    sudo apt-get update
                    sudo apt-get install -y weston

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503 /p:NativeArch=${{ matrix.arch }}

            -   name: Build Release
                run: |
                    dotnet build InfiniFrame.GitHubActions.Testing.slnf \
                      --configuration Release \
                      --no-restore \
                      -p:SolutionDir=${{ github.workspace }}/ \
                      -p:NativeArch=${{ matrix.arch }} \
                      -p:InfiniFrameSkipNativeBuild=true \
                      -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }}

            -   name: Install Native Debugging Tools
                run: |
                    sudo apt-get update
                    sudo apt-get install -y gdb libc6-dbg

            -   name: Export Actions Runtime
                uses: actions/github-script@v9
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

            -   name: Run Tests
                run: |
                    echo "Starting desktop environment..."

                    eval "$(dbus-launch --sh-syntax)"

                    if [ "${{ matrix.display_server }}" = "wayland" ]; then
                      echo "=== Wayland Setup ==="

                      export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
                      mkdir -p "$XDG_RUNTIME_DIR"
                      chmod 700 "$XDG_RUNTIME_DIR"
                      export XDG_SESSION_TYPE=wayland
                      export WAYLAND_DISPLAY=wayland-0

                      echo "Launching Weston (headless Wayland compositor)..."
                      weston --backend=headless --socket="$WAYLAND_DISPLAY" \
                        --width=1920 --height=1080 \
                        &> weston.log &

                      echo "Waiting for Wayland compositor..."
                      timeout 30 bash -c 'until [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; do sleep 1; done' || {
                        echo "Weston failed to start."
                        cat weston.log || true
                        exit 1
                      }

                      echo "=== Environment Status ==="
                      echo "Session: $XDG_SESSION_TYPE"
                      echo "Wayland display: $WAYLAND_DISPLAY"
                      echo "D-Bus: $DBUS_SESSION_BUS_ADDRESS"
                    else
                      echo "=== X11 Setup ==="

                      echo "Launching Xvfb..."
                      Xvfb :99 \
                        -screen 0 1920x1080x24 \
                        -ac \
                        +extension GLX \
                        +extension RANDR \
                        +extension RENDER \
                        -nolisten tcp \
                        -noreset &> xvfb.log &

                      export DISPLAY=:99

                      export XDG_RUNTIME_DIR="/tmp/runtime-$USER"
                      export XDG_SESSION_TYPE=x11
                      export DESKTOP_SESSION=openbox
                      export XDG_CURRENT_DESKTOP=Openbox

                      mkdir -p "$XDG_RUNTIME_DIR"
                      chmod 700 "$XDG_RUNTIME_DIR"

                      echo "Waiting for X server..."
                      timeout 30 bash -c 'until xdpyinfo >/dev/null 2>&1; do sleep 1; done' || {
                        echo "X server failed to start."
                        cat xvfb.log || true
                        exit 1
                      }

                      echo "Starting Openbox..."
                      openbox &> openbox.log &

                      timeout 20 bash -c 'until pgrep -x openbox >/dev/null; do sleep 1; done' || {
                        echo "Openbox failed to start."
                        cat openbox.log || true
                        exit 1
                      }

                      echo "Openbox is running:"
                      ps aux | grep "[o]penbox" || echo "Openbox missing unexpectedly"

                      timeout 5 xwininfo -root >/dev/null 2>&1 && echo "Window manager responding" || {
                        echo "Window manager not responding"
                        exit 1
                      }

                      echo "=== Environment Status ==="
                      echo "Display: $DISPLAY"
                      echo "Desktop: $XDG_CURRENT_DESKTOP"
                      echo "D-Bus: $DBUS_SESSION_BUS_ADDRESS"
                    fi

                    export LIBGL_ALWAYS_SOFTWARE=1
                    export GALLIUM_DRIVER=llvmpipe
                    export MESA_LOADER_DRIVER_OVERRIDE=llvmpipe
                    export MESA_GL_VERSION_OVERRIDE=3.3
                    export WEBKIT_DISABLE_COMPOSITING_MODE=1
                    export WEBKIT_DISABLE_DMABUF_RENDERER=1
                    export INFINIFRAME_LINUX_FORCE_SOFTWARE_RENDERING=1

                    xdpyinfo | head -3 || true

                    echo "=== OpenGL Info ==="
                    glxinfo | grep -E "OpenGL renderer|OpenGL vendor|OpenGL version" || true
                    
                    echo "=== Running Tests ==="
                    
                    mkdir -p artifacts/native-crash
                    ulimit -c unlimited
                    sudo sysctl -w kernel.core_uses_pid=1
                    sudo sysctl -w "kernel.core_pattern=${GITHUB_WORKSPACE}/artifacts/native-crash/core.%e.%p.%t"

                    exit_code=0

                    run_test() {
                      local framework="$1"
                      echo "=== Running ${framework} ==="
                      local test_args=(
                        test
                        --solution InfiniFrame.GitHubActions.Testing.slnf
                        --configuration Release
                        --no-build
                        --no-restore
                        --framework "$framework"
                        -p:NativeArch=${{ matrix.arch }}
                        -p:InfiniFrameSkipNativeBuild=true
                        -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }}
                        --
                        --no-ansi
                        --maximum-parallel-tests 1
                      )

                      if [ "${{ inputs.enable_coverage }}" = "true" ] && [ "$framework" = "net10.0" ]; then
                        test_args+=(--coverage --coverage-output-format cobertura --results-directory TestResults)
                      fi

                      dotnet "${test_args[@]}" || exit_code=$?
                    }

                    run_test net8.0
                    run_test net9.0
                    run_test net10.0

                    shopt -s nullglob
                    for core_file in artifacts/native-crash/core.*; do
                      core_name="$(basename "$core_file")"
                      dump_file="artifacts/native-crash/${core_name}.gdb.txt"
                      core_meta="$(file "$core_file" || true)"
                      exe_path="$(echo "$core_meta" | sed -n "s/.*execfn: '\\([^']*\\)'.*/\\1/p")"
                      if [ -z "$exe_path" ] || [ ! -x "$exe_path" ]; then
                        exe_path="/usr/bin/dotnet"
                      fi
                      {
                        echo "===== CORE FILE ====="
                        echo "$core_file"
                        echo
                        echo "$core_meta"
                        echo
                        echo "===== EXECUTABLE ====="
                        echo "$exe_path"
                        echo
                      } > "$dump_file"

                      gdb -q --batch \
                        -ex "set pagination off" \
                        -ex "set confirm off" \
                        -ex "echo ===== INFO FILES =====\n" \
                        -ex "info files" \
                        -ex "echo \n===== THREAD BACKTRACES =====\n" \
                        -ex "thread apply all bt full" \
                        -ex "echo \n===== REGISTERS =====\n" \
                        -ex "info registers" \
                        -ex "echo \n===== SHARED LIBS =====\n" \
                        -ex "info sharedlibrary" \
                        "$exe_path" "$core_file" >> "$dump_file" 2>&1 || true
                    done

                    exit $exit_code

            -   name: Upload Native Crash Diagnostics
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: linux-native-crash-${{ matrix.arch }}-${{ matrix.display_server }}
                    path: |
                        artifacts/native-crash/**
                        core*
                    if-no-files-found: ignore

            -   name: Upload C# Coverage
                if: ${{ inputs.enable_coverage == true && success() }}
                uses: actions/upload-artifact@v7
                with:
                    name: cs-coverage-linux-${{ matrix.arch }}-${{ matrix.display_server }}
                    path: TestResults/**/*.cobertura.xml
                    if-no-files-found: warn
                    retention-days: 1

            -   name: SingleFile E2E
                uses: ./.github/actions/singlefile-e2e
                with:
                    project: examples/SingleFileExe/InfiniFrameExample.SingleFileExe/InfiniFrameExample.SingleFileExe.csproj
                    rid: ${{ matrix.rid }}
                    output: artifacts/pack-e2e/InfiniFrameExample.SingleFileExe
                    main-output-name: InfiniFrameExample.SingleFileExe
                    forbidden-entries: |
                        wwwroot
                        InfiniFrame.Native.dll
                        WebView2Loader.dll
                        InfiniFrame.Native.so
                        InfiniFrame.Native.dylib

            -   name: Update Linux Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check-finalize
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Linux/${{ matrix.arch }}/${{ matrix.display_server }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: Linux tests passed
                    failure-description: Linux tests failed
