name: "CodeQL Advanced"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "core" ]
  pull_request:
    branches: [ "core" ]
  schedule:
    - cron: '24 0 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: c-cpp
            os: ubuntu-latest
            build-mode: manual
          - language: c-cpp
            os: windows-latest
            build-mode: manual
          - language: c-cpp
            os: macos-latest
            build-mode: manual
          - language: csharp
            os: ubuntu-latest
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: python
            os: ubuntu-latest
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
            fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
            dotnet-version: |
                8.x
                9.x
                10.x

      - name: Setup CMake
        if: matrix.language == 'c-cpp'
        uses: lukka/get-cmake@latest

      - name: Setup Native dependencies
        if: matrix.language == 'c-cpp' || matrix.language == 'csharp'
        uses: ./.github/actions/setup-dependencies-native
        # noinspection UndefinedParamsPresent
        with:
          apt-cache-version: 1.0
          brew-cache-key: ${{ runner.os }}-${{ matrix.language }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/codeql.yml') }}
          brew-restore-key: ${{ runner.os }}-${{ matrix.language }}-brew-native-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      
      - name: Restore C# (.slnx)
        if: matrix.language == 'c-cpp' || matrix.language == 'csharp'
        run: |
            dotnet restore InfiniFrame.slnx

      - name: Build Native (CodeQL)
        if: matrix.language == 'c-cpp'
        shell: pwsh
        run: |
          dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj --configuration Release --no-restore -p:SolutionDir="${{ github.workspace }}/" -p:Platform=x64

      - name: Build C# (.slnx)
        if: matrix.language == 'csharp'
        run: |
          dotnet build InfiniFrame.slnx --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
