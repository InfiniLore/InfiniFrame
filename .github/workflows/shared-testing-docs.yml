name: "Shared: Docs Tests"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true

permissions:
    contents: read
    statuses: write
    checks: write

jobs:
    docs-validation:
        name: CI Testing - Docs
        runs-on: ubuntu-latest
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}
            
            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: 10.x

            -   name: Setup Node
                uses: actions/setup-node@v6
                with:
                    node-version: 22
            
            -   name: Cache .NET Tools & NuGet
                uses: actions/cache@v5
                with:
                    path: |
                        ~/.nuget/packages
                        ~/.dotnet/tools
                    key: dotnet-tools-${{ runner.os }}-docfx-2.78.5
                    restore-keys: |
                        dotnet-tools-${{ runner.os }}-docfx-

            -   name: Add Tools Path
                run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
            
            -   name: Install DocFX if needed
                run: |
                    set -euo pipefail
                    REQUIRED_VERSION=2.78.5
                    
                    INSTALLED_VERSION=$(dotnet tool list --global | awk '$1=="docfx"{print $2}')
                    if [ "$INSTALLED_VERSION" = "$REQUIRED_VERSION" ]; then
                        echo "DocFX $REQUIRED_VERSION already installed, skipping install."
                    elif [ -n "$INSTALLED_VERSION" ]; then
                        echo "DocFX version mismatch ($INSTALLED_VERSION), reinstalling..."
                        dotnet tool update --global docfx --version $REQUIRED_VERSION
                    else
                        echo "DocFX not found, installing..."
                        dotnet tool install --global docfx --version $REQUIRED_VERSION
                    fi

            -   name: Install Deps
                uses: awalsh128/cache-apt-pkgs-action@v1
                with:
                    packages: doxygen
                    
            -   name: Set Docs Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check
                # noinspection UndefinedAction, UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ env.TARGET_SHA }}
                    context: CI Testing - Docs
                    state: pending
                    status-description: Docs validation in progress
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    allow-status-422: 'true'
            
            -   name: Generate API Metadata
                run: docfx metadata docs/docfx.json

            -   name: Generate C++ Docs
                shell: pwsh
                run: ./docs/scripts/update-cpp-api.ps1 -Required
            
            -   name: Build Docs
                shell: bash
                run: |
                    set -euo pipefail

                    docfx build docs/docfx.json 2>&1 | tee /tmp/docfx-build.log
                    if grep -Eq '^[[:space:]]*[1-9][0-9]* warning\(s\)' /tmp/docfx-build.log; then
                      exit 1
                    fi
            
            -   name: Complete Docs Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ env.TARGET_SHA }}
                    context: CI Testing - Docs
                    state: ${{ job.status == 'success' && 'success' || 'failure' }}
                    status-description: ${{ job.status == 'success' && 'Docs validation finished successfully' || 'Docs validation failed due to warnings or errors' }}
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    allow-status-422: 'true'
                    complete-check-runs: 'true'
                    check-conclusion: ${{ job.status == 'success' && 'success' || 'failure' }}
                    check-summary: ${{ job.status == 'success' && 'Docs validation finished successfully' || 'Docs validation failed due to warnings or errors' }}
                    require-update: 'true'
                    create-check-run-if-missing: 'true'
