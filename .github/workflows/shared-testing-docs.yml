#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: docs"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true

permissions:
    contents: read

jobs:
    docs-validation:
        name: "CI: docs"
        runs-on: ubuntu-26.04
        env:
            TARGET_SHA: ${{ inputs.target_sha }}

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}

            -   name: Read CI tool versions
                id: versions
                uses: ./.github/actions/read-tool-versions

            -   name: Setup Node
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
                with:
                    node-version: ${{ steps.versions.outputs.node }}
                    cache: npm
                    cache-dependency-path: |
                        docs/package-lock.json

            -   name: Install Docusaurus Dependencies
                shell: bash
                run: npm ci --prefix docs

            -   name: Build Docusaurus Docs
                shell: bash
                run: npm --prefix docs run build
