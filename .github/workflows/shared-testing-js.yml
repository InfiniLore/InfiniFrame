name: "Shared: Js Tests"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true

permissions:
    contents: read
    statuses: write
    checks: write

jobs:
    js-validation:
        name: CI Testing - JS Bundling
        runs-on: ubuntu-latest
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}
            
            -   name: Setup Node
                uses: actions/setup-node@v6
                with:
                    node-version: 24
                    cache: npm
                    cache-dependency-path: |
                        package-lock.json

            -   name: Install dependencies
                shell: bash
                run: npm ci

            -   name: Build bundle
                shell: bash
                run: npm run production:build

            -   name: Verify no drift
                shell: bash
                run: |
                    if ! git diff --exit-code -- src/InfiniFrame.Js/wwwroot/InfiniFrame.js; then
                        echo "❌ InfiniFrame.js is out of date."
                        echo "Run: npm run production:build"
                        echo "Then commit the updated src/InfiniFrame.Js/wwwroot/InfiniFrame.js"
                        exit 1
                    fi
            
            -   name: Complete Js Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction, UndefinedParamsPresent
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ env.TARGET_SHA }}
                    context: CI Testing - Js Bundling
                    target-url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
                    job-status: ${{ job.status }}
                    success-description: Js validation finished successfully
                    failure-description: Js validation failed
