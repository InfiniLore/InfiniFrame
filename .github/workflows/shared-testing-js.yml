#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: js"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true
            enable_coverage:
                description: 'Enable code coverage collection'
                type: boolean
                required: false
                default: true

permissions:
    contents: read

jobs:
    js-validation:
        name: "CI: js"
        runs-on: ubuntu-26.04
        env:
            TARGET_SHA: ${{ inputs.target_sha }}

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}

            -   name: Setup Node
                id: versions
                uses: ./.github/actions/read-tool-versions

            -   name: Configure Node
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
                with:
                    node-version: ${{ steps.versions.outputs.node }}

            -   name: Install dependencies
                shell: bash
                working-directory: src/InfiniFrame.Js
                run: npm ci

            -   name: Build bundle
                shell: bash
                working-directory: src/InfiniFrame.Js
                run: npm run build

            -   name: Run unit tests
                shell: bash
                working-directory: src/InfiniFrame.Js
                run: |
                    if [ "${{ inputs.enable_coverage }}" = "true" ]; then
                      npm run test:coverage
                    else
                      npm run test
                    fi

            -   name: Upload TS Coverage
                if: ${{ inputs.enable_coverage == true && success() }}
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
                with:
                    name: ts-coverage
                    path: src/InfiniFrame.Js/coverage/lcov.info
                    if-no-files-found: warn
                    retention-days: 1
