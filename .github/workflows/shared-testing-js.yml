#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: Js Tests"

on:
    workflow_call:
        inputs:
            checkout_ref:
                description: 'Git ref to checkout (optional)'
                type: string
                required: false
                default: ''
            target_sha:
                description: 'Commit SHA used for status/check updates'
                type: string
                required: true
            enable_coverage:
                description: 'Enable code coverage collection'
                type: boolean
                required: false
                default: true

permissions:
    contents: read
    statuses: write
    checks: write

jobs:
    js-validation:
        name: CI Testing - JS/TS
        runs-on: ubuntu-latest
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || env.TARGET_SHA }}

            -   name: Setup Node
                uses: actions/setup-node@v7
                with:
                    node-version: 24

            -   name: Install dependencies
                shell: bash
                working-directory: src/InfiniFrame.Js
                run: npm ci

            -   name: Build bundle
                shell: bash
                working-directory: src/InfiniFrame.Js
                run: npm run build

            -   name: Run unit tests
                shell: bash
                working-directory: src/InfiniFrame.Js
                run: |
                    if [ "${{ inputs.enable_coverage }}" = "true" ]; then
                      npm run test:coverage
                    else
                      npm run test
                    fi

            -   name: Upload TS Coverage
                if: ${{ inputs.enable_coverage == true && success() }}
                uses: actions/upload-artifact@v7
                with:
                    name: ts-coverage
                    path: src/InfiniFrame.Js/coverage/lcov.info
                    if-no-files-found: warn
                    retention-days: 1
