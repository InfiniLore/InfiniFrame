
name: Release to Nuget

on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: 'Version bump type'
                required: true
                type: choice
                options:
                    - major
                    - minor
                    - patch
                    - preview
            publish_to_nuget:
                description: 'Publish to NuGet after building'
                type: boolean
                default: true

permissions:
    contents: write
    packages: write
    statuses: write

jobs:
    # ------------------------------------------------------------------------------------------------------------------
    # Bump version, commit, and tag
    # ------------------------------------------------------------------------------------------------------------------
    bump-version:
        name: Bump Version
        runs-on: ubuntu-latest
        outputs:
            new_version: ${{ steps.bump.outputs.version }}
            tag_name: ${{ steps.bump.outputs.tag }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0
                    token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Setup Python
                uses: actions/setup-python@v6
                with:
                    python-version: '3.x'

            -   name: Configure Git
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

            -   name: Bump version
                id: bump
                run: |
                    cd dev
                    python bump_version.py ${{ inputs.version_bump }}
                    
                    # Extract the new version and tag from git
                    TAG=$(git describe --tags --abbrev=0)
                    VERSION=${TAG#v}
                    
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                    echo "tag=$TAG" >> $GITHUB_OUTPUT
                    echo "Bumped to version: $VERSION (tag: $TAG)"

    # ------------------------------------------------------------------------------------------------------------------
    # Run multi-platform tests first
    # ------------------------------------------------------------------------------------------------------------------
    run-tests:
        name: Run Multi-Platform Tests
        needs: bump-version
        uses: ./.github/workflows/onPullRequest-multiPlatformTesting.yml
    
    # ------------------------------------------------------------------------------------------------------------------
    # Build multi-architecture binaries
    # ------------------------------------------------------------------------------------------------------------------
    build:
        name: Build ${{ matrix.os }} / ${{ matrix.arch }}
        runs-on: ${{ matrix.os }}
        needs: [bump-version, run-tests]
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-latest
                        arch: x64
                        libName: linux
                    -   os: ubuntu-24.04-arm
                        arch: arm64
                        libName: linux
                    -   os: windows-latest
                        arch: x64
                        libName: windows
                    -   os: windows-11-arm
                        arch: arm64
                        libName: windows
                    -   os: macos-15-intel
                        arch: x64
                        libName: osx
                    -   os: macos-latest
                        arch: arm64
                        libName: osx
        env:
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
            DOTNET_CLI_TELEMETRY_OPTOUT: 1
            Configuration: Release

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ needs.bump-version.outputs.tag_name }}
                    fetch-depth: 0

            -   name: Setup .NET SDK
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Cache NuGet packages
                uses: actions/cache@v4
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
                    restore-keys: ${{ runner.os }}-nuget-

            -   name: Setup CMake
                uses: lukka/get-cmake@latest

            -   name: Install GTK3 (Linux)
                if: startsWith(matrix.os, 'ubuntu')
                run: |
                    sudo apt-get update
                    sudo apt install -y \
                        libgtk-3-dev \
                        libwebkit2gtk-4.1-dev \
                        libssl-dev \
                        libcurl4-openssl-dev \
                        zlib1g-dev \
                        libnotify-dev

            -   name: Install GTK3 (macOS)
                if: startsWith(matrix.os, 'macos')
                run: |
                    brew list gtk+3 >/dev/null 2>&1 || brew install gtk+3
                    brew list pkg-config >/dev/null 2>&1 || brew install pkg-config

            -   name: Build InfiniFrame.Native
                shell: bash
                run: |
                    dotnet build "src/InfiniFrame.Native/InfiniFrame.Native.proj" \
                        --configuration Release \
                        --no-restore \
                        -p:SolutionDir="${{ github.workspace }}/" \
                        -p:Platform=${{ matrix.arch }}

            -   name: Upload build artifact
                uses: actions/upload-artifact@v5
                with:
                    name: native-${{ matrix.libName }}-${{ matrix.arch }}
                    path: ${{ github.workspace }}/artifacts/native/${{ matrix.libName }}/${{ matrix.arch }}/Release/**

    # ------------------------------------------------------------------------------------------------------------------
    # Release + pack
    # ------------------------------------------------------------------------------------------------------------------
    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        needs: [bump-version, build]

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ needs.bump-version.outputs.tag_name }}
                    fetch-depth: 0

            -   name: Setup .NET SDK
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            # Cache APT packages to avoid re-downloading
            -   name: Cache APT packages
                uses: actions/cache@v4
                with:
                    path: |
                        /var/cache/apt/archives
                        /var/lib/apt/lists
                    key: ${{ runner.os }}-apt-${{ hashFiles('**/OnRelease.yml') }}
                    restore-keys: |
                        ${{ runner.os }}-apt-

            # Cache .NET packages
            -   name: Cache .NET packages
                uses: actions/cache@v4
                with:
                    path: ~/.nuget/packages
                    key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
                    restore-keys: |
                        ${{ runner.os }}-nuget-

            -   name: Download build artifacts
                uses: actions/download-artifact@v6
                with:
                    path: artifacts/native

            -   name: Normalize native folder structure
                run: |
                    set -e
                    
                    # Ensure final structure exists
                    mkdir -p artifacts/native/windows/x64/Release
                    mkdir -p artifacts/native/windows/arm64/Release
                    mkdir -p artifacts/native/linux/x64/Release
                    mkdir -p artifacts/native/linux/arm64/Release
                    mkdir -p artifacts/native/osx/x64/Release
                    mkdir -p artifacts/native/osx/arm64/Release
                    
                    # Map downloaded artifact folders into final layout
                    declare -A MAP
                    MAP["native-windows-x64"]="artifacts/native/windows/x64/Release"
                    MAP["native-windows-arm64"]="artifacts/native/windows/arm64/Release"
                    MAP["native-linux-x64"]="artifacts/native/linux/x64/Release"
                    MAP["native-linux-arm64"]="artifacts/native/linux/arm64/Release"
                    MAP["native-osx-x64"]="artifacts/native/osx/x64/Release"
                    MAP["native-osx-arm64"]="artifacts/native/osx/arm64/Release"
                    
                    for key in "${!MAP[@]}"; do
                        src="artifacts/native/$key"
                        dest="${MAP[$key]}"
                        if [ -d "$src" ]; then
                            mv "$src"/* "$dest"/ 2>/dev/null || true
                        fi
                    done

            -   name: Verify native artifacts
                run: |
                    echo "Checking native build artifacts..."
                    EXPECTED_ARTIFACTS=(
                      "windows/x64/Release/InfiniFrame.Native.dll"
                      "windows/x64/Release/WebView2Loader.dll"
                      "windows/arm64/Release/InfiniFrame.Native.dll"
                      "windows/arm64/Release/WebView2Loader.dll"
                      "linux/x64/Release/InfiniFrame.Native.so"
                      "linux/arm64/Release/InfiniFrame.Native.so"
                      "osx/x64/Release/InfiniFrame.Native.dylib"
                      "osx/arm64/Release/InfiniFrame.Native.dylib"
                    )
                    
                    MISSING=0
                    for file in "${EXPECTED_ARTIFACTS[@]}"; do
                      if [ ! -f "./artifacts/native/$file" ]; then
                        echo "❌ Missing artifact: $file"
                        MISSING=$((MISSING+1))
                      else
                        echo "✅ Found: $file"
                      fi
                    done
                    
                    if [ $MISSING -gt 0 ]; then
                      echo "❌ $MISSING artifact(s) missing! Aborting."
                      exit 1
                    fi

            -   name: Setup CMake
                uses: lukka/get-cmake@latest

            -   name: Build .NET (pack solution)
                run: |
                    dotnet restore InfiniFrame.GitHubActions.Pack.slnf /p:NoWarn=NU1503
                    
                    dotnet build InfiniFrame.GitHubActions.Pack.slnf \
                      --configuration Release \
                      --no-restore \
                      /p:SolutionDir=${{ github.workspace }}/

            -   name: Pack
                run: |
                    dotnet pack InfiniFrame.GitHubActions.Pack.slnf \
                      --configuration Release \
                      -o ./release

            -   name: Upload NuGet packages as artifact
                uses: actions/upload-artifact@v5
                with:
                    name: nuget-packages-${{ needs.bump-version.outputs.tag_name }}
                    path: ./release/*.nupkg

            -   name: Verify native libraries in Shared NuGet package
                run: |
                    # Find the Shared package (PACKAGE ID, not namespace)
                    PACKAGE=$(ls ./release/InfiniLore.InfiniFrame.Shared.*.nupkg | head -n 1)
                    
                    if [ -z "$PACKAGE" ]; then
                        echo "❌ No Shared package found in ./release !"
                        exit 1
                    fi
                    
                    EXPECTED=(
                      "runtimes/win-x64/native/InfiniFrame.Native.dll"
                      "runtimes/win-x64/native/WebView2Loader.dll"
                      "runtimes/win-arm64/native/InfiniFrame.Native.dll"
                      "runtimes/win-arm64/native/WebView2Loader.dll"
                      "runtimes/linux-x64/native/InfiniFrame.Native.so"
                      "runtimes/linux-arm64/native/InfiniFrame.Native.so"
                      "runtimes/osx-x64/native/InfiniFrame.Native.dylib"
                      "runtimes/osx-arm64/native/InfiniFrame.Native.dylib"
                    )
                    
                    MISSING=0
                    for f in "${EXPECTED[@]}"; do
                      if ! unzip -l "$PACKAGE" | grep -q "$f"; then
                        echo "❌ Missing $f in $PACKAGE"
                        MISSING=$((MISSING+1))
                      else
                        echo "✅ Found $f"
                      fi
                    done
                    
                    if [ $MISSING -gt 0 ]; then
                      echo "❌ $MISSING native file(s) missing in Shared package! Aborting."
                      exit 1
                    fi

            -   name: Create GitHub Release
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ needs.bump-version.outputs.tag_name }}
                    name: Release ${{ needs.bump-version.outputs.new_version }}
                    generate_release_notes: true
                    files: ./release/*.nupkg
                    prerelease: ${{ contains(needs.bump-version.outputs.new_version, 'preview') }}

            -   name: Push to NuGet
                if: inputs.publish_to_nuget
                env:
                    NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "$NUGET_API_KEY" \
                      --source https://api.nuget.org/v3/index.json \
                      --skip-duplicate