name: "Shared: Platform Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                description: 'PR number to test. Leave empty to test the current trigger commit (github.sha).'
                type: string
                required: true
            checkout_ref:
                description: 'Explicit git ref to checkout in downstream test jobs.'
                type: string
                required: false
                default: ''
            run_windows:
                description: 'Run Windows GUI tests'
                type: boolean
                required: true
            run_windows_playwright:
                description: 'Run Windows Playwright tests'
                type: boolean
                required: true
            run_linux:
                description: 'Run Linux GUI tests'
                type: boolean
                required: true
            run_macos:
                description: 'Run macOS GUI tests'
                type: boolean
                required: true

env:
    WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
    prepare:
        name: Resolve Target SHA
        runs-on: ubuntu-latest
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}

        steps:
            -   name: Resolve PR SHA
                id: resolve
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ -n "${{ inputs.pr_number }}" ]; then
                      SHA=$(curl -s \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        https://api.github.com/repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} \
                        | jq -r .head.sha)
                    else
                      SHA="${{ github.sha }}"
                    fi

                    if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
                      echo "Failed to resolve a valid commit SHA. Check pr_number input."
                      exit 1
                    fi

                    echo "sha=$SHA" >> $GITHUB_OUTPUT

    docs-validation:
        name: Validate Docs
        runs-on: ubuntu-latest
        needs: prepare

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || needs.prepare.outputs.sha }}

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Setup Node
                uses: actions/setup-node@v5
                with:
                    node-version: 22

            -   name: Install DocFX
                run: dotnet tool install --global docfx --version 2.78.5

            -   name: Add Tools Path
                run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

            -   name: Install Doxygen
                run: |
                    sudo apt-get update
                    sudo apt-get install -y doxygen

            -   name: Generate API Metadata
                run: docfx metadata docs/docfx.json

            -   name: Generate C++ Docs
                shell: pwsh
                run: ./docs/scripts/update-cpp-api.ps1 -Required

            -   name: Build Docs
                shell: bash
                run: |
                    set -euo pipefail
                    docfx build docs/docfx.json 2>&1 | tee /tmp/docfx-build.log

                    if grep -Eq '^[[:space:]]*[1-9][0-9]* warning\(s\)' /tmp/docfx-build.log; then
                      echo "DocFX reported warnings; failing docs validation."
                      exit 1
                    fi

    mark-pending:
        name: Set Pending Checks
        runs-on: ubuntu-latest
        needs: [ prepare, docs-validation ]
        permissions:
            statuses: write
        env:
            TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Set Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    set -euo pipefail
                    echo "Posting pending statuses for all Manual MultiPlatform CI contexts"

                    OS_LIST=("Linux" "Windows" "macOS")
                    ARCHES=("x64" "arm64")
                    for OS in "${OS_LIST[@]}"; do
                      for ARCH in "${ARCHES[@]}"; do
                        CONTEXT="Manual MultiPlatform CI - ${OS}/${ARCH}"
                        DESCRIPTION="${OS}/${ARCH} tests"
                        echo "Setting pending: $CONTEXT"

                        python .github/scripts/sync_github_checks.py \
                          --repo "${{ github.repository }}" \
                          --sha "$TARGET_SHA" \
                          --context "$CONTEXT" \
                          --state pending \
                          --description "$DESCRIPTION" \
                          --target-url "$WORKFLOW_URL" \
                          --allow-status-422
                      done
                    done

    # noinspection UndefinedAction, UndefinedParamsPresent
    linux-gui:
        name: Linux GUI Tests
        if: ${{ inputs.run_linux == true }}
        needs: [ prepare, mark-pending ]
        uses: ./.github/workflows/shared-testing-gui-linux.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    windows-gui:
        name: Windows GUI Tests
        if: ${{ inputs.run_windows == true }}
        needs: [ prepare, mark-pending ]
        uses: ./.github/workflows/shared-testing-gui-windows.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    windows-playwright:
        name: Windows Playwright Tests
        if: ${{ inputs.run_windows_playwright == true }}
        needs: [ prepare, mark-pending ]
        uses: ./.github/workflows/shared-testing-playwright-windows.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    macos-gui:
        name: macOS GUI Tests
        if: ${{ inputs.run_macos == true }}
        needs: [ prepare, mark-pending ]
        uses: ./.github/workflows/shared-testing-gui-macos.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    mark-skipped:
        name: Mark Skipped Checks
        runs-on: ubuntu-latest
        if: ${{ always() }}
        needs:
            - prepare
            - linux-gui
            - windows-gui
            - windows-playwright
            - macos-gui
        permissions:
            statuses: write
            checks: write
        env:
            TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v6

            -   name: Mark Skipped
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    set -euo pipefail
                    declare -A OS_INPUT_MAP=(
                      ["Linux"]="${{ inputs.run_linux }}"
                      ["Windows"]="${{ inputs.run_windows }}"
                      ["macOS"]="${{ inputs.run_macos }}"
                    )

                    ARCHES=("x64" "arm64")

                    for OS in "${!OS_INPUT_MAP[@]}"; do
                      if [[ "${OS_INPUT_MAP[$OS]}" != "true" ]]; then
                        for ARCH in "${ARCHES[@]}"; do
                          CONTEXT="Manual MultiPlatform CI - ${OS}/${ARCH}"
                          echo "Marking $CONTEXT as skipped"

                          python .github/scripts/sync_github_checks.py \
                            --repo "${{ github.repository }}" \
                            --sha "$TARGET_SHA" \
                            --context "$CONTEXT" \
                            --state success \
                            --description "skipped" \
                            --target-url "$WORKFLOW_URL" \
                            --allow-status-422 \
                            --complete-check-runs \
                            --check-conclusion success \
                            --check-summary "Skipped because this platform was not selected for this run." \
                            --require-update
                        done
                      fi
                    done
