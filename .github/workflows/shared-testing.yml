#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: tests"
permissions:
    contents: read
    packages: read
on:
    workflow_call:
        inputs:
            pr_number:
                description: 'PR number to test. Leave empty to test the current trigger commit (github.sha).'
                type: string
                required: true
            checkout_ref:
                description: 'Explicit git ref to checkout in downstream test jobs.'
                type: string
                required: false
                default: ''
            run_windows:
                description: 'Run Windows tests'
                type: boolean
                required: true
            run_windows_playwright:
                description: 'Run Windows Playwright tests'
                type: boolean
                required: true
            run_linux:
                description: 'Run Linux tests'
                type: boolean
                required: true
            run_macos:
                description: 'Run macOS tests'
                type: boolean
                required: true
            run_docs:
                description: 'Run docs validation'
                type: boolean
                required: true
            run_trim_aot:
                description: 'Run trim and NativeAOT compatibility validation'
                type: boolean
                required: true
            enable_test_exports:
                description: 'Enable native/managed test exports for test workflows'
                type: boolean
                required: false
                default: false
            enable_coverage:
                description: 'Enable code coverage collection'
                type: boolean
                required: false
                default: true

jobs:

    docs-validation:
        name: "CI: docs"
        if: ${{ inputs.run_docs == true }}
        uses: ./.github/workflows/shared-testing-docs.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
        secrets: inherit

    js-validation:
        name: "CI: js"
        uses: ./.github/workflows/shared-testing-js.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            enable_coverage: ${{ inputs.enable_coverage }}

    native-build:
        name: Build Native Artifacts
        uses: ./.github/workflows/shared-testing-build.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            enable_test_exports: ${{ inputs.enable_test_exports }}

    dotnetpack-validation:
        name: "CI: linux-x64/dotnet-pack"
        needs: [ native-build ]
        uses: ./.github/workflows/shared-testing-dotnetpack.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            enable_test_exports: ${{ inputs.enable_test_exports }}

    linux:
        name: "CI: linux"
        if: ${{ inputs.run_linux == true }}
        needs: [ native-build ]
        uses: ./.github/workflows/shared-testing-linux.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
            enable_coverage: ${{ inputs.enable_coverage }}
        secrets: inherit

    macos:
        name: "CI: osx"
        if: ${{ inputs.run_macos == true }}
        needs: [ native-build ]
        uses: ./.github/workflows/shared-testing-macos.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
            # Coverage is disabled on macOS: Microsoft.Testing.Extensions.CodeCoverage
            # 18.12.0 (the latest published release) corrupts its IL instrumentation and
            # coverage data on macOS with .NET 11 - every net11.0 test host aborted with
            # "BadImageFormatException: Bad IL format" and its own merge logged
            # "CoverageHeaderReader.ValidateFileHeader: header magic is invalid", so the
            # macOS coverage output was unusable for the badge anyway. Re-enable once a
            # fixed coverage extension is published. Linux and Windows keep coverage.
            enable_coverage: false
        secrets: inherit

    windows:
        name: "CI: win"
        if: ${{ inputs.run_windows == true }}
        needs: [ native-build ]
        uses: ./.github/workflows/shared-testing-windows.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
            enable_coverage: ${{ inputs.enable_coverage }}
        secrets: inherit

    windows-playwright:
        name: "CI: win/automation"
        if: ${{ inputs.run_windows_playwright == true }}
        needs: [ native-build ]
        uses: ./.github/workflows/shared-testing-windows-automation.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
        secrets: inherit

    singlefile-e2e:
        name: "CI: singlefile"
        needs: [ native-build ]
        uses: ./.github/workflows/shared-testing-singlefile-e2e.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}

    windows-trim-aot:
        name: "CI: win/trim-aot"
        if: ${{ inputs.run_trim_aot == true }}
        needs: [ native-build ]
        uses: ./.github/workflows/shared-testing-windows-trim-aot.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ github.sha }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
