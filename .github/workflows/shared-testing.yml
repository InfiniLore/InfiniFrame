#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: Platform Tests"
permissions:
    contents: read
    statuses: write
    checks: write
on:
    workflow_call:
        inputs:
            pr_number:
                description: 'PR number to test. Leave empty to test the current trigger commit (github.sha).'
                type: string
                required: true
            checkout_ref:
                description: 'Explicit git ref to checkout in downstream test jobs.'
                type: string
                required: false
                default: ''
            run_windows:
                description: 'Run Windows tests'
                type: boolean
                required: true
            run_windows_playwright:
                description: 'Run Windows Playwright tests'
                type: boolean
                required: true
            run_linux:
                description: 'Run Linux tests'
                type: boolean
                required: true
            run_macos:
                description: 'Run macOS tests'
                type: boolean
                required: true
            run_docs:
                description: 'Run docs validation'
                type: boolean
                required: true
            run_trim_aot:
                description: 'Run trim and NativeAOT compatibility validation'
                type: boolean
                required: true
            enable_test_exports:
                description: 'Enable native/managed test exports for test workflows'
                type: boolean
                required: false
                default: false

jobs:

    prepare:
        name: Resolve Target SHA
        runs-on: ubuntu-latest
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}

        steps:
            -   name: Resolve PR SHA
                id: resolve
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ -n "${{ inputs.pr_number }}" ]; then
                      SHA=$(curl -s \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        https://api.github.com/repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} \
                        | jq -r .head.sha)
                    else
                      SHA="${{ github.sha }}"
                    fi

                    if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
                      echo "Failed to resolve a valid commit SHA. Check pr_number input."
                      exit 1
                    fi

                    echo "sha=$SHA" >> $GITHUB_OUTPUT

    docs-validation:
        name: Validate Docs
        if: ${{ inputs.run_docs == true }}
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-docs.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
        secrets: inherit

    js-validation:
        name: Validate JS
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-js.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}

    native-build:
        name: Build Native Artifacts
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-build.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            enable_test_exports: ${{ inputs.enable_test_exports }}

    dotnetpack-validation:
        name: Validate Dotnet Pack
        needs: [ prepare, native-build ]
        uses: ./.github/workflows/shared-testing-dotnetpack.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            enable_test_exports: ${{ inputs.enable_test_exports }}

    linux:
        name: Linux Tests
        if: ${{ inputs.run_linux == true }}
        needs: [ prepare, native-build ]
        uses: ./.github/workflows/shared-testing-linux.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
        secrets: inherit

    macos:
        name: macOS Tests
        if: ${{ inputs.run_macos == true }}
        needs: [ prepare, native-build ]
        uses: ./.github/workflows/shared-testing-macos.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
        secrets: inherit

    windows:
        name: Windows Tests
        if: ${{ inputs.run_windows == true }}
        needs: [ prepare, native-build ]
        uses: ./.github/workflows/shared-testing-windows.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
        secrets: inherit

    windows-playwright:
        name: Windows Playwright Tests
        if: ${{ inputs.run_windows_playwright == true }}
        needs: [ prepare, native-build ]
        uses: ./.github/workflows/shared-testing-windows-automation.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
        secrets: inherit

    windows-trim-aot:
        name: Validate Trim/AOT
        if: ${{ inputs.run_trim_aot == true }}
        needs: [ prepare, native-build ]
        uses: ./.github/workflows/shared-testing-windows-trim-aot.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            enable_test_exports: ${{ inputs.enable_test_exports }}
