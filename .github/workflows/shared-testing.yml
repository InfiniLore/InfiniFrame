name: "Shared: Platform Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                description: 'PR number to test. Leave empty to test the current trigger commit (github.sha).'
                type: string
                required: true
            checkout_ref:
                description: 'Explicit git ref to checkout in downstream test jobs.'
                type: string
                required: false
                default: ''
            run_windows:
                description: 'Run Windows GUI tests'
                type: boolean
                required: true
            run_windows_playwright:
                description: 'Run Windows Playwright tests'
                type: boolean
                required: true
            run_linux:
                description: 'Run Linux GUI tests'
                type: boolean
                required: true
            run_macos:
                description: 'Run macOS GUI tests'
                type: boolean
                required: true
            run_docs:
                description: 'Run docs validation'
                type: boolean
                required: true

jobs:
    prepare:
        name: Resolve Target SHA
        runs-on: ubuntu-latest
        outputs:
            sha: ${{ steps.resolve.outputs.sha }}

        steps:
            -   name: Resolve PR SHA
                id: resolve
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ -n "${{ inputs.pr_number }}" ]; then
                      SHA=$(curl -s \
                        -H "Authorization: Bearer $GITHUB_TOKEN" \
                        -H "Accept: application/vnd.github+json" \
                        https://api.github.com/repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} \
                        | jq -r .head.sha)
                    else
                      SHA="${{ github.sha }}"
                    fi

                    if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
                      echo "Failed to resolve a valid commit SHA. Check pr_number input."
                      exit 1
                    fi

                    echo "sha=$SHA" >> $GITHUB_OUTPUT
    
    # noinspection UndefinedAction, UndefinedParamsPresent
    docs-validation:
        name: Validate Docs
        if: ${{ inputs.run_docs == true }}
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-docs.yml
        with:
            checkout_ref: ${{ inputs.checkout_ref }}

    # noinspection UndefinedAction, UndefinedParamsPresent
    linux-gui:
        name: Linux GUI Tests
        if: ${{ inputs.run_linux == true }}
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-gui-linux.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    windows-gui:
        name: Windows GUI Tests
        if: ${{ inputs.run_windows == true }}
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-gui-windows.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    windows-playwright:
        name: Windows Playwright Tests
        if: ${{ inputs.run_windows_playwright == true }}
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-playwright-windows.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit

    # noinspection UndefinedAction, UndefinedParamsPresent
    macos-gui:
        name: macOS GUI Tests
        if: ${{ inputs.run_macos == true }}
        needs: [ prepare ]
        uses: ./.github/workflows/shared-testing-gui-macos.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.checkout_ref }}
            target_sha: ${{ needs.prepare.outputs.sha }}
            workflow_url: ${{ format('https://github.com/{0}/actions/runs/{1}', github.repository, github.run_id) }}
        secrets: inherit
