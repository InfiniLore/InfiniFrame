name: "Shared: Pack Tool E2E Windows"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                required: false
                default: ''
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true

jobs:
    pack-tool-e2e:
        name: Windows Pack Tool E2E (${{ matrix.arch }})
        runs-on: ${{ matrix.os }}
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        arch: x64
                        rid: win-x64
                    -   os: windows-11-arm
                        arch: arm64
                        rid: win-arm64
        permissions:
            contents: read
            statuses: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set Pack Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Pack Tool/Windows/${{ matrix.arch }}
                    state: pending
                    status-description: Pack tool end-to-end validation in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Cache NuGet
                uses: actions/cache@v5
                with:
                    path: ~\.nuget\packages
                    key: ${{ matrix.os }}-${{ matrix.arch }}-pack-e2e-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/Directory.Packages.props') }}
                    restore-keys: |
                        ${{ matrix.os }}-${{ matrix.arch }}-pack-e2e-nuget-

            -   name: Setup Native dependencies
                uses: ./.github/actions/setup-dependencies-native
                # noinspection UndefinedParamsPresent
                with:
                    apt-cache-version: 1.0
                    brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-pack-windows.yml') }}
                    brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-

            -   name: Restore
                run: |
                    dotnet restore src/InfiniFrame.Native/InfiniFrame.Native.proj /p:NoWarn=NU1503
                    dotnet restore src/InfiniFrame.Tools.Pack/InfiniFrame.Tools.Pack.csproj /p:NoWarn=NU1503
                    dotnet restore examples/InfiniFrameExample.SingleFileExe/InfiniFrameExample.SingleFileExe.csproj /p:NoWarn=NU1503

            -   name: Build Native Runtime (${{ matrix.rid }})
                run: |
                    dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj `
                      --configuration Release `
                      --no-restore `
                      -p:SolutionDir="${{ github.workspace }}/" `
                      -p:Platform=${{ matrix.arch }}

            -   name: Setup Pack Tool
                # noinspection UndefinedAction
                uses: ./.github/actions/packtool-setup

            -   name: Run Pack Tool
                # noinspection UndefinedAction
                uses: ./.github/actions/packtool-publish
                # noinspection UndefinedParamsPresent
                with:
                    project: examples/InfiniFrameExample.SingleFileExe/InfiniFrameExample.SingleFileExe.csproj
                    rid: ${{ matrix.rid }}
                    output: artifacts/pack-e2e/InfiniFrameExample.SingleFileExe

            -   name: Validate Packed Output
                # noinspection UndefinedAction
                uses: ./.github/actions/packtool-validate
                # noinspection UndefinedParamsPresent
                with:
                    output-dir: artifacts/pack-e2e/InfiniFrameExample.SingleFileExe
                    main-output-name: InfiniFrameExample.SingleFileExe.exe
                    forbidden-entries: |
                        wwwroot
                        InfiniFrame.Native.dll
                        WebView2Loader.dll
                        InfiniFrame.Native.so
                        InfiniFrame.Native.dylib

            -   name: Update Pack Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                # noinspection UndefinedAction
                uses: ./.github/actions/sync-check-finalize
                # noinspection UndefinedParamsPresent
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - Pack Tool/Windows/${{ matrix.arch }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: Pack tool end-to-end validation passed
                    failure-description: Pack tool end-to-end validation failed
