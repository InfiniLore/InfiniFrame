name: "CodeQL Advanced"

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [ "core" ]
    pull_request:
        branches: [ "core" ]
        types: [ ready_for_review, synchronize, reopened ]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/*.md'
    workflow_dispatch:
        inputs:
            full_scan:
                description: "Run full CodeQL scan (ignore path filters)"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

jobs:
    changes:
        name: Detect Changed Areas
        runs-on: ubuntu-latest
        if: >
            github.event_name != 'workflow_dispatch' ||
            github.event.inputs.full_scan != 'true'
        permissions:
            contents: read
        outputs:
            csharp: ${{ steps.filter.outputs.csharp }}
            cpp: ${{ steps.filter.outputs.cpp }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    fetch-depth: 0

            -   name: Detect Changes
                id: filter
                uses: dorny/paths-filter@v4
                with:
                    filters: |
                        csharp:
                          - '**'
                          - '!src/InfiniFrame.Native/**'
                        cpp:
                          - 'src/InfiniFrame.Native/**'

    analyze:
        name: Analyze (${{ matrix.language }} on ${{ matrix.os }})
        needs: changes
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90

        if: >
            (
                github.event_name != 'pull_request' 
                || github.event.pull_request.draft == false
            ) && (
                github.event_name == 'workflow_dispatch' && github.event.inputs.full_scan == 'true'
                || matrix.language == 'csharp' && needs.changes.outputs.csharp == 'true'
                || matrix.language == 'c-cpp' && needs.changes.outputs.cpp == 'true'
                || matrix.language != 'csharp' && matrix.language != 'c-cpp'
            )

        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
            pull-requests: write
            checks: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   language: actions
                        os: ubuntu-latest
                        build-mode: none
                    -   language: c-cpp
                        os: ubuntu-latest
                        build-mode: manual
                    -   language: c-cpp
                        os: windows-latest
                        build-mode: manual
                    -   language: csharp
                        os: ubuntu-latest
                        build-mode: none
                    -   language: javascript-typescript
                        os: ubuntu-latest
                        build-mode: none
                    -   language: python
                        os: ubuntu-latest
                        build-mode: none

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    fetch-depth: 1

            -   name: Setup .NET
                uses: actions/setup-dotnet@v5
                with:
                    dotnet-version: |
                        8.x
                        9.x
                        10.x

            -   name: Setup CMake
                if: matrix.language == 'c-cpp'
                uses: lukka/get-cmake@latest

            -   name: Setup Native dependencies
                if: matrix.language == 'c-cpp'
                uses: ./.github/actions/setup-dependencies-native
                # noinspection UndefinedParamsPresent
                with:
                    apt-cache-version: 1.0
                    brew-cache-key: ${{ runner.os }}-${{ matrix.language }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/codeql.yml') }}
                    brew-restore-key: ${{ runner.os }}-${{ matrix.language }}-brew-native-

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: ${{ matrix.language }}
                    build-mode: ${{ matrix.build-mode }}
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Restore C# (.slnx)
                if: matrix.language == 'csharp' && matrix.build-mode == 'manual'
                run: |
                    dotnet restore InfiniFrame.slnx /p:NoWarn=NU1503

            -   name: Build Native (CodeQL)
                if: matrix.language == 'c-cpp'
                shell: pwsh
                run: |
                    dotnet build src/InfiniFrame.Native/InfiniFrame.Native.proj --configuration Release --no-restore -p:SolutionDir="${{ github.workspace }}/" -p:Platform=x64

            -   name: Build C# (.slnx)
                if: matrix.language == 'csharp' && matrix.build-mode == 'manual'
                run: |
                    dotnet build InfiniFrame.slnx --no-restore --configuration Release -p:InfiniFramePackAfterBuild=false

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: "/language:${{ matrix.language }}"