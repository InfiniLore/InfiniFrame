#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CodeQL Advanced"

concurrency:
    group: codeql-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: [ "core" ]
    
    pull_request:
        branches: [ "core" ]
        types: [ opened, synchronize, reopened, ready_for_review ]
        paths-ignore:
            - '**/*.md'
            - 'docs/**'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/*.md'
    
    workflow_dispatch:
        inputs:
            full_scan:
                description: "Run full CodeQL scan (ignore path filters)"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

jobs:
    changes:
        name: Detect Changed Areas
        runs-on: ubuntu-latest
        
        permissions:
            contents: read
        
        outputs:
            actions: ${{ steps.filter.outputs.actions }}
            csharp: ${{ steps.filter.outputs.csharp }}
            cpp: ${{ steps.filter.outputs.cpp }}
            javascript_typescript: ${{ steps.filter.outputs.javascript_typescript }}
            python: ${{ steps.filter.outputs.python }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0

            -   name: Detect Changes
                id: filter
                uses: dorny/paths-filter@v4
                with:
                    filters: |
                        actions:
                          - '.github/workflows/**'
                          - '.github/actions/**'
                          - '.github/dependabot.yml'
                          - '.github/codeql-config.yml'
                        
                        csharp:
                          - 'src/**/*.cs'
                          - 'src/**/*.csproj'
                          - 'src/**/*.props'
                          - 'src/**/*.targets'
                          - 'src/**/*.razor'
                          - 'src/**/*.razor.css'
                          - 'Directory.Packages.props'
                          - 'global.json'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
                        
                        cpp:
                          - 'src/InfiniFrame.NativeBridge/Native/**'
                          - 'native-vendor-deps.json'
                          - 'global.json'
                          - '.github/actions/setup-dependencies-native/**'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
                        
                        javascript_typescript:
                          - 'src/**/*.js'
                          - 'src/**/*.jsx'
                          - 'src/**/*.ts'
                          - 'src/**/*.tsx'
                          - 'src/**/*.mjs'
                          - 'src/**/*.cjs'
                          - 'src/**/*.vue'
                          - 'src/**/*.html'
                          - 'src/**/package.json'
                          - 'src/**/package-lock.json'
                          - 'src/**/tsconfig*.json'
                          - 'src/**/vite.config.*'
                          - 'src/**/webpack.config.*'
                          - 'src/**/eslint.config.*'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
                        
                        python:
                          - '.github/scripts/**/*.py'
                          - '.github/scripts/**/*.pyi'
                          - '.github/scripts/**/pyproject.toml'
                          - '.github/scripts/**/requirements*.txt'
                          - '.github/scripts/**/Pipfile'
                          - '.github/scripts/**/Pipfile.lock'
                          - '.github/scripts/**/tox.ini'
                          - '.github/scripts/**/setup.cfg'
                          - 'scripts/**/*.py'
                          - 'scripts/**/*.pyi'
                          - 'scripts/**/pyproject.toml'
                          - 'scripts/**/requirements*.txt'
                          - 'scripts/**/Pipfile'
                          - 'scripts/**/Pipfile.lock'
                          - 'scripts/**/tox.ini'
                          - 'scripts/**/setup.cfg'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
    
    analyze-actions:
        name: Analyze Actions
        needs: changes
        runs-on: ubuntu-latest
        timeout-minutes: 30
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.actions == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
            pull-requests: write
            checks: write
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: actions
                    build-mode: none
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: "/language:actions"
    
    analyze-csharp:
        name: Analyze C#
        needs: changes
        runs-on: ubuntu-latest
        timeout-minutes: 60
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.csharp == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
            pull-requests: write
            checks: write
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false
            
            -   name: Setup Native Dependencies
                uses: ./.github/actions/setup-dependencies-native
                with:
                    brew-cache-key: ${{ runner.os }}-brew-codeql-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-macos.yml') }}
                    brew-restore-key: ${{ runner.os }}-brew-codeql-
                    restore-nativebridge-packages: 'true'

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: csharp
                    build-mode: manual
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml
                    
            -   name: Restore Dotnet
                run: |
                    dotnet restore

            -   name: Build Dotnet
                shell: pwsh
                run: |
                    dotnet build InfiniFrame.GitHubActions.Release.slnf  `
                      --configuration Release `
                      --no-restore `
                      /p:SolutionDir=$env:GITHUB_WORKSPACE/ 

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: "/language:csharp"
    
    analyze-cpp:
        name: Analyze C/C++ (${{ matrix.os }} / ${{ matrix.arch }})
        needs: changes
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90

        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.cpp == 'true'
            )

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-latest
                        arch: x64

                    -   os: windows-latest
                        arch: x64

                    -   os: macos-latest
                        arch: arm64

        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
            pull-requests: write
            checks: write

        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false

            -   name: Setup Native Dependencies
                uses: ./.github/actions/setup-dependencies-native
                with:
                    brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-codeql-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/ci-codeql.yml') }}
                    brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-codeql-
                    restore-nativebridge-packages: 'true'

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: c-cpp
                    build-mode: manual
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Restore NativeBridge
                run: |
                    dotnet restore src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj /p:NoWarn=NU1503

            -   name: Build NativeBridge
                timeout-minutes: 45
                run: |
                    dotnet build src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj --configuration Release --no-restore /p:SolutionDir=${{ github.workspace }}/ /p:NativeArch=${{ matrix.arch }}

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: "/language:c-cpp/${{ matrix.os }}-${{ matrix.arch }}"
    
    analyze-javascript-typescript:
        name: Analyze JavaScript / TypeScript
        needs: changes
        runs-on: ubuntu-latest
        timeout-minutes: 45
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.javascript_typescript == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
            pull-requests: write
            checks: write
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: javascript-typescript
                    build-mode: none
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: "/language:javascript-typescript"
    
    analyze-python:
        name: Analyze Python
        needs: changes
        runs-on: ubuntu-latest
        timeout-minutes: 45
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.python == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
            pull-requests: write
            checks: write
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: python
                    build-mode: none
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: "/language:python"
