#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: codeql"

concurrency:
    group: ${{ github.event_name == 'pull_request' && format('codeql-pr-{0}', github.event.pull_request.number) || format('codeql-{0}', github.ref) }}
    cancel-in-progress: true

on:
    push:
        branches: [ "core" ]
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
    
    workflow_dispatch:
        inputs:
            full_scan:
                description: "Run full CodeQL scan (ignore path filters)"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

# The .NET 11 SDK enables the MSBuild Server by default for `dotnet build`/`dotnet restore`.
# The server executes builds inside a long-lived daemon process, so a build started by an
# earlier step (the restore steps run before "Initialize CodeQL") no longer runs in the
# process tree of the current build command. The CodeQL build tracer only observes
# compiler invocations in that tree, so the C/C++ database ends up empty and
# `codeql database finalize` fails with "this run didn't build any of it".
# Disabling the server keeps every build in the process tree of the step that runs it.
env:
    DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: 1

jobs:
    changes:
        name: Detect Changed Areas
        runs-on: ubuntu-26.04
        
        permissions:
            contents: read
        
        outputs:
            actions: ${{ steps.filter.outputs.actions }}
            csharp: ${{ steps.filter.outputs.csharp }}
            cpp: ${{ steps.filter.outputs.cpp }}
            javascript_typescript: ${{ steps.filter.outputs.javascript_typescript }}
            python: ${{ steps.filter.outputs.python }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
                with:
                    fetch-depth: 0

            -   name: Detect Changes
                id: filter
                uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
                with:
                    filters: |
                        actions:
                          - '.github/workflows/**'
                          - '.github/actions/**'
                          - '.github/dependabot.yml'
                          - '.github/codeql-config.yml'
                        
                        csharp:
                          - 'src/**/*.cs'
                          - 'src/**/*.csproj'
                          - 'src/**/*.props'
                          - 'src/**/*.targets'
                          - 'src/**/*.razor'
                          - 'src/**/*.razor.css'
                          - 'Directory.Packages.props'
                          - 'global.json'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
                        
                        cpp:
                          - 'src/InfiniFrame.NativeBridge/Native/**'
                          - 'native-vendor-deps.json'
                          - 'global.json'
                          - '.github/actions/setup-dependencies/**'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
                        
                        javascript_typescript:
                          - 'src/**/*.js'
                          - 'src/**/*.jsx'
                          - 'src/**/*.ts'
                          - 'src/**/*.tsx'
                          - 'src/**/*.mjs'
                          - 'src/**/*.cjs'
                          - 'src/**/*.vue'
                          - 'src/**/*.html'
                          - 'src/**/package.json'
                          - 'src/**/package-lock.json'
                          - 'src/**/tsconfig*.json'
                          - 'src/**/vite.config.*'
                          - 'src/**/webpack.config.*'
                          - 'src/**/eslint.config.*'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
                        
                        python:
                          - 'scripts/**/*.py'
                          - 'scripts/**/*.pyi'
                          - 'scripts/**/pyproject.toml'
                          - 'scripts/**/requirements*.txt'
                          - 'scripts/**/Pipfile'
                          - 'scripts/**/Pipfile.lock'
                          - 'scripts/**/tox.ini'
                          - 'scripts/**/setup.cfg'
                          - '.github/workflows/ci-codeql.yml'
                          - '.github/codeql-config.yml'
    
    analyze-actions:
        name: Analyze Actions
        needs: changes
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.actions == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
        
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    languages: actions
                    build-mode: none
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    category: "/language:actions"
    
    analyze-csharp:
        name: Analyze C#
        needs: changes
        runs-on: ubuntu-26.04
        container:
            image: ghcr.io/infinilore/infiniframe-ci:x64-${{ vars.LINUX_CI_IMAGE_VERSION }}@${{ vars.LINUX_CI_IMAGE_DIGEST_X64 }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 60
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.csharp == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
        
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    languages: csharp
                    build-mode: manual
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Restore Dotnet
                run: |
                    dotnet restore

            -   name: Build Dotnet
                shell: pwsh
                run: |
                    dotnet build InfiniFrame.GitHubActions.Release.slnf  `
                      --configuration Release `
                      --no-restore `
                      /p:SolutionDir=$env:GITHUB_WORKSPACE/ 

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    category: "/language:csharp"
    
    analyze-cpp:
        name: Analyze C/C++ (${{ matrix.os }} / ${{ matrix.arch }})
        needs: changes
        runs-on: ${{ matrix.os }}
        timeout-minutes: 90
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.cpp == 'true'
            )

        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: windows-latest
                        arch: x64

                    -   os: macos-latest
                        arch: arm64

        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false
                    brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-codeql-${{ hashFiles('.github/actions/setup-dependencies/action.yml', '.github/workflows/ci-codeql.yml') }}
                    brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-codeql-
                    restore-nativebridge-packages: 'true'

            -   name: Restore NativeBridge
                timeout-minutes: 10
                run: |
                    dotnet restore src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj --verbosity normal /p:WarningsAsErrors=NU1503 /p:NativeArch=${{ matrix.arch }}

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    languages: c-cpp
                    build-mode: manual
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Build NativeBridge
                timeout-minutes: 45
                run: |
                    dotnet build src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj --configuration Release --no-restore /p:SolutionDir=${{ github.workspace }}/ /p:NativeArch=${{ matrix.arch }} /p:InfiniFrameNativeCompilerCache=OFF

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    category: "/language:c-cpp/${{ matrix.os }}-${{ matrix.arch }}"

    analyze-cpp-linux:
        name: Analyze C/C++ (linux / ${{ matrix.arch }})
        needs: changes
        runs-on: ${{ matrix.os }}
        container:
            image: ghcr.io/infinilore/infiniframe-ci:${{ matrix.arch }}-${{ vars.LINUX_CI_IMAGE_VERSION }}@${{ matrix.arch == 'x64' && vars.LINUX_CI_IMAGE_DIGEST_X64 || vars.LINUX_CI_IMAGE_DIGEST_ARM64 }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 90
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.cpp == 'true'
            )
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   os: ubuntu-26.04
                        arch: x64
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            -   name: Restore NativeBridge
                timeout-minutes: 10
                run: dotnet restore src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj --verbosity normal /p:WarningsAsErrors=NU1503 /p:NativeArch=${{ matrix.arch }}
            -   name: Initialize CodeQL
                uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    languages: c-cpp
                    build-mode: manual
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml
            -   name: Build NativeBridge
                timeout-minutes: 45
                run: dotnet build src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj --configuration Release --no-restore /p:SolutionDir=${{ github.workspace }}/ /p:NativeArch=${{ matrix.arch }}
            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    category: "/language:c-cpp/linux-${{ matrix.arch }}"
    
    analyze-javascript-typescript:
        name: Analyze JavaScript / TypeScript
        needs: changes
        runs-on: ubuntu-26.04
        timeout-minutes: 45
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.javascript_typescript == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
        
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    languages: javascript-typescript
                    build-mode: none
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    category: "/language:javascript-typescript"
    
    analyze-python:
        name: Analyze Python
        needs: changes
        runs-on: ubuntu-26.04
        timeout-minutes: 45
        
        if: >
            (
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.full_scan == 'true'
            ) || (
              needs.changes.outputs.python == 'true'
            )
        
        permissions:
            contents: read
            security-events: write
            actions: read
            packages: read
        
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            -   name: Initialize CodeQL
                uses: github/codeql-action/init@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    languages: python
                    build-mode: none
                    queries: security-extended,security-and-quality
                    config-file: ./.github/codeql-config.yml

            -   name: Perform CodeQL Analysis
                uses: github/codeql-action/analyze@bf58c2ac1f8060aa73f1225f461c80391348076 # v4
                with:
                    category: "/language:python"

    codeql-result:
        name: CodeQL
        if: always()
        needs:
            - changes
            - analyze-actions
            - analyze-csharp
            - analyze-cpp
            - analyze-cpp-linux
            - analyze-javascript-typescript
            - analyze-python
        runs-on: ubuntu-26.04
        permissions:
            contents: read
        steps:
            -   name: Evaluate CodeQL results
                env:
                    CHANGES_RESULT: ${{ needs.changes.result }}
                    ACTIONS_RESULT: ${{ needs.analyze-actions.result }}
                    CSHARP_RESULT: ${{ needs.analyze-csharp.result }}
                    CPP_RESULT: ${{ needs.analyze-cpp.result }}
                    CPP_LINUX_RESULT: ${{ needs.analyze-cpp-linux.result }}
                    JAVASCRIPT_RESULT: ${{ needs.analyze-javascript-typescript.result }}
                    PYTHON_RESULT: ${{ needs.analyze-python.result }}
                shell: bash
                run: |
                    set -euo pipefail

                    for result in \
                        "$CHANGES_RESULT" \
                        "$ACTIONS_RESULT" \
                        "$CSHARP_RESULT" \
                        "$CPP_RESULT" \
                        "$CPP_LINUX_RESULT" \
                        "$JAVASCRIPT_RESULT" \
                        "$PYTHON_RESULT"; do
                        if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
                            echo "CodeQL analysis failed with result: $result"
                            exit 1
                        fi
                    done

                    echo "CodeQL analysis passed or was intentionally skipped."
