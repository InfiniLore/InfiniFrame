#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: singlefile"
on:
    workflow_call:
        inputs:
            pr_number: { type: string, required: true }
            checkout_ref: { type: string, required: false, default: '' }
            target_sha: { type: string, required: true }
            workflow_url: { type: string, required: true }

permissions:
    contents: read
    statuses: write
    checks: write

jobs:
    singlefile-linux:
        name: "CI: ${{ matrix.rid }}/singlefile"
        runs-on: ${{ matrix.os }}
        container:
            image: ghcr.io/infinilore/infiniframe-ci:${{ matrix.arch }}-${{ vars.LINUX_CI_IMAGE_VERSION }}@${{ matrix.arch == 'x64' && vars.LINUX_CI_IMAGE_DIGEST_X64 || vars.LINUX_CI_IMAGE_DIGEST_ARM64 }}
            credentials:
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
        permissions:
            contents: read
            packages: read
            statuses: write
            checks: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-26.04
                      arch: x64
                      rid: linux-x64
                    - os: ubuntu-26.04-arm
                      arch: arm64
                      rid: linux-arm64
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                  fetch-depth: 1
            - uses: ./.github/actions/run-singlefile-e2e
              with:
                  arch: ${{ matrix.arch }}
                  rid: ${{ matrix.rid }}
                  target-sha: ${{ inputs.target_sha }}
                  workflow-url: ${{ inputs.workflow_url }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}

    singlefile-other:
        name: "CI: ${{ matrix.rid }}/singlefile"
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-15-intel
                      arch: x64
                      rid: osx-x64
                    - os: macos-latest
                      arch: arm64
                      rid: osx-arm64
                    - os: windows-latest
                      arch: x64
                      rid: win-x64
                      main-output-name: InfiniFrameExample.SingleFileExe.exe
                    - os: windows-11-arm
                      arch: arm64
                      rid: win-arm64
                      main-output-name: InfiniFrameExample.SingleFileExe.exe
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                  fetch-depth: 1
            - name: Setup dependencies
              uses: ./.github/actions/setup-dependencies
              with:
                  cache-dotnet: false
                  brew-cache-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-${{ hashFiles('.github/actions/setup-dependencies/action.yml', '.github/workflows/shared-testing-singlefile-e2e.yml') }}
                  brew-restore-key: ${{ matrix.os }}-${{ matrix.arch }}-brew-native-
            - uses: ./.github/actions/run-singlefile-e2e
              with:
                  arch: ${{ matrix.arch }}
                  rid: ${{ matrix.rid }}
                  main-output-name: ${{ matrix.main-output-name || 'InfiniFrameExample.SingleFileExe' }}
                  target-sha: ${{ inputs.target_sha }}
                  workflow-url: ${{ inputs.workflow_url }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
