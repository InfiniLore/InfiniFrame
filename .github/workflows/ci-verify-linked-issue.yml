#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: Verify Linked Issue"

# The check runs on `pull_request_target` so that the workflow definition always comes from the
# base branch: a pull request cannot remove or weaken the check it has to pass.
# This privileged event is intentional: the action needs pull-request write permission to report
# the result. The workflow neither checks out nor executes pull-request code, so the writable token
# remains safe for forks. Keep the repository Actions policy explicitly allowlisted for this event;
# GitHub's public-repository default policy is scheduled to block it on 2026-12-02.
on:
    pull_request_target:

permissions:
    contents: read
    pull-requests: write

jobs:
    verify-linked-issue:
        name: "CI: verify-linked-issue"
        runs-on: ubuntu-26.04
        env:
            # Authors that are exempt from the linked issue requirement.
            LINKED_ISSUE_EXEMPT_AUTHORS: 'dependabot[bot],github-actions[bot]'
            # Labels that mark a pull request as exempt from the linked issue requirement. Both
            # dependabot and the native vendor dependency workflow apply the `dependencies`
            # label, while hand written pull requests carry no label. Applying a label requires
            # triage permission, so an outside contributor cannot use it to skip the check.
            LINKED_ISSUE_EXEMPT_LABELS: 'dependencies'
            # The pull request author is used instead of the actor that triggered the workflow
            # run, so that a maintainer pushing a fix to a bot branch keeps the exemption.
            PR_AUTHOR: ${{ github.event.pull_request.user.login }}
            PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        steps:
            -   name: Resolve the linked issue exemption
                id: exemption
                shell: bash
                run: |
                    set -euo pipefail

                    contains_ci() {
                        local needle="$1"
                        shift
                        local value
                        for value in "$@"; do
                            value="${value//[[:space:]]/}"
                            if [ -n "$value" ] && [ "${value,,}" = "${needle,,}" ]; then
                                return 0
                            fi
                        done
                        return 1
                    }

                    IFS=',' read -r -a authors <<< "$LINKED_ISSUE_EXEMPT_AUTHORS"
                    IFS=',' read -r -a pr_labels <<< "$PR_LABELS"
                    IFS=',' read -r -a exempt_labels <<< "$LINKED_ISSUE_EXEMPT_LABELS"

                    exempt=false
                    reason=""

                    if contains_ci "$PR_AUTHOR" "${authors[@]}"; then
                        exempt=true
                        reason="the author '$PR_AUTHOR' is exempt"
                    else
                        for pr_label in "${pr_labels[@]}"; do
                            if contains_ci "$pr_label" "${exempt_labels[@]}"; then
                                exempt=true
                                reason="the label '$pr_label' is exempt"
                                break
                            fi
                        done
                    fi

                    echo "exempt=$exempt" >> "$GITHUB_OUTPUT"
                    echo "reason=$reason" >> "$GITHUB_OUTPUT"

            -   name: Verify linked issue
                if: steps.exemption.outputs.exempt != 'true'
                # Immutable pin for the v1 release currently used by this workflow.
                uses: Code-Of-Chaos/action-verify-linked-issue@dbc22bb5b922bcf798bcab78ea3ab17c00730542
                with:
                    token: ${{ secrets.GITHUB_TOKEN }}

            -   name: Skip the linked issue check
                if: steps.exemption.outputs.exempt == 'true'
                env:
                    EXEMPTION_REASON: ${{ steps.exemption.outputs.reason }}
                shell: bash
                run: echo "The linked issue check is skipped because ${EXEMPTION_REASON}."
