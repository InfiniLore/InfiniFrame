#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: actionlint"

on:
    pull_request:
    push:
        branches:
            - core

permissions:
    contents: read

jobs:
    actionlint:
        name: "CI: actionlint"
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Run actionlint
              uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
              with:
                  version: 1.7.12
                  files: ".github/workflows/*.yml"
                  fail-on-error: true
