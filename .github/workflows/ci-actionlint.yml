#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: actionlint"

on:
    pull_request:
    push:
        branches:
            - core

permissions:
    contents: read

jobs:
    actionlint:
        name: "CI: actionlint"
        runs-on: ubuntu-26.04
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Run actionlint
              uses: raven-actions/actionlint@v2
              with:
                  version: 1.7.12
                  files: ".github/workflows/*.yml"
                  fail-on-error: true
