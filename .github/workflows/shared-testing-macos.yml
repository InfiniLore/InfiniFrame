#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "Shared: macOS Tests"
on:
    workflow_call:
        inputs:
            pr_number:
                type: string
                required: true
            checkout_ref:
                type: string
                default: ''
                required: false
            target_sha:
                type: string
                required: true
            workflow_url:
                type: string
                required: true
            enable_test_exports:
                type: boolean
                required: false
                default: false

jobs:
    build-x64:
        name: Build macOS x64
        runs-on: macos-15-intel
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false

            -   name: Setup native dependencies
                uses: ./.github/actions/setup-dependencies-native
                with:
                    brew-cache-key: macos-15-intel-x64-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-macos.yml') }}
                    brew-restore-key: macos-15-intel-x64-brew-native-

            -   name: Download Testing Native Build Artifacts
                uses: ./.github/actions/download-native-binaries
                with:
                    artifact-type: testing

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503 /p:NativeArch=x64

            -   name: Build Release
                run: |
                    dotnet build InfiniFrame.GitHubActions.Testing.slnf \
                      --configuration Release \
                      --no-restore \
                      -p:SolutionDir=${{ github.workspace }}/ \
                      -p:NativeArch=x64 \
                      -p:InfiniFrameSkipNativeBuild=true \
                      -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }}

            -   name: Upload x64 Build Outputs
                uses: actions/upload-artifact@v7
                with:
                    name: build-x64
                    path: |
                        **/bin/**
                        **/obj/**
                        src/InfiniFrame.NativeBridge/artifacts/native/**
                    if-no-files-found: error
                    retention-days: 1

    build-arm64:
        name: Build macOS arm64
        runs-on: macos-latest
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false

            -   name: Setup native dependencies
                uses: ./.github/actions/setup-dependencies-native
                with:
                    brew-cache-key: macos-latest-arm64-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-macos.yml') }}
                    brew-restore-key: macos-latest-arm64-brew-native-

            -   name: Download Testing Native Build Artifacts
                uses: ./.github/actions/download-native-binaries
                with:
                    artifact-type: testing

            -   name: Restore
                run: dotnet restore InfiniFrame.GitHubActions.Testing.slnf /p:NoWarn=NU1503 /p:NativeArch=arm64

            -   name: Build Release
                run: |
                    dotnet build InfiniFrame.GitHubActions.Testing.slnf \
                      --configuration Release \
                      --no-restore \
                      -p:SolutionDir=${{ github.workspace }}/ \
                      -p:NativeArch=arm64 \
                      -p:InfiniFrameSkipNativeBuild=true \
                      -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }}

            -   name: Upload arm64 Build Outputs
                uses: actions/upload-artifact@v7
                with:
                    name: build-arm64
                    path: |
                        **/bin/**
                        **/obj/**
                        src/InfiniFrame.NativeBridge/artifacts/native/**
                    if-no-files-found: error
                    retention-days: 1

    test-x64:
        name: CI Testing - macOS/x64/${{ matrix.framework }}
        needs: build-x64
        if: always()
        runs-on: macos-15-intel
        timeout-minutes: 120
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
            OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
            NSUnbufferedIO: YES
        strategy:
            fail-fast: false
            matrix:
                framework: [net8.0, net9.0, net10.0]
        permissions:
            contents: read
            statuses: write
            checks: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
                    fetch-depth: 1

            -   name: Set macOS Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - macOS/x64/${{ matrix.framework }}
                    state: pending
                    status-description: macOS x64 ${{ matrix.framework }} tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
                with:
                    cache-dotnet: false

            -   name: Setup native dependencies
                uses: ./.github/actions/setup-dependencies-native
                with:
                    brew-cache-key: macos-15-intel-x64-brew-native-${{ hashFiles('.github/actions/setup-dependencies-native/action.yml', '.github/workflows/shared-testing-macos.yml') }}
                    brew-restore-key: macos-15-intel-x64-brew-native-

            -   name: Download x64 Build Outputs
                uses: actions/download-artifact@v8
                with:
                    name: build-x64
                    path: .

            -   name: Export Actions Runtime
                uses: actions/github-script@v9
                with:
                    script: |
                        core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
                        core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

            -   name: Run ${{ matrix.framework }} Tests
                id: tests
                shell: bash
                run: |
                    echo "Setting up macOS test environment..."

                    echo "=== Environment Status ==="
                    echo "System: $(sw_vers -productName) $(sw_vers -productVersion)"
                    echo "Architecture: $(uname -m)"
                    echo "Running in native macOS mode"

                    echo "=== Running Tests ==="
                    echo "=== Testing ${{ matrix.framework }} ==="
                    echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Starting ${{ matrix.framework }}"

                    mkdir -p "artifacts/testdiag/${{ matrix.framework }}"
                    mkdir -p "artifacts/testresults/${{ matrix.framework }}"
                    test_exit_code=0

                    dotnet test --solution InfiniFrame.GitHubActions.Testing.slnf \
                      --configuration Release \
                      --no-build \
                      --no-restore \
                      --framework "${{ matrix.framework }}" \
                      -p:NativeArch=x64 \
                      -p:InfiniFrameSkipNativeBuild=true \
                      -p:InfiniFrameEnableTestExports=${{ inputs.enable_test_exports }} \
                      --results-directory "artifacts/testresults/${{ matrix.framework }}" \
                      --report-trx \
                      --diagnostic \
                      --diagnostic-output-directory "artifacts/testdiag/${{ matrix.framework }}" \
                      --diagnostic-file-prefix "mtp-${{ matrix.framework }}" \
                      --diagnostic-verbosity Information \
                      --output Detailed \
                      --github-reporter-style full \
                      --no-ansi || test_exit_code=$?

                    echo "[$(date -u '+%Y-%m-%dT%H:%M:%SZ')] Finished ${{ matrix.framework }} with exit code $test_exit_code"

                    if [ "$test_exit_code" -ne 0 ]; then
                        echo "=== Test diagnostics for ${{ matrix.framework }} ==="
                        find "artifacts/testdiag/${{ matrix.framework }}" -type f -name '*.diag' -print -exec cat {} \; || true
                    fi

                    exit "$test_exit_code"

            -   name: Print TRX Summary
                if: always()
                shell: bash
                env:
                    FRAMEWORK: ${{ matrix.framework }}
                run: |
                    python3 - <<'PY'
                    import datetime
                    import os
                    import pathlib
                    import xml.etree.ElementTree as ET

                    root = pathlib.Path("artifacts/testresults") / os.environ["FRAMEWORK"]
                    files = sorted(root.rglob("*.trx"))
                    passed = failed = skipped = total = 0
                    starts = []
                    finishes = []
                    fallback_duration = datetime.timedelta()

                    def timestamp(value):
                        return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))

                    for trx in files:
                        document = ET.parse(trx).getroot()
                        summary = document.find(".//{*}ResultSummary")
                        counters = summary.find("./{*}Counters") if summary is not None else None
                        if counters is not None:
                            passed += int(counters.get("passed", 0))
                            failed += sum(int(counters.get(key, 0)) for key in (
                                "failed", "error", "timeout", "aborted", "inconclusive",
                                "passedButRunAborted", "disconnected"))
                            skipped += int(counters.get("notExecuted", 0))
                            total += int(counters.get("total", 0))

                        times = document.find(".//{*}Times")
                        if times is not None and times.get("start") and times.get("finish"):
                            starts.append(timestamp(times.get("start")))
                            finishes.append(timestamp(times.get("finish")))
                        elif times is not None and times.get("duration"):
                            hours, minutes, seconds = times.get("duration").split(":")
                            fallback_duration += datetime.timedelta(
                                hours=int(hours), minutes=int(minutes), seconds=float(seconds))

                    duration = max(finishes) - min(starts) if starts and finishes else fallback_duration
                    seconds = int(duration.total_seconds())
                    formatted_duration = f"{seconds // 3600:02d}:{seconds % 3600 // 60:02d}:{seconds % 60:02d}"
                    print("============================")
                    print(f"Framework: {os.environ['FRAMEWORK']}\n")
                    print(f"Passed : {passed}")
                    print(f"Failed : {failed}")
                    print(f"Skipped: {skipped}")
                    print(f"Total  : {total}\n")
                    print(f"Duration: {formatted_duration}")
                    print("============================")
                    if not files:
                        raise SystemExit(f"No TRX files found beneath {root}")
                    PY

            -   name: Upload Test Diagnostics and Results
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: macos-test-x64-${{ matrix.framework }}
                    path: |
                        artifacts/testdiag/${{ matrix.framework }}/**
                        artifacts/testresults/${{ matrix.framework }}/**
                    if-no-files-found: warn
                    retention-days: 7

            -   name: Update macOS Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check-finalize
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - macOS/x64/${{ matrix.framework }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: macOS x64 ${{ matrix.framework }} tests passed
                    failure-description: macOS x64 ${{ matrix.framework }} tests failed

    test-arm64:
        name: CI Testing - macOS/arm64/${{ matrix.framework }}
        needs: build-arm64
        if: always()
        runs-on: macos-latest
        timeout-minutes: 120
        env:
            TARGET_SHA: ${{ inputs.target_sha }}
            WORKFLOW_URL: ${{ inputs.workflow_url }}
            OBJC_DISABLE_INITIALIZE_FORK_SAFETY: YES
            NSUnbufferedIO: YES
        strategy:
            fail-fast: false
            matrix:
                framework: [net8.0, net9.0, net10.0]
        permissions:
            contents: read
            statuses: write
            checks: write
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
