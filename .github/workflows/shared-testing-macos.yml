                    fetch-depth: 1

            -   name: Set macOS Check Pending
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - macOS/arm64/${{ matrix.framework }}
                    state: pending
                    status-description: macOS arm64 ${{ matrix.framework }} tests in progress
                    target-url: ${{ inputs.workflow_url }}
                    allow-status-422: 'true'

            -   name: Setup dependencies
                uses: ./.github/actions/setup-dependencies
