                    name: macos-test-arm64-${{ matrix.framework }}
                    path: |
                        artifacts/testdiag/${{ matrix.framework }}/**
                        artifacts/testresults/${{ matrix.framework }}/**
                    if-no-files-found: warn
                    retention-days: 7

            -   name: Update macOS Check
                if: always()
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                uses: ./.github/actions/sync-check-finalize
                with:
                    repo: ${{ github.repository }}
                    sha: ${{ inputs.target_sha }}
                    context: CI Testing - macOS/arm64/${{ matrix.framework }}
                    target-url: ${{ inputs.workflow_url }}
                    job-status: ${{ job.status }}
                    success-description: macOS arm64 ${{ matrix.framework }} tests passed
                    failure-description: macOS arm64 ${{ matrix.framework }} tests failed

    pack-tool-e2e-x64:
        name: Pack Tool E2E - macOS/x64
        needs: test-x64
        runs-on: macos-15-intel
        timeout-minutes: 120
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || (inputs.pr_number != '' && inputs.pr_number != null && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref) }}
