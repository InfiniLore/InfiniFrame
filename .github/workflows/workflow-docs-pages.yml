name: "Workflow: Docs to GitHub Pages"

on:
  push:
    branches:
      - core
    paths:
      - "docs/**"
      - "src/**"
      - ".github/workflows/workflow-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build DocFX Site
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Install DocFX
        shell: pwsh
        run: |
          dotnet tool install --global docfx --version 2.78.5
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Doxygen
        shell: pwsh
        run: choco install doxygen.install -y --no-progress

      - name: Generate API Metadata
        run: docfx metadata docs/docfx.json

      - name: Generate C++ API Markdown
        shell: pwsh
        run: ./docs/scripts/update-cpp-api.ps1 -Required

      - name: Build Docs Site
        run: docfx build docs/docfx.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
