name: "CI: Full Test Suite"

permissions:
    contents: read
    statuses: write
    checks: write

on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'PR number to test. Leave empty to test the current branch commit.'
                required: false
                type: string
            run_windows:
                description: 'Run Windows GUI tests'
                type: boolean
                default: true
            run_windows_playwright:
                description: 'Run Windows Playwright tests'
                type: boolean
                default: true
            run_linux:
                description: 'Run Linux GUI tests'
                type: boolean
                default: true
            run_macos:
                description: 'Run macOS GUI tests'
                type: boolean
                default: true
            run_macos_playwright:
                description: 'Run macOS Playwright tests'
                type: boolean
                default: true
            run_docs:
                description: 'Run docs validation'
                type: boolean
                default: true
            run_pack:
                description: 'Run pack tool end-to-end validation'
                type: boolean
                default: true
            run_trim_aot:
                description: 'Run trim and NativeAOT compatibility validation'
                type: boolean
                default: true

jobs:
    # noinspection UndefinedAction
    python-tests:
        name: Python Tests
        uses: ./.github/workflows/shared-testing-python.yml

    # noinspection UndefinedAction, UndefinedParamsPresent
    run:
        name: Platform Tests
        needs: python-tests
        uses: ./.github/workflows/shared-testing.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            run_windows: ${{ inputs.run_windows }}
            run_windows_playwright: ${{ inputs.run_windows_playwright }}
            run_linux: ${{ inputs.run_linux }}
            run_macos: ${{ inputs.run_macos }}
            run_macos_playwright: ${{ inputs.run_macos_playwright }}
            run_docs: ${{ inputs.run_docs }}
            run_pack: ${{ inputs.run_pack }}
            run_trim_aot: ${{ inputs.run_trim_aot }}
        secrets: inherit
