#file: noinspection UndefinedAction,UndefinedParamsPresent
name: "CI: Core Full Test Suite (Manual)"

permissions:
    contents: read
    packages: read

on:
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'PR number to test. Leave empty to test the current branch commit.'
                required: false
                type: string
            enable_coverage:
                description: 'Enable code coverage'
                type: boolean
                default: true
            run_windows:
                description: 'Run Windows GUI tests'
                type: boolean
                default: true
            run_windows_playwright:
                description: 'Run Windows Playwright tests'
                type: boolean
                default: true
            run_linux:
                description: 'Run Linux GUI tests'
                type: boolean
                default: true
            run_macos:
                description: 'Run macOS GUI tests'
                type: boolean
                default: true
            run_docs:
                description: 'Run docs validation'
                type: boolean
                default: true
            run_trim_aot:
                description: 'Run trim and NativeAOT compatibility validation'
                type: boolean
                default: true

concurrency:
    group: ${{ format('core-manual-{0}', github.run_id) }}
    cancel-in-progress: false

jobs:
    run:
        name: "CI: tests"
        uses: ./.github/workflows/shared-testing.yml
        with:
            pr_number: ${{ inputs.pr_number }}
            checkout_ref: ${{ inputs.pr_number != '' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}

            run_windows: ${{ inputs.run_windows == true }}
            run_windows_playwright: ${{ inputs.run_windows_playwright == true }}
            run_linux: ${{ inputs.run_linux == true }}
            run_macos: ${{ inputs.run_macos == true }}
            run_docs: ${{ inputs.run_docs == true }}
            run_trim_aot: ${{ inputs.run_trim_aot == true }}

            enable_test_exports: true
            enable_coverage: ${{ inputs.enable_coverage == true }}
        secrets: inherit

    coverage:
        name: "CI: coverage"
        needs: run
        if: ${{ inputs.enable_coverage == true }}
        uses: ./.github/workflows/shared-coverage.yml
        with:
            pr_number: ${{ inputs.pr_number }}
        permissions:
            contents: write
            pull-requests: write
