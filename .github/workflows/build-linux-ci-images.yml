name: Build Linux CI Images

on:
    workflow_dispatch:
    schedule:
        - cron: '23 3 * * 0'
    push:
        paths:
            - .github/ci/linux-image/**
            - .github/workflows/build-linux-ci-images.yml
            - .github/workflows/shared-testing-linux.yml
            - .github/actions/setup-dependencies/action.yml

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: infinilore/infiniframe-ci
    IMAGE_VERSION: v1.0.${{ github.run_number }}

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: Build and smoke test (${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-24.04
                      platform: linux/amd64
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      platform: linux/arm64
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build image for smoke test
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: .github/ci/linux-image/Dockerfile
                  platforms: ${{ matrix.platform }}
                  load: true
                  tags: local/infiniframe-ci:${{ matrix.arch }}
                  cache-from: type=gha,scope=linux-ci-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=linux-ci-${{ matrix.arch }}
            - name: Smoke test image
              run: docker run --rm local/infiniframe-ci:${{ matrix.arch }}
            - name: Push immutable image
              id: push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: .github/ci/linux-image/Dockerfile
                  platforms: ${{ matrix.platform }}
                  push: true
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.arch }}-${{ env.IMAGE_VERSION }}
                  cache-from: type=gha,scope=linux-ci-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=linux-ci-${{ matrix.arch }}
            - name: Save image digest
              run: |
                  echo "${{ matrix.arch }}=${{ steps.push.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY" > "linux-ci-image-${{ matrix.arch }}.digest"
            - name: Upload image digest
              uses: actions/upload-artifact@v7
              with:
                  name: linux-ci-image-digest-${{ matrix.arch }}
                  path: linux-ci-image-${{ matrix.arch }}.digest

    manifest:
        name: Publish multi-platform manifest
        needs: build
        runs-on: ubuntu-24.04
        steps:
            - uses: docker/setup-buildx-action@v4
            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish immutable manifest
              run: |
                  docker buildx imagetools create \
                    --tag "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}" \
                    "${REGISTRY}/${IMAGE_NAME}:x64-${IMAGE_VERSION}" \
                    "${REGISTRY}/${IMAGE_NAME}:arm64-${IMAGE_VERSION}"
                  docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${IMAGE_VERSION}"
