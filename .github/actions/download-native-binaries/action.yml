name: Download Native Binaries
description: Download, normalize, and verify native build artifacts for testing or release workflows

inputs:
    artifact-type:
        description: Artifact naming mode
        required: true
        default: testing

    target-root:
        description: Root path where normalized native artifacts should be written
        required: false
        default: ""

    current-runner-only:
        description: Only download artifacts matching the current OS/arch
        required: false
        default: "false"

runs:
    using: composite
    steps:

        -   name: Resolve Runner Platform
            id: resolve-runner
            shell: bash
            run: |
                set -euo pipefail

                os="$RUNNER_OS"
                arch="$RUNNER_ARCH"

                case "$os" in
                  Windows) lib="windows" ;;
                  Linux)   lib="linux" ;;
                  macOS)   lib="osx" ;;
                  *) echo "Unsupported OS: $os"; exit 1 ;;
                esac

                case "$arch" in
                  X64|x64) arch="x64" ;;
                  ARM64|arm64) arch="arm64" ;;
                  *) echo "Unsupported arch: $arch"; exit 1 ;;
                esac

                echo "lib=$lib" >> "$GITHUB_OUTPUT"
                echo "arch=$arch" >> "$GITHUB_OUTPUT"


        -   name: Resolve Native Artifact Settings
            id: resolve-native-artifact-settings
            shell: bash
            run: |
                set -euo pipefail

                artifact_type="${{ inputs.artifact-type }}"
                input_root="${{ inputs.target-root }}"
                current_only="${{ inputs.current-runner-only }}"

                lib="${{ steps.resolve-runner.outputs.lib }}"
                arch="${{ steps.resolve-runner.outputs.arch }}"

                if [ "$current_only" = "true" ]; then
                  case "$artifact_type" in
                    testing)
                      echo "mode=single" >> "$GITHUB_OUTPUT"
                      echo "artifact_name=native-testing-${lib}-${arch}" >> "$GITHUB_OUTPUT"
                      ;;
                    release)
                      echo "mode=single" >> "$GITHUB_OUTPUT"
                      echo "artifact_name=native-${lib}-${arch}" >> "$GITHUB_OUTPUT"
                      ;;
                    *)
                      echo "Unsupported artifact-type: $artifact_type"
                      exit 1
                      ;;
                  esac
                else
                  case "$artifact_type" in
                    testing) pattern="native-testing-*" ;;
                    release) pattern="native-*" ;;
                    *) echo "Unsupported artifact-type: $artifact_type"; exit 1 ;;
                  esac

                  echo "mode=pattern" >> "$GITHUB_OUTPUT"
                  echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
                fi

                if [ -n "$input_root" ]; then
                  root="$input_root"
                elif [ "$artifact_type" = "testing" ]; then
                  root="src/InfiniFrame.NativeBridge/artifacts/native"
                else
                  root="artifacts/native"
                fi

                echo "root=$root" >> "$GITHUB_OUTPUT"


        -   name: Download Native Build Artifacts (single)
            if: ${{ steps.resolve-native-artifact-settings.outputs.mode == 'single' }}
            uses: actions/download-artifact@v8
            with:
                name: ${{ steps.resolve-native-artifact-settings.outputs.artifact_name }}
                path: artifacts/native


        -   name: Download Native Build Artifacts (all)
            if: ${{ steps.resolve-native-artifact-settings.outputs.mode == 'pattern' }}
            uses: actions/download-artifact@v8
            with:
                pattern: ${{ steps.resolve-native-artifact-settings.outputs.pattern }}
                path: artifacts/native
                merge-multiple: true


        -   name: Normalize Native Artifacts
            shell: bash
            run: |
                set -euo pipefail

                ROOT="${{ steps.resolve-native-artifact-settings.outputs.root }}"
                artifact_type="${{ inputs.artifact-type }}"
                current_only="${{ inputs.current-runner-only }}"

                lib="${{ steps.resolve-runner.outputs.lib }}"
                arch="${{ steps.resolve-runner.outputs.arch }}"

                mkdir -p "$ROOT/windows/x64/Release"
                mkdir -p "$ROOT/windows/arm64/Release"
                mkdir -p "$ROOT/linux/x64/Release"
                mkdir -p "$ROOT/linux/arm64/Release"
                mkdir -p "$ROOT/osx/x64/Release"
                mkdir -p "$ROOT/osx/arm64/Release"

                copy() {
                    src="$1"
                    dst="$2"
                    if [ -d "$src" ]; then
                        cp -R "$src"/. "$dst"/
                    fi
                }

                if [ "$current_only" = "true" ]; then

                  copy "artifacts/native/native-${artifact_type}-${lib}-${arch}" "$ROOT/${lib}/${arch}/Release"

                else

                  copy "artifacts/native/native-testing-windows-x64" "$ROOT/windows/x64/Release"
                  copy "artifacts/native/native-testing-windows-arm64" "$ROOT/windows/arm64/Release"
                  copy "artifacts/native/native-testing-linux-x64" "$ROOT/linux/x64/Release"
                  copy "artifacts/native/native-testing-linux-arm64" "$ROOT/linux/arm64/Release"
                  copy "artifacts/native/native-testing-osx-x64" "$ROOT/osx/x64/Release"
                  copy "artifacts/native/native-testing-osx-arm64" "$ROOT/osx/arm64/Release"

                fi


        -   name: Verify Native Artifacts
            shell: bash
            run: |
                set -euo pipefail

                ROOT="${{ steps.resolve-native-artifact-settings.outputs.root }}"
                current_only="${{ inputs.current-runner-only }}"

                lib="${{ steps.resolve-runner.outputs.lib }}"
                arch="${{ steps.resolve-runner.outputs.arch }}"

                check() {
                  if [ ! -f "$1" ]; then
                    echo "Missing native artifact: $1"
                    return 1
                  fi
                }

                if [ "$current_only" = "true" ]; then

                  case "$lib" in
                    windows)
                      check "$ROOT/${lib}/${arch}/Release/InfiniFrame.Native.dll"
                      check "$ROOT/${lib}/${arch}/Release/WebView2Loader.dll"
                      ;;
                    linux)
                      check "$ROOT/${lib}/${arch}/Release/InfiniFrame.Native.so"
                      ;;
                    osx)
                      check "$ROOT/${lib}/${arch}/Release/InfiniFrame.Native.dylib"
                      ;;
                  esac

                else

                  check "$ROOT/windows/x64/Release/InfiniFrame.Native.dll"
                  check "$ROOT/windows/x64/Release/WebView2Loader.dll"
                  check "$ROOT/windows/arm64/Release/InfiniFrame.Native.dll"
                  check "$ROOT/windows/arm64/Release/WebView2Loader.dll"

                  check "$ROOT/linux/x64/Release/InfiniFrame.Native.so"
                  check "$ROOT/linux/arm64/Release/InfiniFrame.Native.so"

                  check "$ROOT/osx/x64/Release/InfiniFrame.Native.dylib"
                  check "$ROOT/osx/arm64/Release/InfiniFrame.Native.dylib"

                fi

                echo "All native artifacts downloaded and verified."