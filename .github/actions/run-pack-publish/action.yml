name: Run InfiniFrame Pack Publish
description: Executes infiniframe-pack publish for a target project with explicit output.

inputs:
  project:
    description: Path to target app csproj
    required: true
  rid:
    description: Runtime identifier (RID)
    required: true
  configuration:
    description: Build configuration
    required: false
    default: Release
  framework:
    description: Target framework
    required: false
    default: net10.0
  self-contained:
    description: Self-contained mode
    required: false
    default: "true"
  output:
    description: Output directory for packed publish
    required: true

runs:
  using: composite
  steps:
    - name: Run pack publish
      shell: pwsh
      run: |
        infiniframe-pack publish "${{ inputs.project }}" `
          --rid "${{ inputs.rid }}" `
          --configuration "${{ inputs.configuration }}" `
          --framework "${{ inputs.framework }}" `
          --self-contained "${{ inputs['self-contained'] }}" `
          --output "${{ inputs.output }}"
