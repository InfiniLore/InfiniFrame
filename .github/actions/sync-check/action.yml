name: Sync GitHub Check Context
description: Post commit status and optionally complete matching queued/in-progress check runs.

inputs:
    repo:
        description: owner/repo
        required: true
    sha:
        description: Commit SHA
        required: true
    context:
        description: Status/check context name
        required: true
    state:
        description: pending|success|failure|error — used directly when job-status is not provided
        required: false
        default: ''
    status-description:
        description: Short status description — used directly when job-status is not provided
        required: false
        default: ''
    target-url:
        description: URL to link from the status/check
        required: true
    job-status:
        description: Job status (success/failure/cancelled) — when provided, computes state/conclusion/description automatically
        required: false
        default: ''
    success-description:
        description: Description used when job-status is success
        required: false
        default: ''
    failure-description:
        description: Description used when job-status is not success
        required: false
        default: ''
    token-env:
        description: Environment variable that contains a GitHub token
        required: false
        default: GITHUB_TOKEN
    allow-status-422:
        description: Treat status HTTP 422 as non-fatal
        required: false
        default: "false"
    complete-check-runs:
        description: Complete matching queued/in-progress check runs
        required: false
        default: "false"
    check-conclusion:
        description: Conclusion for completed check runs
        required: false
        default: success
    check-summary:
        description: Summary for completed check run output
        required: false
        default: ""
    require-update:
        description: Fail if neither status nor check run could be updated
        required: false
        default: "false"
    create-check-run-if-missing:
        description: Create a completed check run if no queued/in-progress run exists
        required: false
        default: "false"

runs:
    using: composite
    steps:
        -   name: Skip status/check sync in local mode
            if: ${{ env.LOCAL_GHA_SKIP_STATUS == '1' }}
            shell: bash
            run: echo "LOCAL_GHA_SKIP_STATUS=1, skipping GitHub status/check sync."

        -   name: Compute result from job-status
            if: ${{ env.LOCAL_GHA_SKIP_STATUS != '1' && inputs['job-status'] != '' }}
            id: computed
            shell: pwsh
            run: |
                if ("${{ inputs['job-status'] }}" -eq "success") {
                  "state=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "conclusion=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "description=${{ inputs['success-description'] }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                } else {
                  "state=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "conclusion=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                  "description=${{ inputs['failure-description'] }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                }

        -   name: Sync status/check
            if: ${{ env.LOCAL_GHA_SKIP_STATUS != '1' }}
            shell: pwsh
            run: |
                $jobStatus = "${{ inputs['job-status'] }}"

                if ($jobStatus -ne "") {
                  # Finalize mode: use computed values
                  if ("$jobStatus" -eq "success") {
                    $state = "success"
                    $conclusion = "success"
                    $description = "${{ inputs['success-description'] }}"
                  } else {
                    $state = "failure"
                    $conclusion = "failure"
                    $description = "${{ inputs['failure-description'] }}"
                  }
                  $completeCheckRuns = "true"
                  $requireUpdate = "true"
                  $createIfMissing = "true"
                } else {
                  # Direct mode: use provided values
                  $state = "${{ inputs.state }}"
                  $conclusion = "${{ inputs['check-conclusion'] }}"
                  $description = "${{ inputs['status-description'] }}"
                  $completeCheckRuns = "${{ inputs['complete-check-runs'] }}"
                  $requireUpdate = "${{ inputs['require-update'] }}"
                  $createIfMissing = "${{ inputs['create-check-run-if-missing'] }}"
                }

                $argsList = @(
                  "scripts/sync_github_checks.py",
                  "--repo", "${{ inputs.repo }}",
                  "--sha", "${{ inputs.sha }}",
                  "--context", "${{ inputs.context }}",
                  "--state", $state,
                  "--description", $description,
                  "--target-url", "${{ inputs['target-url'] }}",
                  "--token-env", "${{ inputs['token-env'] }}",
                  "--check-conclusion", $conclusion,
                  "--check-summary", $description
                )

                if ("${{ inputs['allow-status-422'] }}" -eq "true") { $argsList += "--allow-status-422" }
                if ($completeCheckRuns -eq "true") { $argsList += "--complete-check-runs" }
                if ($requireUpdate -eq "true") { $argsList += "--require-update" }
                if ($createIfMissing -eq "true") { $argsList += "--create-check-run-if-missing" }

                python @argsList
