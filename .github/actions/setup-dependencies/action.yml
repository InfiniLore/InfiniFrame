name: Setup Dependencies
description: Install and cache all project dependencies including native tooling.

inputs:
    cache-dotnet:
        description: Whether to cache .NET dependencies
        required: false
        default: "true"
    brew-cache-key:
        description: Full Homebrew cache key for macOS runners
        required: false
        default: ""
    brew-restore-key:
        description: Homebrew cache restore key prefix for macOS runners
        required: false
        default: ""
    restore-nativebridge-packages:
        description: Restore InfiniFrame.NativeBridge NuGet packages on Windows
        required: false
        default: "false"

runs:
    using: composite
    steps:
        -   name: Read CI tool versions
            id: versions
            uses: ./.github/actions/read-tool-versions

        -   name: Setup Node
            uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
            with:
                node-version: ${{ steps.versions.outputs.node }}
                cache: npm
                cache-dependency-path: |
                    package-lock.json
                    **/package-lock.json
                    src/InfiniFrame.Js/package-lock.json

        -   name: Setup Python
            uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
            with:
                python-version: '3.x'

        -   name: Setup .NET
            uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
            with:
                dotnet-version: ${{ steps.versions.outputs.dotnet }}
                cache: ${{ inputs['cache-dotnet'] }}
                cache-dependency-path: |
                    **/*.csproj
                    **/*.props
                    **/Directory.Packages.props

        -   name: Setup CMake
            uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa # v4.5.0
            with:
                cmakeVersion: ${{ steps.versions.outputs.cmake }}

        -   name: Cache Homebrew
            if: runner.os == 'macOS'
            uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
            with:
                path: |
                    ~/Library/Caches/Homebrew
                    /usr/local/Cellar/gtk+3
                    /usr/local/Cellar/pkg-config
                    /opt/homebrew/Cellar/gtk+3
                    /opt/homebrew/Cellar/pkg-config
                key: ${{ inputs['brew-cache-key'] }}
                restore-keys: |
                    ${{ inputs['brew-restore-key'] }}

        -   name: Install GTK3 and PowerShell (macOS)
            if: runner.os == 'macOS'
            shell: bash
            run: |
                brew list gtk+3 >/dev/null 2>&1 || brew install gtk+3
                brew list pkg-config >/dev/null 2>&1 || brew install pkg-config

                if ! command -v pwsh >/dev/null 2>&1; then
                    brew list --cask powershell >/dev/null 2>&1 || brew install --cask powershell
                fi

        -   name: Restore NativeBridge NuGet packages (Windows)
            if: runner.os == 'Windows' && inputs['restore-nativebridge-packages'] == 'true'
            shell: pwsh
            run: |
                dotnet restore ./src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj
