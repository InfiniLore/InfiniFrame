name: Setup Dependencies
description: Install and cache all project dependencies including native tooling.

inputs:
    cache-dotnet:
        description: Whether to cache .NET dependencies
        required: false
        default: "true"
    brew-cache-key:
        description: Full Homebrew cache key for macOS runners
        required: false
        default: ""
    brew-restore-key:
        description: Homebrew cache restore key prefix for macOS runners
        required: false
        default: ""
    restore-nativebridge-packages:
        description: Restore InfiniFrame.NativeBridge NuGet packages on Windows
        required: false
        default: "false"

runs:
    using: composite
    steps:
        -   name: Setup Node
            uses: actions/setup-node@v7
            with:
                node-version: 24
                cache: npm
                cache-dependency-path: |
                    package-lock.json
                    **/package-lock.json

        -   name: Setup Python
            uses: actions/setup-python@v7
            with:
                python-version: '3.x'

        -   name: Setup .NET
            uses: actions/setup-dotnet@v6
            with:
                dotnet-version: |
                    8.x
                    9.x
                    10.x
                cache: ${{ inputs['cache-dotnet'] }}
                cache-dependency-path: |
                    **/*.csproj
                    **/*.props
                    **/Directory.Packages.props

        -   name: Setup CMake
            uses: lukka/get-cmake@e6906078ebd1ccb8ce51ab4626ac46a1b5a517e3
            with:
                cmakeVersion: "4.4.0"

        -   name: Setup Node cache for native builds
            uses: actions/setup-node@v7
            with:
                node-version: 24.x
                cache: npm
                cache-dependency-path: src/InfiniFrame.Js/package-lock.json

        -   name: Install GTK3 Deps (Linux)
            if: runner.os == 'Linux'
            uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
            with:
                packages: >
                    at-spi2-core
                    dbus-x11
                    fonts-liberation
                    gsettings-desktop-schemas
                    libatk1.0-dev
                    libegl1
                    libepoxy-dev
                    libgdk-pixbuf2.0-dev
                    libgl1-mesa-dri
                    libglib2.0-dev
                    libgtk-3-dev
                    libharfbuzz-dev
                    libnotify-dev
                    libnotify4
                    libpango1.0-dev
                    libwebkit2gtk-4.1-dev
                    libx11-dev
                    mesa-utils
                    openbox
                    pkg-config
                    x11-utils
                    x11-xserver-utils
                    xfonts-base
                    xvfb
                version: 2.0

        -   name: Verify GTK3 Deps (Linux)
            if: runner.os == 'Linux'
            shell: bash
            run: |
                set -euo pipefail

                if pkg-config --exists gtk+-3.0; then
                  echo "gtk+-3.0 detected via pkg-config."
                  exit 0
                fi

                echo "gtk+-3.0 not found after cached apt step; running fallback apt install."
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                  libgtk-3-dev \
                  libwebkit2gtk-4.1-dev \
                  pkg-config

                pkg-config --exists gtk+-3.0
                echo "gtk+-3.0 is now available."

        -   name: Cache Homebrew
            if: runner.os == 'macOS'
            uses: actions/cache@v6
            with:
                path: |
                    ~/Library/Caches/Homebrew
                    /usr/local/Cellar/gtk+3
                    /usr/local/Cellar/pkg-config
                    /opt/homebrew/Cellar/gtk+3
                    /opt/homebrew/Cellar/pkg-config
                key: ${{ inputs['brew-cache-key'] }}
                restore-keys: |
                    ${{ inputs['brew-restore-key'] }}

        -   name: Install GTK3 and PowerShell (macOS)
            if: runner.os == 'macOS'
            shell: bash
            run: |
                brew list gtk+3 >/dev/null 2>&1 || brew install gtk+3
                brew list pkg-config >/dev/null 2>&1 || brew install pkg-config

                if ! command -v pwsh >/dev/null 2>&1; then
                    brew list --cask powershell >/dev/null 2>&1 || brew install --cask powershell
                fi

        -   name: Restore NativeBridge NuGet packages (Windows)
            if: runner.os == 'Windows' && inputs['restore-nativebridge-packages'] == 'true'
            shell: pwsh
            run: |
                dotnet restore ./src/InfiniFrame.NativeBridge/InfiniFrame.NativeBridge.csproj
