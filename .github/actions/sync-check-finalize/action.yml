name: Sync GitHub Check Final State
description: Complete check-run and status for a context based on a job status value.

inputs:
  repo:
    description: owner/repo
    required: true
  sha:
    description: Commit SHA
    required: true
  context:
    description: Status/check context name
    required: true
  target-url:
    description: URL to link from the status/check
    required: true
  job-status:
    description: Job status (typically success/failure/cancelled)
    required: true
  success-description:
    description: Description used when job-status is success
    required: true
  failure-description:
    description: Description used when job-status is not success
    required: true
  token-env:
    description: Environment variable that contains a GitHub token
    required: false
    default: GITHUB_TOKEN
  allow-status-422:
    description: Treat status HTTP 422 as non-fatal
    required: false
    default: "true"
  require-update:
    description: Fail if neither status nor check run could be updated
    required: false
    default: "true"
  create-check-run-if-missing:
    description: Create a completed check run if no queued/in-progress run exists
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Compute result
      id: result
      shell: pwsh
      run: |
        if ("${{ inputs['job-status'] }}" -eq "success") {
          "state=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "conclusion=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "description=${{ inputs['success-description'] }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } else {
          "state=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "conclusion=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "description=${{ inputs['failure-description'] }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }

    - name: Sync final status/check
      # noinspection UndefinedAction, UndefinedParamsPresent
      uses: ./.github/actions/sync-check
      # noinspection UndefinedAction, UndefinedParamsPresent
      with:
        repo: ${{ inputs.repo }}
        sha: ${{ inputs.sha }}
        context: ${{ inputs.context }}
        state: ${{ steps.result.outputs.state }}
        status-description: ${{ steps.result.outputs.description }}
        target-url: ${{ inputs['target-url'] }}
        token-env: ${{ inputs['token-env'] }}
        allow-status-422: ${{ inputs['allow-status-422'] }}
        complete-check-runs: 'true'
        check-conclusion: ${{ steps.result.outputs.conclusion }}
        check-summary: ${{ steps.result.outputs.description }}
        require-update: ${{ inputs['require-update'] }}
        create-check-run-if-missing: ${{ inputs['create-check-run-if-missing'] }}
