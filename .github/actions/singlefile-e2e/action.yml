name: Run InfiniFrame SingleFile E2E
description: Builds, publishes as single-file, and validates packed output.

inputs:
    tool-project:
        description: Path to InfiniFrame.SingleFile.csproj
        required: false
        default: src/InfiniFrame.SingleFile/InfiniFrame.SingleFile.csproj
    project:
        description: Path to target app csproj
        required: true
    rid:
        description: Runtime identifier (RID)
        required: true
    configuration:
        description: Build configuration
        required: false
        default: Release
    output:
        description: Output directory for packed publish
        required: true
    main-output-name:
        description: Main output filename expected in output directory
        required: true
    forbidden-entries:
        description: Newline-delimited entry names that must not exist in output directory
        required: true

runs:
    using: composite
    steps:
        -   name: Publish single-file via MSBuild target
            shell: bash
            run: |
                set -euo pipefail
                dotnet publish "${{ inputs.project }}" \
                  -t:InfiniFrameSingleFile \
                  -r "${{ inputs.rid }}" \
                  -c "${{ inputs.configuration }}" \
                  -p:InfiniFrameSingleFileActive=true \
                  -p:InfiniFrameSingleFileRid="${{ inputs.rid }}" \
                  -p:InfiniFrameSingleFileSelfContained=true

        -   name: Locate publish output
            shell: bash
            run: |
                set -euo pipefail
                project_dir="$(dirname "${{ inputs.project }}")"
                output_dir="${{ inputs.output }}"
                mkdir -p "$output_dir"
                
                # Find the publish directory
                publish_dir=$(find "$project_dir/bin" -type d -name "publish" -path "*${{ inputs.rid }}*" | head -1)
                if [ -z "$publish_dir" ]; then
                  echo "Could not find publish directory under $project_dir/bin"
                  exit 1
                fi
                
                cp -r "$publish_dir"/* "$output_dir/"
                echo "Copied publish output to $output_dir"

        -   name: Validate output shape
            shell: bash
            run: |
                set -euo pipefail
                
                output_dir="${{ inputs.output }}"
                main_output_name="${{ inputs['main-output-name'] }}"
                main_output="${output_dir}/${main_output_name}"
                
                if [ ! -f "$main_output" ]; then
                  echo "Expected single-file output is missing: $main_output"
                  echo "Contents of output directory:"
                  ls -la "$output_dir/"
                  exit 1
                fi
                
                unexpected="$(find "$output_dir" -mindepth 1 -maxdepth 1 ! -name "$main_output_name" | sed 's|.*/||')"
                if [ -n "$unexpected" ]; then
                  echo "Publish output shape invalid. Unexpected entries:"
                  echo "$unexpected"
                  exit 1
                fi
                
                while IFS= read -r forbidden; do
                  forbidden="$(echo "$forbidden" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
                  [ -z "$forbidden" ] && continue
                  if [ -e "${output_dir}/${forbidden}" ]; then
                    echo "Found unpacked payload in publish output: $forbidden"
                    exit 1
                  fi
                done <<< "${{ inputs['forbidden-entries'] }}"
                
                echo "Pack output validated successfully."
