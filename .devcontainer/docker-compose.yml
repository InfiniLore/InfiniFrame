services:
    dev:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        container_name: infiniframe-dev
        working_dir: /workspace
        volumes:
            - ..:/workspace:cached
            - /tmp/.X11-unix:/tmp/.X11-unix
            - jetbrains-config:/home/devuser/.config/JetBrains
            - jetbrains-data:/home/devuser/.local/share/JetBrains
            - jetbrains-cache:/home/devuser/.cache/JetBrains
            - vscode-server:/home/devuser/.vscode-server
        tty: true
        stdin_open: true
        command: sleep infinity
        environment:
            DOTNET_USE_POLLING_FILE_WATCHER: "1"
            XDG_RUNTIME_DIR: "/tmp/runtime"
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        # Remove deploy block above if you don't want GPU passthrough. 
        # For headless Linux GUI testing, CPU-only is actually preferred (llvmpipe).

volumes:
    nuget-cache:
    nuget-http:
    npm-cache:
    playwright-browsers:
    jetbrains-config:
    jetbrains-data:
    jetbrains-cache:
    vscode-server:
