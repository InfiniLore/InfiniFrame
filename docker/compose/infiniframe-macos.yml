name: infiniframe-macos

services:
    macos-tests:
        image: infiniframe/macos:latest
        build:
            context: ../..
            dockerfile: docker/infiniframe-macos/Dockerfile
        environment:
            - SOLUTION_FILTER=InfiniFrame.GitHubActions.Testing.slnf
            - CONFIGURATION=Release
        entrypoint: ["/bin/sh", "-lc"]
        command:
            - "echo 'macOS runtime tests are not supported by standard Docker containers.' && exit 1"
