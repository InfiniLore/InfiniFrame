name: infiniframe-windows

services:
    windows-tests:
        image: infiniframe/windows:latest
        build:
            context: ../..
            dockerfile: docker/infiniframe-windows/Dockerfile
        working_dir: C:\work
        volumes:
            - ../../:C:\src:ro
            - infiniframe_windows_tests_work:C:\work
        environment:
            - SOLUTION_FILTER=InfiniFrame.GitHubActions.Testing.slnf
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=x64
            - SKIP_NATIVE_BUILD=1
            - NUGET_PACKAGES=C:\.nuget\packages
        entrypoint: ["powershell", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command"]
        command:
            - "& C:/src/docker/infiniframe-windows/bootstrap-workspace.ps1 -Source C:/src -Destination C:/work; & C:/work/docker/infiniframe-windows/tests.ps1"

    windows-tests-playwright:
        image: infiniframe/windows:latest
        build:
            context: ../..
            dockerfile: docker/infiniframe-windows/Dockerfile
        working_dir: C:\work
        volumes:
            - ../../:C:\src:ro
            - infiniframe_windows_playwright_work:C:\work
        environment:
            - SOLUTION_FILTER=InfiniFrame.GitHubActions.Testing.Playwright.slnf
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=x64
            - SKIP_NATIVE_BUILD=1
            - FRAMEWORKS=net8.0 net9.0 net10.0
            - NUGET_PACKAGES=C:\.nuget\packages
        entrypoint: ["powershell", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command"]
        command:
            - "& C:/src/docker/infiniframe-windows/bootstrap-workspace.ps1 -Source C:/src -Destination C:/work; & C:/work/docker/infiniframe-windows/playwright.ps1"

    windows-example-blazorwebview:
        image: infiniframe/windows:latest
        build:
            context: ../..
            dockerfile: docker/infiniframe-windows/Dockerfile
        working_dir: C:\work
        volumes:
            - ../../:C:\src:ro
            - infiniframe_windows_examples_work:C:\work
        environment:
            - SOLUTION_FILTER=InfiniFrame.slnx
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=x64
            - SKIP_NATIVE_BUILD=1
            - NUGET_PACKAGES=C:\.nuget\packages
        entrypoint: ["powershell", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command"]
        command:
            - "& C:/src/docker/infiniframe-windows/bootstrap-workspace.ps1 -Source C:/src -Destination C:/work; & C:/work/docker/infiniframe-windows/example-blazorwebview.ps1"

volumes:
    infiniframe_windows_tests_work:
    infiniframe_windows_playwright_work:
    infiniframe_windows_examples_work:
