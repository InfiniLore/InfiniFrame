name: infiniframe-wayland

services:
    linux-wayland-tests:
        image: infiniframe/linux-wayland:latest
        build:
            context: ../..
            dockerfile: docker/infiniframe-linux-wayland/Dockerfile
        working_dir: /work
        volumes:
            - ../../:/src:ro
            - infiniframe_linux_wayland_tests_work:/work
        environment:
            - SOLUTION_FILTER=InfiniFrame.GitHubActions.Testing.slnf
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=x64
            - USE_HOST_DISPLAY=${USE_HOST_DISPLAY:-0}
            - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
            - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-}
            - NUGET_PACKAGES=/root/.nuget/packages
            - NUGET_FALLBACK_PACKAGES=
        entrypoint: ["/bin/bash", "-lc"]
        command:
            - "bash /src/docker/infiniframe-linux/bootstrap-workspace.sh /src /work && bash /work/scripts/nuget-install.sh && exec bash /work/docker/infiniframe-linux-wayland/tests.sh"
        stdin_open: true
        tty: true

    linux-wayland-tests-playwright:
        image: infiniframe/linux-wayland:latest
        build:
            context: ../..
            dockerfile: docker/infiniframe-linux-wayland/Dockerfile
        working_dir: /work
        volumes:
            - ../../:/src:ro
            - infiniframe_linux_wayland_playwright_work:/work
        environment:
            - SOLUTION_FILTER=InfiniFrame.GitHubActions.Testing.Playwright.slnf
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=x64
            - FRAMEWORKS=net8.0 net9.0 net10.0
            - USE_HOST_DISPLAY=${USE_HOST_DISPLAY:-0}
            - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
            - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-}
            - NUGET_PACKAGES=/root/.nuget/packages
            - NUGET_FALLBACK_PACKAGES=
        entrypoint: ["/bin/bash", "-lc"]
        command:
            - "bash /src/docker/infiniframe-linux/bootstrap-workspace.sh /src /work && bash /work/scripts/nuget-install.sh && exec bash /work/docker/infiniframe-linux-wayland/playwright.sh"
        stdin_open: true
        tty: true

    linux-wayland-example-blazorwebview:
        image: infiniframe/linux-wayland:latest
        build:
            context: ../..
            dockerfile: docker/infiniframe-linux-wayland/Dockerfile
        working_dir: /work
        volumes:
            - ../../:/src:ro
            - infiniframe_linux_wayland_examples_work:/work
        environment:
            - SOLUTION_FILTER=InfiniFrame.slnx
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=x64
            - FRAMEWORKS=net8.0 net9.0 net10.0
            - USE_HOST_DISPLAY=${USE_HOST_DISPLAY:-0}
            - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-}
            - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-}
            - NUGET_PACKAGES=/root/.nuget/packages
            - NUGET_FALLBACK_PACKAGES=
        entrypoint: ["/bin/bash", "-lc"]
        command:
            - "bash /src/docker/infiniframe-linux/bootstrap-workspace.sh /src /work && bash /work/scripts/nuget-install.sh && exec bash /work/docker/infiniframe-linux-wayland/example-blazorwebview.sh"
        stdin_open: true
        tty: true

volumes:
    infiniframe_linux_wayland_tests_work:
    infiniframe_linux_wayland_playwright_work:
    infiniframe_linux_wayland_examples_work:
