name: infiniframe-arm64

services:
    linux-arm64-tests:
        image: infiniframe/linux-arm64:latest
        platform: linux/arm64
        build:
            context: ../..
            dockerfile: docker/infiniframe-linux-arm64/Dockerfile
        working_dir: /work
        volumes:
            - ../../:/src:ro
            - infiniframe_linux_arm64_tests_work:/work
        environment:
            - SOLUTION_FILTER=InfiniFrame.GitHubActions.Testing.slnf
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=arm64
            - USE_HOST_DISPLAY=${USE_HOST_DISPLAY:-0}
            - DISPLAY=${DISPLAY:-}
            - NUGET_PACKAGES=/root/.nuget/packages
            - NUGET_FALLBACK_PACKAGES=
        entrypoint: ["/bin/bash", "-lc"]
        command:
            - "bash /src/docker/infiniframe-linux/bootstrap-workspace.sh /src /work && bash /work/scripts/nuget-install.sh && exec bash /work/docker/infiniframe-linux/tests.sh"
        stdin_open: true
        tty: true

    linux-arm64-tests-playwright:
        image: infiniframe/linux-arm64:latest
        platform: linux/arm64
        build:
            context: ../..
            dockerfile: docker/infiniframe-linux-arm64/Dockerfile
        working_dir: /work
        volumes:
            - ../../:/src:ro
            - infiniframe_linux_arm64_playwright_work:/work
        environment:
            - SOLUTION_FILTER=InfiniFrame.GitHubActions.Testing.Playwright.slnf
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=arm64
            - FRAMEWORKS=net8.0 net9.0 net10.0
            - USE_HOST_DISPLAY=${USE_HOST_DISPLAY:-0}
            - DISPLAY=${DISPLAY:-}
            - NUGET_PACKAGES=/root/.nuget/packages
            - NUGET_FALLBACK_PACKAGES=
        entrypoint: ["/bin/bash", "-lc"]
        command:
            - "bash /src/docker/infiniframe-linux/bootstrap-workspace.sh /src /work && bash /work/scripts/nuget-install.sh && exec bash /work/docker/infiniframe-linux/playwright.sh"
        stdin_open: true
        tty: true

    linux-arm64-example-blazorwebview:
        image: infiniframe/linux-arm64:latest
        platform: linux/arm64
        build:
            context: ../..
            dockerfile: docker/infiniframe-linux-arm64/Dockerfile
        working_dir: /work
        volumes:
            - ../../:/src:ro
            - infiniframe_linux_arm64_examples_work:/work
        environment:
            - SOLUTION_FILTER=InfiniFrame.slnx
            - CONFIGURATION=Release
            - NATIVE_PLATFORM=arm64
            - FRAMEWORKS=net8.0 net9.0 net10.0
            - USE_HOST_DISPLAY=${USE_HOST_DISPLAY:-0}
            - DISPLAY=${DISPLAY:-}
            - NUGET_PACKAGES=/root/.nuget/packages
            - NUGET_FALLBACK_PACKAGES=
        entrypoint: ["/bin/bash", "-lc"]
        command:
            - "bash /src/docker/infiniframe-linux/bootstrap-workspace.sh /src /work && bash /work/scripts/nuget-install.sh && exec bash /work/docker/infiniframe-linux/example-blazorwebview.sh"
        stdin_open: true
        tty: true

volumes:
    infiniframe_linux_arm64_tests_work:
    infiniframe_linux_arm64_playwright_work:
    infiniframe_linux_arm64_examples_work:
